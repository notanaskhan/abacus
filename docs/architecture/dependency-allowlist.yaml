# Container images: referenced only by digest (name:tag@sha256:...), checked by check_dependencies.
containers:
  pgvector/pgvector: approved     # PostgreSQL 17 with pgvector, local and tests (ADR-014, TASK-004)
  versity/versitygw: approved     # S3-compatible with Object Lock, local and tests; MinIO's image is no longer public (ADR-016, TASK-004)
  temporalio/temporal: approved   # Temporal CLI dev server, local and tests (ADR-017, TASK-004)
