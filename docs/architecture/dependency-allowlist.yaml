# Dependency allowlist. Add a package here in the same change that first uses it; check_dependencies enforces it.
# status: approved | pending (approved in principle, awaiting a decision noted in reason)

python:
  runtime:
    fastapi: approved
    uvicorn: approved
    pydantic: approved
    pydantic-settings: approved
    sqlalchemy: approved
    asyncpg: approved
    alembic: approved
    temporalio: approved
    boto3: approved
    httpx: approved
    pyjwt: approved             # bearer-token verification against the identity provider JWKS (TASK-007, ADR-029)
    pandas: approved
    openpyxl: approved          # deterministic spreadsheet rendering (ADR-042)
    pgvector: approved
    cryptography: approved      # envelope encryption (ADR-035)
    opentelemetry-api: approved
    opentelemetry-sdk: approved
    opentelemetry-instrumentation-fastapi: approved
    opentelemetry-exporter-otlp: approved
    sentry-sdk: approved
    structlog: approved         # structured logging helper (ADR-022)
    anthropic: approved         # ai_gateway only (ADR-019)
    workos: approved            # staff sign-in and sessions (DEC-22, ADR-141, Q-01-T05)
    pdfplumber: approved        # upload extraction: PDF text and tables, in an isolated child (SPEC-029 Q1, TASK-054; brings pdfminer.six)
    pypdfium2: approved         # upload previews: PDF page images, server-side (SPEC-029 Q1, ADR-110)
    pillow: approved            # upload previews: images re-encoded server-side, metadata stripped (SPEC-029, ADR-110)
    weasyprint: approved        # deterministic PDF rendering in reporting only, in the isolated child (DEC-16, ADR-320, P-11-T02)
    python-docx: approved       # deterministic DOCX from the same DocBlocks, reporting only (DEC-16, ADR-320, P-11-T02)
    pillow-heif: approved       # HEIC phone photos decoded for OCR in evidence, in the isolated child (DEC-16, ADR-321)
    pyyaml: approved            # parse doc frontmatter and policy YAML in abacus_tools.quality.validate_docs (TASK-001); runtime since Q-01-T20: ECS ops tasks run abacus_tools that read YAML
  dev:
    pytest: approved
    pytest-asyncio: approved
    hypothesis: approved
    testcontainers: approved
    ruff: approved
    pyright: approved
    import-linter: approved
    mutmut: approved
    pip-audit: approved
    bandit: approved
    types-PyYAML: approved      # pyyaml stubs; required for strict Pyright (ADR-009)
    pytest-cov: approved        # coverage floors in make check (ADR-079, TASK-002)
    pytest-xdist: approved      # parallel test workers for the local gate and CI shards (DEC-335, TASK-1206; brings execnet)
    hatchling: approved         # build backend in backend/pyproject.toml (TASK-001 approved plan, step 10)
    types-boto3: approved       # boto3 type stubs for strict Pyright: s3 (TASK-004); kms, sesv2, secretsmanager, ssm, sqs (Q-01-T05)
    asyncpg-stubs: approved     # asyncpg type stubs for strict Pyright (TASK-004)

typescript:
  runtime:
    react: approved
    react-dom: approved
    "@tanstack/react-router": approved
    "@tanstack/react-query": approved
    tailwindcss: approved
    "@radix-ui/*": approved      # shadcn/ui primitives
    class-variance-authority: approved
    clsx: approved
    tailwind-merge: approved
    lucide-react: approved
    "@fontsource/geist": approved           # self-hosted UI font, the plan's design foundation (TASK-091)
    "@fontsource/geist-mono": approved      # self-hosted mono for IDs and figures (TASK-091)
    "@workos-inc/authkit-react": approved  # firm app sign-in through AuthKit (DEC-22, ADR-141)
    "@sentry/browser": approved             # browser error reporting, scrubbed before send (ADR-022, Q-01-T05)
    "@fontsource/arimo": approved           # self-hosted metric-compatible fallback font (F-05-T02)
    "@fontsource/gelasio": approved         # self-hosted serif for statements and letters (F-05-T02)
    "@tanstack/react-table": approved       # headless table state for the DataTable kit (F-05-T02, ADR-011)
    "@tanstack/react-virtual": approved     # row virtualisation for long tables and lists (F-05-T02)
  dev:
    typescript: approved
    vite: approved
    vitest: approved
    "@testing-library/react": approved
    "@playwright/test": approved
    "@axe-core/playwright": approved
    eslint: approved
    prettier: approved
    "@hey-api/openapi-ts": approved   # generated API client (ADR-013)
    typescript-eslint: approved       # ESLint parser and rules for TypeScript (ADR-009, ADR-010)
    "@vitejs/plugin-react": approved  # Vite React/JSX transform (ADR-011)
    "@types/react": approved          # React types for strict tsc (ADR-009)
    "@types/react-dom": approved      # React DOM types for strict tsc (ADR-009)
    jsdom: approved                   # DOM environment for vitest (ADR-077, TASK-002)
    "@tailwindcss/vite": approved     # Tailwind v4's Vite plugin (TASK-012 Q3, founder 2026-10-07)
    "@testing-library/dom": approved  # required peer of @testing-library/react (TASK-012 Q3)

# Container images: referenced only by digest (name:tag@sha256:...), checked by check_dependencies.
containers:
  pgvector/pgvector: approved     # PostgreSQL 17 with pgvector, local and tests (ADR-014, TASK-004)
  versity/versitygw: approved     # S3-compatible with Object Lock, local and tests; MinIO's image is no longer public (ADR-016, TASK-004)
  temporalio/temporal: approved   # Temporal CLI dev server, local and tests (ADR-017, TASK-004)
  clamav/clamav: approved         # malware scanning daemon for uploads, local and staging (ADR-110, P-64, Q-01-T05)
  public.ecr.aws/aws-observability/aws-otel-collector: approved  # OpenTelemetry collector sidecar (ADR-022, Q-01-T05)
  python: approved                # the backend's base image, slim variant, by digest (Q-01-T05, Q-01-T06)
  zaproxy/zap-stable: approved    # OWASP ZAP baseline (passive) scan of staging, weekly in dast.yml; never run locally (QD-9, Q-03-T004, DEC-366)

# Terraform core, providers and registry modules (Q-01-T05), checked by check_dependencies in every *.tf.
# Local modules (./, ../) need no row; modules from git, URLs or buckets are refused.
terraform:
  terraform: approved             # infrastructure as code, version >= 1.10 (ADR-021, ADR-142)
  hashicorp/aws: approved         # the AWS provider (ADR-021, ADR-142)
