# The portal module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: portal.home_v2
    description: 'Portal home v2 (C5 v1.1 portal half, P-08): POR-02 over GET /v1/portal/home and PUT /v1/portal/preferences. Off: both routes answer 404 and the portal entry renders the legacy ClientHome. On: 501 not_implemented until P-08-T13 lands. Off by default. Renewal before expiry or retirement with the legacy path is P-08-T28.'
    owner: ayushkbhatia
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: portal.drop_sort
    description: 'Portal drop sort (C5 section portal-pbc, R-01): POST /v1/portal/binders/{id}/drops, GET /v1/portal/drops/{batch} and the firm void of a wrong rule fulfilment; a decisive code match becomes a rule fulfilment a named person accepts (DEC-58 a). Off: those routes answer 404 and every dropped file waits for the firm to sort it. On: 501 not_implemented until R-01-T09 lands. Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale.'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: portal.third_party_room
    description: 'Third-party room (C5 section portal-pbc, R-01): POR-14 over GET /v1/portal/room and POST /v1/portal/room/suggest, and invitations on delegation. Off: those routes answer 404, a delegation is recorded only and no invitation is sent. On: 501 not_implemented until R-01-T13 lands. Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale.'
    owner: ayushkbhatia
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: portal.settings_editor
    description: 'Portal settings and email template editor (R-01; C16 v1.1; docs/contracts/email-templates.md and portal-settings.md): the POR-20 and ADM-10 writes - template draft save and discard, test send and publish, portal settings draft, publish and logo. Off: those routes answer 404 and the screens show the published values read-only; reads and the onboarding import are not gated. On: 501 not_implemented until their task lands (drafts and publish R-01-T19; test send R-01-T23; settings R-01-T26). Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale.'
    owner: ayushkbhatia
    created: 2026-10-26
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: portal.intake_upload
    description: 'POR-03 "Upload something else" (N-01 with R-01; docs/contracts/firm-intake.md §portal intake; ADR-162): /v1/portal/intake-uploads*. Off: 404 and POR-03 shows no "Upload something else". On: 501 not_implemented until N-01-T14. On for the synthetic tenant first; per firm from the portal go-live.'
    owner: ayushkbhatia
    created: 2026-10-27
    expires: 2027-04-21
    override: DEC-137
    override: DEC-137
    kind: boolean
    default: false
