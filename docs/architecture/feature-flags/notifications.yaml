    default: false
  - name: notifications.email
    description: 'The notification email channel (C16, SES) and the per-firm kill switch for notification email (RB-31). Off by default. Renewal due Thu Feb 25, 2027 (docs/plan/status/flag-renewals-2027.md).'
    owner: ayushkbhatia
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
