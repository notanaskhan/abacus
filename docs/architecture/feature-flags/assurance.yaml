# The assurance module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: audits.cockpit
    description: 'Audits cockpit (A-01; docs/contracts/audits-cockpit.md): AUD-01, AUD-02 and AUD-03 over GET /v1/audits, /{id}/cockpit and /{id}/source-documents, PATCH /{id}/profile and the record-mode phase, release and archive writes. Off: those routes answer 404 and the Audits nav target shows the flag-off state; the legacy board stays reachable until A-01-T21. On: a stubbed route answers 501 not_implemented until its task lands (profile and phase with A-01-T05; index A-01-T08; cockpit A-01-T09; source documents A-01-T10; release and archive A-01-T23). Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale.'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: ledger.tb_workpaper
    description: 'AUD-06 trial balance and leadsheets on C9 v1 (A-02; docs/contracts/c09-ledger.md; SPEC-333). Gates the C9 v1 routes added by A-02-T03: GET /v1/engagements/{id}/trial-balances/{tb}/layers/{layer}, /leadsheets/{area}, /export.xlsx and POST /checks/{check}/issue-link. Off: those routes answer 404 after authorising. On: 501 not_implemented until their task lands (view by layer and leadsheet by area A-02-T10; Open in Excel A-02-T22; issue link A-02-T17). The SPEC-309 to SPEC-311 trial balance routes stay live and ungated (DEC-314). Off until a founder switches it on per firm.'
    owner: notanaskhan
    created: 2026-10-25
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: audits.binder_export
    description: 'Binder export (A-01; docs/contracts/engagement-export-v1.md; SPEC-344; ADR-036): POST and GET /v1/work-items/{id}/exports, GET /v1/exports/{id}, POST /v1/exports/{id}/undo and GET /v1/exports/{id}/download, and the "Export binder…" entry on AUD-02 and AUD-03. Off: those routes answer 404 and the entry is absent. On: 501 not_implemented until their task lands (create, undo and reads A-01-T18; download A-01-T22). Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale.'
    owner: notanaskhan
    created: 2026-10-26
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
