# The evidence module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: uploads.processing
    description: Each upload is read in isolation (text, tables, fields) by a background workflow (SPEC-029; TASK-054). Scanning applies whatever this says. Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: ayushkbhatia
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: evidence.citations_v2
    description: 'C4 v1 citations (P-03): GET /v1/citations and /{id}, relink, and the reserved create. Off: those routes answer 404 and hosts keep the legacy AiTag count link; agents still write v2 rows as dark data. On: the two reads are served (P-03-T08); relink answers 501 until P-03-T12 and create until its first anchor consumer.'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: evidence.viewer_v1
    description: 'C4 v1 source viewer (P-03, SHL-08): the viewer manifest, masked pages, regions and search under /v1/evidence-versions. Off: 404, and hosts keep the legacy EvidencePreview. On: served (P-03-T09); pages come only from masked renditions, so until P-03-T15 a rendered version reads processing and its pages answer 409 preview_outdated (DEC-266).'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: evidence.pii_reveal
    description: 'C4 v1 logged PII reveal (P-03, SHL-08c): POST /v1/evidence-versions/{id}/pii-reveals. Also the reveal kill switch (ADR-097). Off: 404, and the masked value shows with no chip.'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: evidence.viewer_unlock
    description: 'C4 v1 password unlock as a derivation (P-03, SHL-08d): POST /v1/evidence-versions/{id}/unlock. Off: 404, and state d offers only "Ask the client".'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: compliance.legal_holds
    description: 'Legal holds (Q-02-T29; DEC-71 / P-14): GET and POST /v1/legal-holds and POST /v1/legal-holds/{id}/release. Off: those routes answer 404. The hold check, inheritance and the hold workflows are never flagged: a hold already placed stays in force.'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: compliance.firm_export
    description: 'Firm export with dual approval (Q-02-T43; DEC-72): the request, approve and link routes under /v1/firm/data-exports. Off: 404.'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: evidence.withdrawal
    description: 'Client withdrawal of an unaccepted upload (P-06-T19; ADR-162, P-31): POST /v1/engagements/{eid}/evidence-versions/{vid}/withdraw and the start of the EvidenceWithdrawalPurge workflow. Off: the route answers 404 and R-01 hides the withdraw control; a withdrawal already made stays hidden and its purge still runs. Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale. Must be on before PW2 (Jul 13).'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: files.browser
    description: 'FIL-01, the read-only Files browser and document drawer (N-01; docs/contracts/files-browser.md; ADR-158): GET /v1/files/*, /v1/evidence-items/{id}/drawer and /access-log. Off: 404 and the Files nav item renders C-20. On: 501 not_implemented until N-01-T19. Retired in N-01-T30.'
    owner: ayushkbhatia
    created: 2026-10-27
    expires: 2027-01-25
    override: DEC-137
    kind: boolean
    default: false
