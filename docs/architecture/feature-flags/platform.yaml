# The platform module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: compliance.incidents
    description: 'The incident register (Q-02-T33): POST /v1/firm/security/incidents and the staff propagation route. Off: 404. G-02 retires it with security_center.v1.'
    owner: notanaskhan
    created: 2026-10-24
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: rules.reference_sets
    description: 'C21 part A over HTTP (K-02): GET /v1/reference-sets*, GET /v1/due-dates and KNW-04 section j. Off: 404. It does not gate the Python module APIs (platform.api, practice.api), which T-01 and T-02 gate with their own flags. K-02-T01, DEC-1150.'
    owner: ayushkbhatia
    created: 2026-10-29
    expires: 2027-04-27
    override: DEC-137
    kind: boolean
    default: false
  - name: search.palette
    description: 'C15 v1 firm search (P-02, ADR-241): POST /v1/search, the recents routes, ⌘K and the SHL-02 mount. Off: 404. The indexer runs regardless, so a firm''s index is warm before its flip. Off until a founder switches it on per firm; the local seed turns it on for Brightwater Hale. Retired once every live firm has it. P-02-T01, DEC-4504.'
    owner: notanaskhan
    created: 2026-11-12
    expires: 2027-05-07
    override: DEC-137
    kind: boolean
    default: false
  - name: search.agent_mode
    description: 'The palette''s ">" prefix (SHL-02c): installed agents listed for a person to open a Workbench session with; nothing runs until they send (INV-1). Off: ">" is literal search text. Flips per firm only after W-02 ships the WB-01 new-session target. P-02-T01, DEC-4504.'
    owner: notanaskhan
    created: 2026-11-12
    expires: 2027-05-07
    override: DEC-137
    kind: boolean
    default: false
