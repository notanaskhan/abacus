# The agents module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: prompt.evidence.screener
    description: The screener's prompt version per firm (prompt rollouts, SPEC-011 Q3).
    owner: ayushkbhatia
    created: 2026-10-07
    expires: 2027-01-05
    kind: variant
    values: [evidence.screen@v0]
    default: evidence.screen@v0
  - name: upload_review.enabled
    description: The upload reviewer (AI) runs on uploads after their checks, at Routine or above, for the engagement partner (SPEC-030; TASK-059). Synthetic firms only while the data boundary holds. Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: ayushkbhatia
    created: 2026-10-12
    expires: 2027-01-09
    kind: boolean
    default: false
  - name: guidance.drafting
    description: The guidance drafter (AI) drafts why a request is asked and what a good answer looks like, for a person to approve (SPEC-035; TASK-073). Synthetic firms only while the data boundary holds. Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: ayushkbhatia
    created: 2026-10-15
    expires: 2027-01-13
    kind: boolean
    default: false
  - name: matching.enabled
    description: The matcher (AI) proposes which open request an extracted inbox file belongs to, at Routine or above, for the engagement partner, unless code's content rules were decisive (SPEC-033; TASK-066). Synthetic firms only while the data boundary holds. Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: ayushkbhatia
    created: 2026-10-14
    expires: 2027-01-12
    kind: boolean
    default: false
  - name: engagement_agent.enabled
    description: Route automatic screening, retrieval and inbox matching through each engagement's agent, with its activity feed and pause switches (SPEC-027; TASK-050). Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: ayushkbhatia
    created: 2026-10-10
    expires: 2027-01-07
    kind: boolean
    default: false
