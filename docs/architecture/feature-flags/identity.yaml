# The identity module's flags (ADR-089; P-39, F-03-T07). Compiled with every other module's
# file into kernel/_flags.py by `make regenerate`.

flags:
  - name: agents.client_data_optin
    description: 'The firm''s AI opt-in on clients'' data (SPEC-036, TASK-076; Q-02-T06): GET and PUT /v1/firm/ai-client-data. Off: both answer 404, the settings panel is hidden, and the boundary treats the firm as not opted in, so a real firm stays refused at `firm` (fail-closed). Synthetic firms are unaffected. Engagement exclusion is never flagged: it only restricts (DEC-367). Retired once on for every live firm (Q-04-T349).'
    owner: notanaskhan
    created: 2026-10-25
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: portal.sign_in_v2
    description: 'Portal sign-in v2 (C5 v1.1 portal half, P-08): the in-product POR-01 sign-in through the portal BFF, MFA for the DEC-34 floor, invitations v2, and the firm-side contact unlock and MFA reset routes. Off: those routes answer 404 and the portal entry falls back to the hosted OIDC client sign-in (the ClientAccept path). On: 501 not_implemented until P-08-T10, T17, T18 and T21 land. Off by default. Renewal before expiry or retirement with the legacy path is P-08-T28.'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: firm_settings.v2
    description: 'Firm-settings family v1 (G-01): settings overview and sections, people v2, role templates, annual independence, offices, teams and groups, service-line policies, offshore and walls v2 routes. Off: those routes answer 404 and the existing settings routes are unchanged. On: 501 not_implemented until G-01-T04, T05, T08, T09, T12 and T13 land. Off by default.'
    owner: notanaskhan
    created: 2026-10-23
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
  - name: security_center.v1
    description: 'The security center (G-02, SPEC-349; ADM-06): /v1/firm/security* (sign-in and portal policies, sessions, posture), incidents read and decisions, the firm-export schedule, support access and safeguards routes. Off: those routes answer 404 and the legacy support card is unchanged. On: 501 not_implemented until G-02-T14, T18, T19 and T20 land. Renewed or retired in G-02-T27.'
    owner: notanaskhan
    created: 2026-10-26
    expires: 2027-04-21
    override: DEC-137
    kind: boolean
    default: false
