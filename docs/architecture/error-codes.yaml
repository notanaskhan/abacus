# The error-code catalogue (ADR-139, P-36; F-03-T29). Every 409 and 422 `detail` code the API can
# answer with, its HTTP status and the classes that raise it. Facts beside a code are identifiers
# only (abacus.kernel.errors.check_facts). Rebuild with
# `python -m abacus_tools.quality.error_codes --write`; `make check-fast` checks it.
codes:
  acceptance_declined:
    status: 409
    raised_by:
    - abacus.modules.engagements.setup.AcceptanceDeclined
  acceptance_missing:
    status: 409
    raised_by:
    - abacus.modules.engagements.setup.AcceptanceMissing
  accounts_missing:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.service.AccountsMissing
    summary: 'SPEC-038 Q3: bank and payables accounts are confirmed before selecting.'
  action_cap:
    status: 409
    raised_by:
    - abacus.modules.connections.service.ActionCapReached
    summary: The engagement reached its daily cap for this action (SPEC-007 AC-4).
  adjustment_state:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.completion.AdjustmentState
    summary: Approve once; record the client's answer once, after approval.
  ai_assessor_unavailable:
    status: 409
    raised_by:
    - abacus.modules.agents.assess_start.AssessorUnavailable
