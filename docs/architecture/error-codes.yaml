  already_redacted:
    status: 409
    raised_by:
    - abacus.modules.requests.comments.AlreadyRedacted
  already_released:
    status: 409
    raised_by:
    - abacus.modules.assurance.completion.AlreadyReleased
  already_requested:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.flow.AlreadyRequested
    summary: 'AC-4: every item already has a support request.'
  already_signed:
    status: 409
    raised_by:
    - abacus.modules.review.service.AlreadySigned
    summary: The same level is already signed on this exact content.
  already_taken:
    status: 409
    raised_by:
    - abacus.modules.evidence.service.AlreadyTaken
  annotation_invalid:
