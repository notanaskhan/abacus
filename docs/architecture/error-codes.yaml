# The error-code catalogue (ADR-139, P-36; F-03-T29). Every 409 and 422 `detail` code the API can
# answer with, its HTTP status and the classes that raise it. Facts beside a code are identifiers
# only (abacus.kernel.errors.check_facts). Rebuild with
# `python -m abacus_tools.quality.error_codes --write`; `make check-fast` checks it.
codes:
  acceptance_declined:
    status: 409
    raised_by:
    - abacus.modules.engagements.setup.AcceptanceDeclined
  acceptance_missing:
    status: 409
    raised_by:
    - abacus.modules.engagements.setup.AcceptanceMissing
  acceptance_not_ready:
    status: 409
    raised_by:
    - abacus.modules.engagements.acceptance.AcceptanceNotReady
    summary: 'Not ready for decision: a manual check is open (`facts.section`, `facts.open_checks`),
      or the record has not been sent to the partner.'
  acceptance_sent:
    status: 409
    raised_by:
    - abacus.modules.engagements.acceptance.AcceptanceSent
    summary: 'The record was sent to the partner: its answers, risk rating and manual checks are frozen
      (DEC-375).'
  acceptance_template_missing:
    status: 409
    raised_by:
    - abacus.modules.engagements.acceptance.AcceptanceTemplateMissing
    summary: 'The firm has no acceptance questionnaire for the engagement type''s family (`facts.family`):
      templates are database content, loaded before acceptance can start.'
  access_ends_required:
    status: 422
    raised_by:
    - abacus.modules.identity.people.AccessEndsRequired
    summary: A seasonal member needs the date their access ends (AC3.5).
  accounts_missing:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.service.AccountsMissing
    summary: 'SPEC-038 Q3: bank and payables accounts are confirmed before selecting.'
  action_cap:
    status: 409
    raised_by:
    - abacus.modules.connections.service.ActionCapReached
    summary: The engagement reached its daily cap for this action (SPEC-007 AC-4).
  active_content:
    status: 409
    raised_by:
    - abacus.modules.evidence.viewer.ActiveContent
    summary: 'A PDF with active content is kept but never shown (DEC-296, ED-021): every viewer read
      refuses it, whatever was derived before the rule existed.'
  adjustment_state:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.completion.AdjustmentState
    summary: Approve once; record the client's answer once, after approval.
  ai_assessor_unavailable:
    status: 409
    raised_by:
    - abacus.modules.agents.assess_start.AssessorUnavailable
    summary: The flag is off, or no real model route is enabled here.
  ai_client_data_unavailable:
    status: 409
    raised_by:
    - abacus.modules.identity.firm_settings.AiClientDataUnavailable
    summary: 'No provider terms entry covers Bedrock today (ADR-114): nothing to opt in against.'
  ai_drafting_unavailable:
    status: 409
    raised_by:
    - abacus.modules.agents.draft_start.DraftingUnavailable
    summary: The flag is off, or no real model route is enabled here.
  ai_exclusion_reason_required:
    status: 422
    raised_by:
    - abacus.modules.engagements.service.AiExclusionReasonRequired
    summary: Switching AI off for an engagement needs a reason (SPEC-036 §4.6).
  ai_match_unavailable:
    status: 409
    raised_by:
    - abacus.modules.agents.match_start.MatchUnavailable
    summary: No real model route is enabled for the matcher here.
  ai_review_unavailable:
    status: 409
    raised_by:
    - abacus.modules.agents.review_start.ReviewUnavailable
    summary: No real model route is enabled for the reviewer here (TASK-059 D3).
  already_approved:
    status: 409
    raised_by:
    - abacus.modules.identity.walls.AlreadyApproved
  already_connected:
    status: 409
    raised_by:
    - abacus.modules.connections.ledger_import.AlreadyConnected
    summary: The entity's accounting system is connected; an export isn't needed.
  already_decided:
    status: 409
    raised_by:
    - abacus.modules.evidence.service.AlreadyDecided
    - abacus.modules.fieldwork.planning.AlreadyDecided
    - abacus.modules.platform.incident_register.AlreadyDecided
    summary: 'Both people have decided this incident: nothing more is recorded (AC-22).'
  already_member:
    status: 409
    raised_by:
    - abacus.modules.identity.people.AlreadyMember
    - abacus.modules.identity.service.AlreadyMember
    summary: The caller is already on the engagement's team.
  already_redacted:
    status: 409
    raised_by:
    - abacus.modules.requests.comments.AlreadyRedacted
  already_released:
    status: 409
    raised_by:
    - abacus.modules.assurance.completion.AlreadyReleased
  already_requested:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.flow.AlreadyRequested
    summary: 'AC-4: every item already has a support request.'
  already_signed:
    status: 409
    raised_by:
    - abacus.modules.review.service.AlreadySigned
    summary: The same level is already signed on this exact content.
  already_taken:
    status: 409
    raised_by:
    - abacus.modules.evidence.service.AlreadyTaken
  annotation_invalid:
    status: 422
    raised_by:
    - abacus.modules.assurance.trial_balance.AnnotationInvalid
  annual_confirmation_invalid:
    status: 422
    raised_by:
    - abacus.modules.identity.annual_independence.AnnualConfirmationInvalid
    summary: Only the current year can be confirmed, and a decline needs a note.
  approver_invalid:
    status: 422
    raised_by:
    - abacus.modules.evidence.firm_exports.ApproverInvalid
    summary: The approver is the requester, or holds no security-admin or partner-level membership.
  approver_must_differ:
    status: 409
    raised_by:
    - abacus.modules.agents.ai_policy_errors.ApproverMustDiffer
    - abacus.modules.evidence.firm_export_schedule.ScheduleApproverMustDiffer
    - abacus.modules.evidence.firm_exports.ApproverMustDiffer
    summary: The person who approves is never the person who asked (AC-37, DEC-50; DEC-72).
  approver_not_partner:
    status: 422
    raised_by:
    - abacus.modules.identity.walls.ApproverNotPartner
    summary: The named approver must be an active partner-level member other than the walled person and
      the wall's creator, who can see the client (not walled from it).
  archive_locked:
    status: 409
    raised_by:
    - abacus.modules.assurance.completion.AlreadyLocked
  audit_locked:
    status: 422
    raised_by:
    - abacus.modules.identity.service_lines.AuditLocked
    summary: Audit content is visible to the engagement team only; it can never be widened.
  authorization_required:
    status: 422
    raised_by:
    - abacus.modules.connections.entity.AuthorizationRequired
    summary: The consent sheet's authorization toggle was not on (AC-36).
  below_floor:
    status: 422
    raised_by:
    - abacus.modules.evidence.retention.BelowFloor
    summary: The policy keeps records for less time than the published legal floor allows.
  binder_closed:
    status: 409
    raised_by:
    - abacus.modules.requests.closed_binders.BinderClosed
    summary: 'The binder is closed: the client reads it and acts on nothing in it (DEC-461).'
  binder_gate_unmet:
    status: 409
    raised_by:
    - abacus.modules.requests.binders.BinderGateUnmet
    summary: A binder publishes once its engagement meets G3 (the letter), except an intake binder (DEC-39).
  binder_not_draft:
    status: 409
    raised_by:
    - abacus.modules.requests.binders.BinderNotDraft
    summary: Only a Draft or Unpublished binder publishes.
  binder_not_in_work_item:
    status: 422
    raised_by:
    - abacus.modules.evidence.exports.BinderNotInWorkItem
    summary: A scope binder id is not one of the work item's asked PBC binders (DEC-379), or the work
      item has none to export.
  binder_not_published:
    status: 409
    raised_by:
    - abacus.modules.requests.binders.BinderNotPublished
    summary: Unpublish, mark-done and follow-ups act on a Published binder only.
  branding_not_set_up:
    status: 422
    raised_by:
    - abacus.modules.portal.branding.BrandingNotSetUp
    summary: 'The portal has no branding yet: set the display name first.'
  budget_invalid:
    status: 422
    raised_by:
    - abacus.modules.platform.service.BudgetInvalid
    summary: Soft must be positive and at most hard; hard at most the plan's limit (Q3).
  checklist_changed:
    status: 409
    raised_by:
    - abacus.modules.methodology.lifecycle.ChecklistChanged
    summary: 'The checklist is not the one you approved: review it again.'
  checklist_unmet:
    status: 409
    raised_by:
    - abacus.modules.methodology.lifecycle.ChecklistUnmet
    summary: An approval checklist item is not met (`facts.item`).
  citation_required:
    status: 422
    raised_by:
    - abacus.modules.workpapers.tie_out.CitationRequired
  client_contact:
    status: 409
    raised_by:
    - abacus.modules.identity.staff.ClientContact
    summary: Someone who is a client contact of this firm can't also be its staff (SPEC-015 Q5).
  client_record_invalid:
    status: 422
    raised_by:
    - abacus.modules.organisations.service.ClientRecordInvalid
    summary: A value the client record's constraints refuse (an office or partner of another firm, a
      malformed fiscal year end).
  completion_blocked:
    status: 409
    raised_by:
    - abacus.modules.assurance.completion.CompletionBlocked
    summary: Something the step needs isn't there yet; the detail names it.
  completion_invalid:
    status: 422
    raised_by:
    - abacus.modules.assurance.completion.CompletionInvalid
    - abacus.modules.fieldwork.completion.CompletionInvalid
  confirmed_out_of_order:
    status: 422
    raised_by:
    - abacus.modules.platform.incidents.ConfirmedOutOfOrder
    summary: Accrued confirms an incident after discovering it and before propagating it.
  conflict:
    status: 409
    raised_by:
    - abacus.kernel.errors.DomainConflict
  connection_failed:
    status: 409
    raised_by:
    - abacus.modules.connections.connect.ConnectionFailed
    summary: The provider refused or failed the exchange (its code, never its text, is logged).
  connection_flow_moved:
    status: 409
    raised_by:
    - abacus.modules.connections.connect.ConnectionFlowMoved
    summary: 'POR-16 is on for the firm: a client connects from Connections, with the consent sheet (A-02-T16
      review M2). The engagement page no longer starts a flow.'
  connection_needs_reauth:
    status: 409
    raised_by:
    - abacus.modules.connections.entity.ConnectionNeedsReauth
    summary: The client must sign in again before anything is pulled.
  connector_not_available:
    status: 409
    raised_by:
    - abacus.modules.connections.entity.ConnectorNotAvailable
    summary: No adapter for this system is registered here (catalogue honesty, AC-49).
  consent_required:
    status: 409
    raised_by:
    - abacus.modules.requests.lifecycle.ConsentRequired
    summary: '§7216 (ADR P-12, R-01-T13): a request of an engagement that holds a tax return goes to
      a third party only under the client''s `third_party_disclosure` consent (C19). Until T-01 registers
      that consent nobody holds it, so such a delegation is refused (fail closed).'
  consent_version_stale:
    status: 409
    raised_by:
    - abacus.modules.connections.entity.ConsentVersionStale
    summary: 'The consent copy shown is older than the catalogue''s: read the cards again.'
  contact_bound:
    status: 409
    raised_by:
    - abacus.modules.organisations.contacts.ContactBound
    summary: 'The contact signs in as a person already: the address is that person''s own sign-in email,
      not the contact record''s to change.'
  contact_exists:
    status: 409
    raised_by:
    - abacus.modules.organisations.service.ContactExists
    summary: A client has one contact per email address.
  contact_not_portal_user:
    status: 409
    raised_by:
    - abacus.modules.requests.lifecycle.ContactNotPortalUser
    summary: 'The contact has no portal sign-in yet: invite them first, then delegate.'
  content_changed:
    status: 409
    raised_by:
    - abacus.modules.review.sign_offs.ContentChanged
    summary: 'The target changed since the signer saw it: nothing is written.'
  control_set_exists:
    status: 409
    raised_by:
    - abacus.modules.platform.safeguards.ControlSetExists
  control_set_invalid:
    status: 422
    raised_by:
    - abacus.modules.platform.safeguards.ControlSetInvalid
  control_set_same_person:
    status: 409
    raised_by:
    - abacus.modules.platform.safeguards.ControlSetSamePerson
    summary: A second staff member publishes the set its importer imported.
  correction_not_allowed:
    status: 422
    raised_by:
    - abacus.modules.requests.comments.CorrectionNotAllowed
  cursor_invalid:
    status: 422
    raised_by:
    - abacus.kernel.listing.CursorInvalid
    summary: 'The cursor is not one this list issued for this firm and these filters: start again.'
  cutoff_invalid:
    status: 422
    raised_by:
    - abacus.modules.connections.gl_import.CutoffInvalid
    summary: 'SPEC-038 Q2: the cut-off is 30 to 366 days after year end.'
  deactivation_reason_invalid:
    status: 422
    raised_by:
    - abacus.modules.identity.people.DeactivationReasonInvalid
    summary: A person deactivates with `manual`; the other reasons are the system's.
  decider_must_differ:
    status: 409
    raised_by:
    - abacus.modules.platform.governance_errors.DeciderMustDiffer
    summary: An incident decision needs two different people, one partner and the QI (AC-22).
  decision_card_state:
    status: 409
    raised_by:
    - abacus.modules.review.decisions.DecisionCardState
    summary: The card is not in a state that takes this (decided, superseded).
  decision_invalid:
    status: 422
    raised_by:
    - abacus.modules.review.decisions.DecisionInvalid
    summary: An option, factor, subject or provider answer the card can't take.
  decision_kind_differs:
    status: 409
    raised_by:
    - abacus.modules.platform.incident_register.DecisionKindDiffers
    summary: 'The second decider decides what the first did, or nothing: a different call starts over
      only once this one is settled.'
  decision_locked:
    status: 409
    raised_by:
    - abacus.modules.engagements.acceptance.DecisionLocked
    - abacus.modules.engagements.independence.NasDecided
    summary: 'The acceptance record is decided and locked: nothing on it changes any more.'
  demo_clock_refused:
    status: 409
    raised_by:
    - abacus.modules.identity.firm_settings.DemoClockRefused
    summary: A demo clock is only for a synthetic firm, and never in production (F-04.2, F-04.3).
  discovered_in_future:
    status: 422
    raised_by:
    - abacus.modules.platform.incidents.DiscoveredInFuture
    summary: An incident is discovered at or before the moment it is recorded.
  display_name_required:
    status: 422
    raised_by:
    - abacus.modules.identity.settings_registry.DisplayNameRequired
    summary: The name clients see in the portal can't be empty (AC1.3).
  draft_already_decided:
    status: 409
    raised_by:
    - abacus.modules.agents.draft_start.DraftAlreadyDecided
  draft_incomplete:
    status: 422
    raised_by:
    - abacus.modules.engagements.drafts.DraftIncomplete
    - abacus.modules.engagements.intake.IntakeIncomplete
    summary: 'A step of the draft still has a problem (`facts.step`): validate it to see which.'
  drafted_guidance_not_allowed:
    status: 409
    raised_by:
    - abacus.modules.identity.firm_settings.DraftedGuidanceNotAllowed
    summary: Only synthetic firms may show drafted guidance to clients while the data boundary holds
      (ADR-112).
  due_date_required:
    status: 422
    raised_by:
    - abacus.modules.requests.binders.DueDateRequired
    summary: Every request a publish sends needs a due date, its own or the binder's default; the facts
      name the requests without one.
  duplicate_upload:
    status: 409
    raised_by:
    - abacus.modules.evidence.uploads.DuplicateUpload
    summary: The same file (same SHA-256) is already on this item.
  edited_draft_refused:
    status: 422
    raised_by:
    - abacus.modules.agents.draft_start.EditedDraftRefused
    summary: The edited text fails the same checks a draft must pass (SPEC-035 §4.3).
  effect_started:
    status: 409
    raised_by:
    - abacus.modules.agents.follow_up_drafts.FollowUpEffectStarted
    - abacus.modules.evidence.exports.ExportEffectStarted
    - abacus.modules.requests.binders.EffectStarted
    summary: 'The publish''s delivery has started (its grant was consumed): it can no longer be undone.'
  effective_from_too_early:
    status: 422
    raised_by:
    - abacus.modules.methodology.lifecycle.EffectiveTooEarly
    summary: A version takes effect after the one it supersedes began.
  empty_comment:
    status: 422
    raised_by:
    - abacus.modules.requests.comments.EmptyComment
  empty_file:
    status: 422
    raised_by:
    - abacus.modules.connections.ledger_import.EmptyFile
  engagement_archived:
    status: 409
    raised_by:
    - abacus.modules.engagements.record.EngagementArchived
    - abacus.modules.evidence.service.EngagementArchived
    summary: 'The engagement is archived: it is read-only (`archived_write: deny`).'
  engagement_not_open:
    status: 409
    raised_by:
    - abacus.modules.engagements.setup.EngagementNotOpen
  entity_exists:
    status: 409
    raised_by:
    - abacus.modules.organisations.service.EntityExists
    summary: 'The client already has an entity with this name: pick it instead.'
  entity_outside_client:
    status: 422
    raised_by:
    - abacus.modules.engagements.drafts.EntityOutsideClient
    summary: The client entity is not one of the draft's client's entities.
  eqr_approval_required:
    status: 409
    raised_by:
    - abacus.modules.engagements.team_errors.EqrApprovalRequired
    summary: 'The candidate''s competence is not shown by their history here: the quality owner approves
      their eligibility first.'
  eqr_approver_is_ep:
    status: 409
    raised_by:
    - abacus.modules.engagements.team_errors.EqrApproverIsEp
    summary: The EQR's eligibility is approved by the quality owner, never the engagement partner.
  eqr_approver_on_engagement:
    status: 409
    raised_by:
    - abacus.modules.engagements.team_errors.EqrApproverOnEngagement
    summary: The EQR's eligibility is approved by a quality owner with no role on this engagement.
  eqr_not_eligible:
    status: 409
    raised_by:
    - abacus.modules.engagements.team_errors.EqrNotEligible
    summary: 'The candidate fails an eligibility check (each failing check is a fact): pick an eligible
      reviewer.'
  eqr_on_team:
    status: 409
    raised_by:
    - abacus.modules.engagements.team_errors.EqrOnTeam
    summary: 'The engagement quality reviewer is never on the team: pick someone who isn''t, or keep
      the EQR off the team roles.'
  evidence_accepted:
    status: 409
    raised_by:
    - abacus.modules.evidence.withdrawals.EvidenceAccepted
    summary: 'The firm accepted this version (ever): it is never withdrawn (ADR-162 §2).'
  evidence_not_withdrawable:
    status: 409
    raised_by:
    - abacus.modules.evidence.withdrawals.EvidenceNotWithdrawable
    summary: 'Not a client''s detached-key upload (a firm upload, or one stored before detached-key mode):
      nothing can erase it, so it is not withdrawn (ADR-162 §8).'
  export_kind_unsupported:
    status: 422
    raised_by:
    - abacus.modules.evidence.exports.ExportKindUnsupported
    summary: Only an audit work item exports a binder (fail closed until C19 and a tax-export review).
  export_not_awaiting_approval:
    status: 409
    raised_by:
    - abacus.modules.evidence.firm_exports.ExportNotAwaitingApproval
    summary: The export was already approved or declined.
  export_not_ready:
    status: 409
    raised_by:
    - abacus.modules.audit_trail.exports.AuditExportNotReady
    - abacus.modules.evidence.export_download.ExportNotReady
    - abacus.modules.platform.safeguards.WispPackNotReady
    summary: The pack is still being prepared, or failed.
  export_range_invalid:
    status: 422
    raised_by:
    - abacus.modules.audit_trail.exports.ExportRangeInvalid
    summary: '`to_date` is before `from_date`, or the range is longer than 92 days.'
  export_section_missing:
    status: 422
    raised_by:
    - abacus.modules.evidence.exports.ExportSectionUnavailable
    summary: 'The scope asks for a section no provider can write yet (the audit trail until its reader
      is registered): refused at create, before any grant, rather than failing after the window.'
  export_stale:
    status: 409
    raised_by:
    - abacus.modules.evidence.export_currency.ExportStale
    summary: 'Evidence or requests changed after the final export''s snapshot: export again, then record
      the archive (`facts.event_seq` names the newer event).'
  field_value_invalid:
    status: 422
    raised_by:
    - abacus.modules.review.field_values.FieldValueInvalid
    summary: A value, field key or citation note the field history can't take.
  fieldwork_unavailable:
    status: 409
    raised_by:
    - abacus.modules.fieldwork.service.FieldworkUnavailable
  file_answers_other_requests:
    status: 409
    raised_by:
    - abacus.modules.evidence.service.ReturnSpansRequests
    summary: 'A screening return names a file that also answers another request: review it there.'
  file_refused:
    status: 422
    raised_by:
    - abacus.modules.connections.ledger_import.FileRefused
    - abacus.modules.evidence.uploads.UploadRefused
    summary: The malware scanner refused the file (SPEC-029 AC-1; ADR-110). Nothing is stored.
  final_export_required:
    status: 409
    raised_by:
    - abacus.modules.evidence.export_currency.FinalExportRequired
    summary: 'The archive needs a ready final binder export of this work item: none was named, or the
      one named is not final, not ready, voided or expired.'
  finding_invalid:
    status: 422
    raised_by:
    - abacus.modules.fieldwork.findings.FindingInvalid
  firm_already_acted:
    status: 409
    raised_by:
    - abacus.modules.requests.client_undo.FirmAlreadyActed
    summary: 'The firm has acted on the request or the binder since: the client''s Undo is closed.'
  firm_role_held:
    status: 409
    raised_by:
    - abacus.modules.identity.people.FirmRoleHeld
    summary: The person holds another firm role; only a firm admin changes it (AC4.3).
  follow_up_already_sent:
    status: 409
    raised_by:
    - abacus.modules.agents.follow_up_drafts.FollowUpAlreadySent
    summary: 'The follow-up was sent: it can no longer be edited, sent again or dismissed.'
  follow_up_not_waiting:
    status: 409
    raised_by:
    - abacus.modules.agents.follow_up_drafts.FollowUpNotWaiting
    summary: 'The follow-up was dismissed: nothing is waiting to be sent.'
  follow_up_send_alone:
    status: 409
    raised_by:
    - abacus.modules.agents.follow_up_drafts.FollowUpSendAlone
    summary: 'A screening return sends back files: send it on its own, from its sheet.'
  follow_up_template_missing:
    status: 409
    raised_by:
    - abacus.modules.communications.follow_ups.FollowUpTemplateMissing
    summary: No follow-up template is published yet; platform staff import it (C16).
  follow_up_v2_only:
    status: 409
    raised_by:
    - abacus.modules.agents.follow_up_drafts.FollowUpV2Only
    summary: 'This follow-up was drafted from a binder: send it from the binder''s follow-up sheet.'
  gate_unmet:
    status: 409
    raised_by:
    - abacus.modules.engagements.record.GateUnmet
    - abacus.modules.organisations.contacts.GateUnmet
    summary: A gate the step or the create requires is not met (C1 gate providers; `facts.gate`).
  grant_exists:
    status: 409
    raised_by:
    - abacus.modules.identity.client_access.GrantExists
    summary: The person already holds this role on this scope.
  grant_scope_invalid:
    status: 422
    raised_by:
    - abacus.modules.identity.client_access.GrantScopeInvalid
    summary: The scope can't be resolved, or isn't the engagement's (or the firm's) to grant.
  grouping_set_has_problems:
    status: 409
    raised_by:
    - abacus.modules.ledger.mapping.VersionHasProblems
  grouping_set_invalid:
    status: 422
    raised_by:
    - abacus.modules.ledger.mapping.GroupingSetInvalid
  grouping_set_published:
    status: 409
    raised_by:
    - abacus.modules.ledger.mapping.AlreadyPublished
  hold_not_active:
    status: 409
    raised_by:
    - abacus.modules.evidence.holds.HoldNotActive
    summary: 'Only an active hold can be lifted: wait until it finishes applying, or it is already lifted.'
  hold_reason_required:
    status: 422
    raised_by:
    - abacus.modules.engagements.transitions.HoldReasonRequired
    summary: Putting an engagement on hold names a reason from the hold reason codes.
  idempotency_in_progress:
    status: 409
    raised_by:
    - abacus.kernel.uow.idempotency.IdempotencyInProgress
    summary: 'A request with this key and body is still running: retry shortly for its answer.'
  idempotency_key_invalid:
