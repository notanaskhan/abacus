# Human-only audit actions (Q-02-T17; I-AGENT-NEVER at the data layer; ADR-005).
# PROTECTED. An audit action listed here may never be written with actor_kind `agent` or
# `policy`: the `audit_events_human_only` trigger refuses it before commit, whatever the
# permission matrix says. Compiled by `python -m abacus_tools.codegen.human_only_actions` into
# backend/src/abacus/kernel/_human_only_actions.py; the database's `abacus_human_only_actions()`
# is defined by the migration that last changed this list, and a drift test holds the three
# together. Adding an action needs a new migration redefining that function.
#
# Each verb is one of I-AGENT-NEVER's: approve, sign off, release, send, post, decide, accept,
# reject, waive, confirm. Agents propose; humans decide.
actions:
  - action: sign_off.recorded
    verb: sign off
  - action: report.approved
    verb: approve
  - action: report.released
    verb: release
  - action: review.released
    verb: release
  - action: review.decided
    verb: decide  # evidence accept, reject and send back (SPEC-019)
  - action: review_decision.created
    verb: decide  # the audit action of an evidence accept, reject or send back (P-01-T13, 0117)
  - action: review_decision.undone
    verb: decide  # undoing one is a decision too (DEC-24, ADR-161; P-01-T13, 0117)
  - action: evidence.accepted
    verb: accept
  - action: materiality.decided
    verb: decide
  - action: going_concern.decided
    verb: decide
  - action: risk.approved
    verb: approve
  - action: sample.approved
    verb: approve
  - action: statement.approved
    verb: approve
  - action: procedure.concluded
    verb: decide
  - action: guidance_draft.approved
    verb: approve
  - action: independence.confirmed
    verb: confirm
  - action: engagement.accepted
    verb: accept
  - action: legal_hold.placed
    verb: decide
  - action: legal_hold.lifted
    verb: decide  # Q-02-T30 (migration 0125)
  - action: firm_export.approved
    verb: approve
  - action: firm_export.declined
    verb: reject  # Q-02-T30 (migration 0125)
  - action: retention_policy.updated
    verb: decide  # Q-02-T30 (migration 0125)
  - action: firm.ai_client_data_opted_in
    verb: confirm
  - action: engagement.acceptance_recorded
    verb: accept  # SPEC-025 §14 gate fact G1 (ED-011)
  - action: engagement.letter_recorded
    verb: confirm  # SPEC-025 §14 gate fact G3 (ED-011)
  - action: independence.declined
    verb: decide  # SPEC-025 §14, the counterpart of independence.confirmed (ED-011)
  - action: follow_up.sent
    verb: send  # P-06-T14 (DEC-74): a follow-up to a client is sent by a person
  - action: assurance.phase_recorded
    verb: decide  # A-01-T05 (DEC-262, 0135): a person records an assurance phase in record mode
  - action: team.approved
    verb: approve  # P-07-T30 (DEC-327, 0155): the engagement partner approves the team
  - action: eqr.eligibility_approved
    verb: approve  # P-07-T30 (DEC-327, 0155): the quality owner approves an EQR's eligibility
  - action: portal_mfa.reset
    verb: decide  # P-08-T21 (DEC-329, 0156): a firm person resets a client's second step
  - action: contact.unlocked
    verb: decide  # P-08-T21 (DEC-329, 0156): a firm person clears a client's portal lock
  - action: fulfilment.voided
    verb: decide  # a person voids a wrong rule link (R-01 Story 2.2; TASK-1248, 0159)
  - action: acceptance.decided
    verb: decide  # P-07-T35 (DEC-372, 0163): the engagement partner decides acceptance (SPEC-332 AC-6)
  - action: acceptance.review_completed
    verb: decide  # P-07-T35 (DEC-372, 0163): the named risk partner completes the review (AC-4)
  - action: conflict.cleared
    verb: decide  # P-07-T36 (DEC-373, 0164): a partner or manager assesses a conflict hit (SPEC-332 AC-25)
  - action: independence.annual_confirmed
    verb: confirm  # G-01-T13 (DEC-91, DEC-383, 0168): a person confirms their own annual independence
  - action: independence.annual_declined
    verb: decide  # G-01-T13 (DEC-383, 0168): a person declines it, with a note
  - action: independence.statement_published
    verb: decide  # G-01-T13 (DEC-381, DEC-383, 0168): a firm admin publishes the statement
  - action: service_line_policy.updated
    verb: decide  # G-01-T12 (DEC-380, DEC-383, 0168): a firm decides who reads a line's content
  - action: independence.concluded
    verb: decide  # P-07-T41 (DEC-428, 0175): the engagement partner concludes independence (SPEC-332 AC-18)
  - action: nas.evaluated
    verb: decide  # P-07-T41 (DEC-428, 0175): a NAS evaluation, decided by the engagement partner (AC-21)
  - action: decision.decided
    verb: decide  # P-04-T23 (DEC-503, 0212): the card's reserved person decides (ADR-160 clause 8)
  - action: decision.reassessed
    verb: decide  # P-04-T23 (DEC-503, 0212): No change, or a superseding card (SHL-11 d, h)
  - action: proposal.approved
    verb: approve  # P-04-T24 (DEC-601, 0231): a person approves the agent's change set (ADR-161 clause 2)
  - action: proposal.approved_with_edits
    verb: approve  # P-04-T24 (DEC-601, 0231): approve with edits, each with a citation note
  - action: proposal.rejected
    verb: reject  # P-04-T24 (DEC-601, 0231): reject with a reason code (SHL-10 f)
  - action: proposal.routed
    verb: decide  # P-04-T24 (DEC-601, 0231): a person sends it to a named approver (SHL-10 d)
  - action: suggestion.adopted
    verb: accept  # P-04-T24 (DEC-601, 0231): a person adopts one suggested value (C-31)
  - action: suggestion.edited
    verb: accept  # P-04-T24 (DEC-601, 0231): adopted with an edit and its citation note
  - action: suggestion.dismissed
    verb: reject  # P-04-T24 (DEC-601, 0231): a person dismisses a suggestion
  - action: ai_policy.approved
    verb: approve  # G-02-T24 (ED-180, 0244): a second partner approves an AI policy version (AC-37)
  - action: ai_policy.declined
    verb: reject  # G-02-T24 (ED-180, 0244): a second partner declines it
  - action: assurance.release_recorded
    verb: release  # A-01-T23 (DEC-590, 0226): the engagement partner records the external release
  - action: assurance.archive_recorded
    verb: decide  # A-01-T23 (DEC-591, 0226): a manager or the partner records the external archive
  - action: methodology_version.approved
    verb: approve  # K-01-T06: the QM owner approves a methodology version (DEC-657)
  - action: client_import.row_decided
    verb: decide  # P-07-T52: a person's decision on an imported row (DEC-657)
  - action: checkpoint.approved
    verb: approve  # P-04-T32 (SHL-16 b; DEC-804, 0290): a person approves a proposed checkpoint
  - action: checkpoint.rejected
    verb: reject  # P-04-T32 (SHL-16 e; DEC-804, 0290)
  - action: checkpoint.restored
    verb: decide  # P-04-T32 (SHL-16 c; DEC-804, 0290): restoring is a person's decision
