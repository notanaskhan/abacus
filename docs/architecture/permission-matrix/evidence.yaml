# The evidence module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Legal holds (Q-02-T29, T30; conflict C-10; DEC-71 / P-14) ---
  # `level_in(partner)` is the derived `firm_partner` (DEC-132). Placing and lifting are human-only.
  legal_hold.read:          {firm_admin: allow, security_admin: allow, firm_partner: allow, quality_partner: allow, agent: deny, system: deny}   # metadata and counts; never the details text
  legal_hold.place:         {firm_admin: allow, security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required}
  legal_hold.lift:          {firm_admin: allow, security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required}
  # --- Evidence ---
  evidence.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support_content: allow   # SPEC-012
  evidence.upload:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    client_admin: allow
    client_contributor: assigned_only
    third_party: delegated_only   # R-01-T13 (DEC-387): POR-14, the delegated request only
    system: allow             # retrieval via connections
  evidence.accept:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    staff: firm_setting(staff_can_accept_evidence)   # DEC-37 (P-06 §4.4): off unless the firm turns it on
    agent: deny               # ADR-005
  evidence.reject:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    staff: firm_setting(staff_can_accept_evidence)   # DEC-37 (P-06 §4.4)
    agent: deny               # ADR-005
  review_decision.undo:     # P-01-T13 (DEC-24, ADR-161; DEC-214): the cells of evidence.accept and reject; the service also authorises the original decision's own action and only its decider may undo
    independence: required
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    staff: firm_setting(staff_can_accept_evidence)
    agent: deny               # ADR-005
    system: deny              # ADR-005
  evidence.void:            {engagement_partner: allow, manager: allow, requires: reason}
  evidence.withdraw:        {client_admin: client_visible_only, client_contributor: assigned_only, third_party: delegated_only, agent: deny, system: deny}   # ADR-162 (P-31): an unaccepted client upload; every firm role denied (C5 stub, P-06-T01)
  # --- Review queues (SPEC-004 Q7, Q8; TASK-019) ---
  review.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: deny               # ADR-005
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  review.take:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  review.assign:           {engagement_partner: allow, manager: allow, agent: deny, independence: required}
  export.create:            {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required, mfa_recent: required, not_offshore: required}   # TASK-1207: an export hands over client content (DEC-52); A-01 §4.4 (A-01-T17): independence, and the agent and system denied outright (INV-1); support roles hold no cell (SPEC-012: read-only)
  export.read:              {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # A-01-T17: the export sheet's history and poll (engagement-export v1)
  export.download:          {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required, mfa_recent: required, not_offshore: required}   # A-01-T17: the service also requires the requester or an export.create holder on the engagement
  # --- Statement transactions (SPEC-312; TASK-324) ---
  statement.approve:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # a person approves the reconciled transactions (ADR-005; a database CHECK agrees); reading them follows evidence.read
  # --- Trust kit, C4 v1 (P-03-T02; ADR-166 for P-48; P-03 §4.3) ---
  citation.read:
    independence: required   # client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    eqr_reviewer: allow
    agent: task_scope
    client_service: deny     # clients and client service never see citations (INV-4)
    client_admin: deny
    client_contributor: deny
    platform_support: deny
    platform_support_content: deny
  citation.relink:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # a person re-verifies on the successor (INV-1)
  citation.create:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # reserved: answers 501 until its first anchor consumer
  pii.reveal:               {engagement_partner: allow, manager: allow, senior: allow, staff: allow, eqr_reviewer: allow, agent: deny, system: deny, client_service: deny, client_admin: deny, client_contributor: deny, independence: required, not_offshore: required, mfa_recent: required}   # SHL-08c; DEC-52, DEC-60 (the value is never logged)
  evidence.unlock:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, client_admin: deny, client_contributor: deny, independence: required}   # SHL-08d: the password is never stored or logged
  # --- Retention policies (Q-02-T23; ADM-06h, FIL-02a) ---
  # Firm-level; floors and defaults are platform content set by staff routes (STAFF marker).
  # Q-02-T30 (DEC-227): `retention_policy.read` is the plan's `retention.read` (every firm role,
  # metadata only) and `retention_policy.update` its `retention_policy.manage`.
  retention_policy.read:    {firm_admin: allow, security_admin: allow, quality_partner: allow, practice_leader: allow, firm_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}
  retention_policy.update:  {firm_admin: allow, security_admin: allow, agent: deny, system: deny, mfa_recent: required}   # 422 below_floor; a locked policy is never shortened
  # --- Firm export with dual approval (Q-02-T30 rows; routes with Q-02-T43; DEC-72, C-11) ---
  # The service holds requester != approver and that download is the requester's or approver's.
  firm_export.request:      {security_admin: allow, agent: deny, system: deny, mfa_recent: required}
  firm_export.approve:      {security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required}
  firm_export.download:     {security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required, not_offshore: required}   # TASK-1207 (DEC-52)
  firm_export.read:         {firm_admin: allow, security_admin: allow, firm_partner: allow, agent: deny, system: deny}
  firm_export.schedule:     {security_admin: allow, agent: deny, system: deny, mfa_recent: required}   # G-02-T02 (DEC-72): the monthly schedule; a partner approves it once through firm_export.approve
