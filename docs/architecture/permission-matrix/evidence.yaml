# The evidence module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  legal_hold.place:         {firm_admin: allow, mfa_recent: required}
  legal_hold.lift:          {firm_admin: allow, mfa_recent: required}
  # --- Evidence ---
  evidence.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support_content: allow   # SPEC-012
  evidence.upload:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    client_admin: allow
    client_contributor: assigned_only
    system: allow             # retrieval via connections
  evidence.accept:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    staff: firm_setting(staff_can_accept_evidence)   # DEC-37 (P-06 §4.4): off unless the firm turns it on
    agent: deny               # ADR-005
  evidence.reject:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    staff: firm_setting(staff_can_accept_evidence)   # DEC-37 (P-06 §4.4)
    agent: deny               # ADR-005
  evidence.void:            {engagement_partner: allow, manager: allow, requires: reason}
  evidence.withdraw:        {client_admin: client_visible_only, client_contributor: assigned_only, agent: deny, system: deny}   # ADR-162 (P-31): an unaccepted client upload; every firm role denied (C5 stub, P-06-T01)
  # --- Review queues (SPEC-004 Q7, Q8; TASK-019) ---
  review.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: deny               # ADR-005
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  review.take:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  review.assign:           {engagement_partner: allow, manager: allow, agent: deny, independence: required}
  export.create:            {engagement_partner: allow, manager: allow, mfa_recent: required}
  # --- Statement transactions (SPEC-312; TASK-324) ---
  statement.approve:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # a person approves the reconciled transactions (ADR-005; a database CHECK agrees); reading them follows evidence.read
  # --- Trust kit, C4 v1 (P-03-T02; ADR-166 for P-48; P-03 §4.3) ---
  citation.read:
    independence: required   # client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    eqr_reviewer: allow
    agent: task_scope
    client_service: deny     # clients and client service never see citations (INV-4)
    client_admin: deny
    client_contributor: deny
    platform_support: deny
    platform_support_content: deny
  citation.relink:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # a person re-verifies on the successor (INV-1)
  citation.create:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # reserved: answers 501 until its first anchor consumer
  pii.reveal:               {engagement_partner: allow, manager: allow, senior: allow, staff: allow, eqr_reviewer: allow, agent: deny, system: deny, client_service: deny, client_admin: deny, client_contributor: deny, independence: required, not_offshore: required, mfa_recent: required}   # SHL-08c; DEC-52, DEC-60 (the value is never logged)
  evidence.unlock:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, client_admin: deny, client_contributor: deny, independence: required}   # SHL-08d: the password is never stored or logged
