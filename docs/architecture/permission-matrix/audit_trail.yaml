# The audit_trail module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  audit.read:               {firm_admin: allow, practice_leader: allow, quality_partner: allow}   # SPEC-304 (TASK-305): the firm's audit log explorer; identifiers only (ADR-007)
  # --- Audit trail and export ---
  audit_event.read:         {engagement_partner: allow, manager: allow, quality_partner: in_scope, practice_leader: in_scope, firm_admin: allow, security_admin: allow, platform_support: allow, platform_support_content: allow, agent: deny, system: deny}   # G-02-T02 (SPEC-349 §9, DEC-60): + security_admin (metadata), practice_leader in scope; values only with the target's content read (G-02-T09)
  record_activity.read:     {firm_admin: allow, practice_leader: in_scope, quality_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_service: allow, agent: deny, system: deny}   # P-07-T57 (DEC-718): CLI-02 and ENG-02 Activity lines, identifiers in the actor grammar; per event through visible(), a client's own events behind client.read
  audit_event.read_firm_level:   {firm_admin: allow, security_admin: allow, quality_partner: allow, platform_support: allow, platform_support_content: allow, agent: deny, system: deny}   # G-02-T08 (DEC-434): events with no engagement (sign-ins, security settings, walls, unscoped history); engagement roles never
  audit_event.read_request_context: {firm_admin: allow, security_admin: allow, quality_partner: allow, agent: deny, system: deny}   # G-02-T08 (DEC-420 M2): ip, device, session; null for every other reader, and the IP filter matches nothing for them
  audit_event.read_firm_values: {quality_partner: allow, agent: deny, system: deny}   # G-02-T09 (DEC-435, ADR-024): values of firm-level events, the QM owner only; engagement events need engagement.read
  audit_event.export:       {security_admin: allow, quality_partner: in_scope, practice_leader: in_scope, agent: deny, system: deny, mfa_recent: required}   # G-02-T02: ADM-07 export, one person with fresh MFA (DEC-415 Q8); audited request and download
  audit_export.read:        {security_admin: allow, quality_partner: in_scope, practice_leader: in_scope, agent: deny, system: deny}   # G-02 security review L5: an export's status, the requester's own; no fresh MFA for a read
