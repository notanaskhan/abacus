# The platform module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  budget.read:              {firm_admin: allow, practice_leader: allow, platform_support: allow, platform_support_content: allow}   # SPEC-007
  budget.manage:            {firm_admin: allow, mfa_recent: required}     # SPEC-007 Q3
  # Q-02-T30 row; the create route lands with Q-02-T33 (G-02 adds incident.read and .decide).
  incident.manage:          {security_admin: allow, agent: deny, system: deny}
  incident.read:            {security_admin: allow, firm_admin: allow, firm_partner: allow, agent: deny, system: deny}   # G-02-T02: ADM-06 register and drawer
  incident.decide:          {security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required}   # G-02-T02: close as not reportable or start notification; one partner and the QI, distinct (409 decider_must_differ)
  # --- K-02-T01 (DEC-1150; K-02 §4.4; C21 part A): published reference sets, read by every firm
  # role and the agent at task scope. There are no write actions: the operator CLI is the only
  # writer until PLT-01 (G-04), through owner-only definer functions.
  reference_set.read:         {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # GET /v1/reference-sets*
