# The platform module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  budget.read:              {firm_admin: allow, practice_leader: allow, platform_support: allow, platform_support_content: allow}   # SPEC-007
  budget.manage:            {firm_admin: allow, mfa_recent: required}     # SPEC-007 Q3
  # Q-02-T30 row; the create route lands with Q-02-T33 (G-02 adds incident.read and .decide).
  incident.manage:          {security_admin: allow, agent: deny, system: deny}
  incident.read:            {security_admin: allow, firm_admin: allow, firm_partner: allow, agent: deny, system: deny}   # G-02-T02: ADM-06 register and drawer
  incident.decide:          {security_admin: allow, firm_partner: allow, agent: deny, system: deny, mfa_recent: required}   # G-02-T02: close as not reportable or start notification; one partner and the QI, distinct (409 decider_must_differ)
  # --- K-02-T01 (DEC-1150; K-02 §4.4; C21 part A): published reference sets, read by every firm
  # role and the agent at task scope. There are no write actions: the operator CLI is the only
  # writer until PLT-01 (G-04), through owner-only definer functions.
  reference_set.read:         {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # GET /v1/reference-sets*
  # --- Agent-minute usage (P-10-T08; P-10 §4.3; ADR-148): minutes by service line, engagement and capability; never USD.
  usage.read:               {firm_admin: allow, practice_leader: allow, firm_partner: allow, agent: deny, system: deny}
  # --- C15 v1 (P-02-T01; P-02 §4.4; ADR-241): firm search. A firm-level read: each result group is
  # filtered by its own target's read action and scope kind at query time, walls included. Client
  # roles, the agent, the system, the QI (no client content without break-glass) and break-glass
  # support sessions (P-02 OQ-5) are absent, so they are denied.
  search.read:              {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # POST /v1/search, GET /v1/search/recents
  search_recent.record:     {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # POST /v1/search/recents: own recents only
  # --- G-04-T02 (SPEC-680 §4.4; DEC-5202): plan & usage (ADM-14) and the Support panel (SHL-05).
  # `security_admin` never reads Plan & seats (ADM-01e); the partner level approves plan requests;
  # the agent, the system, break-glass principals, console staff and every portal principal are
  # denied every G-04 action (INV-1, INV-4).
  plan.read:                        {firm_admin: allow, practice_leader: allow, firm_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny, security_admin: deny}   # GET /v1/firm/plan, budget-alerts, billing-rates, plan-requests (not security_admin, ADM-01e)
  budget_alert.manage:              {firm_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny, mfa_recent: required}   # PUT /v1/firm/budget-alerts with version (409 stale_version)
  billing_contact.manage:           {firm_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny}   # PUT /v1/firm/plan/billing-contact
  plan_request.create:              {firm_admin: allow, firm_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny}   # POST /v1/firm/plan-requests and /withdraw (the requester)
  plan_request.approve:             {firm_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny, mfa_recent: required}   # approve and decline; never the requester (409 plan_request_self_approval, DB CHECK)
  support.chat:                     {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny}   # GET /v1/support/conversation and POST messages: the caller's own thread only (OWN in the service)
  help.read:                        {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny}   # GET /v1/help/articles* (published only)
  status.read:                      {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, platform_admin: deny, platform_support_desk: deny}   # GET /v1/status (core components plus this firm's installed integrations)
  # --- G-04-T02 staff section (SPEC-680 §4.4; DEC-5201, DEC-5202): Accrued console staff on the staff
  # issuer only. `platform_admin` and `platform_support_desk` come from the staff token's claims and are
  # never a firm membership role; every firm, portal, agent, system and break-glass principal is denied.
  platform_tenant.read:                 {platform_admin: allow, platform_support_desk: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny}   # GET /v1/platform/tenants*, regions, support-sessions, plan-requests, provisioning/{id} (metadata only)
  platform_tenant.provision:            {platform_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny, mfa_recent: required}   # POST /v1/platform/tenants and /{code}/sandbox (Idempotency-Key)
  platform_entitlements.update:         {platform_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny, mfa_recent: required}   # PATCH /v1/platform/tenants/{code}/entitlements with a reason; plan-requests mark-applied
  platform_support_session.request:     {platform_admin: allow, platform_support_desk: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny}   # POST /v1/support/sessions (staff issuer); US attestation for content on tax tenants
  platform_support.reply:               {platform_admin: allow, platform_support_desk: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny}   # the support queue: conversations and replies
  platform_status.manage:               {platform_admin: allow, platform_support_desk: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny}   # status incidents: post, update, resolve (≤ 280 characters, no firm or client name)
  platform_content.read:                {platform_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny}   # the Publications queue (drafts of help articles and C21 reference sets)
  platform_content.publish:             {platform_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, platform_support: deny, platform_support_content: deny, firm_admin: deny, security_admin: deny, practice_leader: deny, quality_partner: deny, firm_partner: deny, firm_manager: deny, engagement_partner: deny, manager: deny, senior: deny, staff: deny, reviewer: deny, eqr_reviewer: deny, specialist: deny, client_service: deny, mfa_recent: required}   # two-person publish and withdraw (409 approver_is_drafter)
