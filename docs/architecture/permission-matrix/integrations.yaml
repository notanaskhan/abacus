# The integrations module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Write capabilities (A-02-T15; ADR-150, P-17, DEC-46; SPEC-333 AC-50) ---
  write_capability.execute: {agent: deny, system: deny}   # no role holds it: every write to a client's system is refused and audited (registry v1 enables none); declared so the generated tests prove every principal, the agent included, is refused (I-AGENT-NEVER)
  # --- ADM-08 tax-engine settings (T-01-T02 stub; DEC-1156): reading the settings is its own
  # action so changing them can carry a fresh second factor.
  integration.read:           {security_admin: allow, firm_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # GET /v1/firm/integrations/{key}/settings
  integration.configure:      {security_admin: allow, firm_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # PUT settings and mappings
  integration.test:           {security_admin: allow, firm_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # format check of the latest engine file
  # --- W-01-T02 Connect (C20 v2; SPEC-659; DEC-5045). `integration.read` stays ADM-08's admin-only settings read;
  # the catalogue and the detail drawer read through `integration_catalog.read`, open to every firm staff role.
  integration_catalog.read:           {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # WB-10 catalogue, WB-11 detail and events (honest availability, viewer-relative)
  integration.read_client_companies:  {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # WB-11 d client companies through connections.api, visible() and walls, no hidden counts
  integration.connect_firm:           {security_admin: allow, firm_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, mfa_recent: required}   # Enable, Reconnect, firm-app enable (OQ-1)
  integration.disconnect_firm:        {security_admin: allow, firm_admin: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, mfa_recent: required}   # typed-name disconnect; firm-app disable suspends client connections (AC-25)
  integration.connect_personal:       {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # acting as you; the service binds the install to the caller
  integration.disconnect_personal:    {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the caller's own personal integration only
  integration.complete_connect:       {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the OAuth callback; the state proves the original action and the person
  integration.interest:               {firm_admin: allow, security_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # Notify me (idempotent)
  integration_catalog.import:         {client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the platform operator's ops task only (abacus_ops); no firm principal holds it (AC-32)
