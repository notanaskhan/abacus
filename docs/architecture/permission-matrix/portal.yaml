# The portal module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's
# file into identity/authz/_matrix.py by `make regenerate`.
#
# C5 v1.1 portal half (P-08-T01 stub; P-08 §4.3, §4.9). Client actions: no firm role, the agent
# and system principals denied. The home reads one scope (`scope_only`: a grant must cover it,
# INV-4); the service also refuses grants that do not open the full shell (third party, K-1 only).
# The plan's `portal.home.read` and `portal.preferences.update` are spelt `portal_home.read` and
# `portal_preferences.update`: an action is `<entity>.<verb>` with one dot (DEC-139).
#
# C5 section portal-pbc (R-01-T01 stub; R-01 §4.3). The plan's `portal.documents.read` is spelt
# `portal_documents.read` (DEC-139). One read action serves the binder picker, POR-03, POR-04,
# the drop poll and, for third parties, POR-14 and its suggest. R-01-T13 (DEC-387) adds the
# `third_party` role (the holder of a `request_item` grant) with `delegated_only`: an item whose
# open delegation is the person's, so the room authorises row by row and reaches nothing else.

actions:
  portal_home.read:         {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-02, GET /v1/portal/home
  portal_preferences.update: {client_admin: allow, client_contributor: allow, agent: deny, system: deny}   # POR-02 b, the person's own per-scope preferences
  portal_documents.read:    {client_admin: allow, client_contributor: allow, third_party: delegated_only, agent: deny, system: deny, scope_only: required}   # POR-03, POR-04, POR-14; GET /v1/portal/binders, binders/{id}, request-items/{id}, room, drops/{batch}; POST room/suggest
  # --- C16 v1.1: portal settings and preview (R-01-T16 stub; R-01 §4.3; ADM-10) ---
  # The plan's `portal.settings.read` and `portal.settings.manage` are spelt `portal_settings.*`
  # (DEC-139: one dot). `portal.preview`'s target is checked by the service under `visible()` (a
  # contact the viewer cannot read answers 404, DEC-20); the matrix has no such condition.
  portal_settings.read:     {firm_admin: allow, practice_leader: allow, agent: deny, system: deny}   # ADM-10 a, the follow-up policy and next send
  portal_settings.manage:   {firm_admin: allow, agent: deny, system: deny, mfa_recent: required}   # draft, publish and logo (as firm.manage_settings)
  portal.preview:           {firm_admin: allow, agent: deny, system: deny}   # ADM-10 a, c, g: POR-02 in preview mode, read-only
  # --- C5 v1.2 intake half: portal intake (N-01-T02 stub; N-01 §4.4; ADR-162, ADR-210) ---
  # A principal reads and withdraws only its own uploads (INV-4); third parties never upload intake.
  portal_intake.upload:     {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-03 "Upload something else"
  portal_intake.read_own:   {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # the principal's own uploads, client words
  portal_intake.withdraw:   {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # the uploader, or the scope's owner (client_admin); only while unfiled
