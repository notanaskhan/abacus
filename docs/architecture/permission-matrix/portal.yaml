# The portal module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's
# file into identity/authz/_matrix.py by `make regenerate`.
#
# C5 v1.1 portal half (P-08-T01 stub; P-08 §4.3, §4.9). Client actions: no firm role, the agent
# and system principals denied. The home reads one scope (`scope_only`: a grant must cover it,
# INV-4); the service also refuses grants that do not open the full shell (third party, K-1 only).
# The plan's `portal.home.read` and `portal.preferences.update` are spelt `portal_home.read` and
# `portal_preferences.update`: an action is `<entity>.<verb>` with one dot (DEC-139).
#
# C5 section portal-pbc (R-01-T01 stub; R-01 §4.3). The plan's `portal.documents.read` is spelt
# `portal_documents.read` (DEC-139). One read action serves the binder picker, POR-03, POR-04,
# the drop poll and, for third parties, POR-14 and its suggest. R-01-T13 (DEC-387) adds the
# `third_party` role (the holder of a `request_item` grant) with `delegated_only`: an item whose
# open delegation is the person's, so the room authorises row by row and reaches nothing else.

actions:
  portal_home.read:         {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-02, GET /v1/portal/home
  portal_preferences.update: {client_admin: allow, client_contributor: allow, agent: deny, system: deny}   # POR-02 b, the person's own per-scope preferences
  portal_documents.read:    {client_admin: allow, client_contributor: allow, third_party: delegated_only, agent: deny, system: deny, scope_only: required}   # POR-03, POR-04, POR-14; GET /v1/portal/binders, binders/{id}, request-items/{id}, room, drops/{batch}; POST room/suggest
  # --- C16 v1.1: portal settings and preview (R-01-T16 stub; R-01 §4.3; ADM-10) ---
  # The plan's `portal.settings.read` and `portal.settings.manage` are spelt `portal_settings.*`
  # (DEC-139: one dot). `portal.preview`'s target is checked by the service under `visible()` (a
  # contact the viewer cannot read answers 404, DEC-20); the matrix has no such condition.
  portal_settings.read:     {firm_admin: allow, practice_leader: allow, agent: deny, system: deny}   # ADM-10 a, the follow-up policy and next send
  portal_settings.manage:   {firm_admin: allow, agent: deny, system: deny, mfa_recent: required}   # draft, publish and logo (as firm.manage_settings)
  portal.preview:           {firm_admin: allow, agent: deny, system: deny}   # ADM-10 a, c, g: POR-02 in preview mode, read-only
  # --- C5 v1.2 intake half: portal intake (N-01-T02 stub; N-01 §4.4; ADR-162, ADR-210) ---
  # A principal reads and withdraws only its own uploads (INV-4); third parties never upload intake.
  portal_intake.upload:     {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-03 "Upload something else"
  portal_intake.read_own:   {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # the principal's own uploads, client words
  portal_intake.withdraw:   {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # the uploader, or the scope's owner (client_admin); only while unfiled
  # --- POR-05 questionnaires and POR-13 K-1s (T-02-T03, DEC-1162; T-02 §4.4). Client people in
  # scope; an inquiry is answered and submitted by its addressee only, and a K-1 recipient sees
  # only their own packages: both checked by the service on the record (the matrix has no
  # addressee or own-record condition). The MFA floor for K-1s is the portal session's.
  portal_questionnaire.read:      {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_questionnaire.answer:    {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_questionnaire.complete:  {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_questionnaire.submit:    {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_k1.read:                 {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_k1.download:             {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  portal_k1.update_details:       {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}
  # --- C10 portal half (R-02-T02 stub; R-02 §4.4; DEC-2402). The plan's roles `owner`, `plan_administrator`, `trustee` are `client_admin`,
  # `contributor` is `client_contributor` (identity/client_access.py). A `tcwg` grant holds one of the two names on its
  # `governance_room` scope only; the governance service refuses any other grant (DEC-93, 404), as the K-1 and inquiry rows do.
  # Firm roles, agents, system and support have no cell: firms act through A-06's record mode, never in the portal.
  deliverable.read:         {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-09, POR-15 e: audiences only
  deliverable.download:     {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-09 c: 60-second URL and an access event
  deliverable.comment:      {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-09 a: page comments on a draft that allows them
  statement.client_approve: {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required, mfa_recent: required}   # POR-09 a2: narrowed by C18's decider rule (OQ-1)
  tcwg.read:                {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-15 a, c, d, e
  tcwg.acknowledge:         {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required, mfa_recent: required}   # POR-15 b: one row per member and version
  tcwg.ask:                 {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-15: the author-only thread
  # --- C18 (R-02-T03 stub; R-02 §4.4; DEC-2403). I-AGENT-NEVER: every decision action is denied to agent and system. The designation check
  # (owner or approver of record; SKE designee where OQ-1 asks) narrows it in `engagements/client_approvals.py`, so a contributor gets 403 `not_decider`.
  client_approval.read:     {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-08 lists and details
  client_approval.ask:      {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required}   # POR-08 d: a question on the item's thread
  proposed_entry.client_decide: {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required, mfa_recent: required}   # POR-08 e: accept or decline, attest clients
  uncorrected_misstatements.acknowledge: {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required, mfa_recent: required}   # POR-08 e2
  close_package.client_decide: {client_admin: allow, client_contributor: allow, agent: deny, system: deny, scope_only: required, mfa_recent: required}   # POR-08 a to c: C-02 or A-08 registers the kind
