# The organisations module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Clients family contract, v1 (P-07-T04 stub; P-07 §4.4; DEC-141) ---
  # `client.read` moved here from engagements.yaml and widened to every firm role (metadata only;
  # walls in `visible(scope=client)`, 404 semantics, DEC-43). It also guards the live client
  # picker, GET /v1/firm/clients/search, which already drops walled clients (SPEC-025). A partner
  # with no firm role reads every client they aren't walled off from through the derived
  # `firm_partner` cell (P-07-T08, DEC-141; `visible_clients`).
  client.read:
    firm_partner: allow
    firm_admin: allow
    practice_leader: allow
    quality_partner: allow
    security_admin: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    eqr_reviewer: allow
    specialist: allow
    client_service: allow
    agent: deny
    system: deny
  # §4.4 names `firm_admin + level_in(partner, manager)`, but conditions only narrow (DEC-132),
  # so the stub ships firm_admin and the derived `firm_partner`; the manager path is added the
  # DEC-132 way when the route goes live (P-07-T09, DEC-141).
  client.update:            {firm_admin: allow, firm_partner: allow, agent: deny, system: deny}
  # Blueprint §2.4 and P-07 §4.3: a live person with recent MFA and a reason code, onshore
  # (`not_offshore` reads the membership, DEC-52). Live with P-07-T10: the route authorises the
  # action against each of the entity's client's open engagements, so these engagement roles are
  # what grants it, and `allowed_actions` on CLI-02 says so (DEC-223). The senior/staff preparer
  # path (`function_in(preparer, first_level_reviewer)`) can't widen the action (DEC-132) and
  # stays deferred to a derived grant (DEC-141, DEC-223).
  tin.reveal:               {engagement_partner: allow, manager: allow, eqr_reviewer: allow, agent: deny, system: deny, mfa_recent: required, requires: reason, not_offshore: required}
  # P-07 OQ-2 (DEC-143): Prospect-only engagements from intake and from an ENG-03 draft
  # ("Start acceptance"); accepting and staffing stay `engagement.create`. The manager path
  # lands with the live routes the DEC-132 way, as on `client.update`.
  # P-07-T37 (DEC-374): CLI-06's dedupe (`POST /v1/clients/dedupe`); creating a client is the
  # intake commit's (`client.intake`). Firm admin and partners and managers, derived (DEC-373).
  client.create:            {firm_admin: allow, firm_partner: allow, firm_manager: allow, agent: deny, system: deny}
  # P-07-T37 (DEC-374): bulk import, CLI-06 g. Rows carry a masked TIN (kind and last four),
  # masked further for an offshore reader through `mask_tins_for` (AC9.4).
  client_import.run:        {firm_admin: allow, firm_partner: allow, firm_manager: allow, agent: deny, system: deny}
  # P-07-T36 (DEC-373): the manager path lands as the derived `firm_manager`.
  client.intake:            {firm_admin: allow, firm_partner: allow, firm_manager: allow, agent: deny, system: deny}
  # --- Contacts and portal-access contract, v1 (P-07-T17 stub; P-07 §4.3, §4.4; DEC-226) ---
  # CLI-04. Reading a client's contacts is metadata for every role that reads the client's
  # engagements' client contacts; managing them is the firm admin, partners and the engagement
  # partner and manager. Grants, revokes and unlocks stay identity's rows (`client_access.grant`,
  # `client_access.revoke`, `contact.unlock`). Agent and system denied (INV-1); no client role.
  contact.read:             {firm_admin: allow, firm_partner: allow, practice_leader: allow, quality_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_service: allow, agent: deny, system: deny}
  contact.manage:           {firm_admin: allow, firm_partner: allow, engagement_partner: allow, manager: allow, client_service: allow, agent: deny, system: deny}
  # --- Conflict checks and screening, v1 (P-07-T29 stub, P-07-T36 live; P-07 §4.3, §4.4) ---
  # CLI-06 and CLI-08 c. Firm-level: the firm admin, partners (`firm_partner`) and managers
  # (`firm_manager`, DEC-373). Clearing a hit is a partner's or manager's (human-only). The
  # search itself runs as a system principal over metadata, which is not this route action.
  # Agent and system denied; no client role.
  conflict.run:             {firm_admin: allow, firm_partner: allow, firm_manager: allow, agent: deny, system: deny}
  conflict.clear:           {firm_partner: allow, firm_manager: allow, agent: deny, system: deny}   # human-only
  screening.record:         {firm_admin: allow, firm_partner: allow, firm_manager: allow, agent: deny, system: deny}
  # --- Firm-settings family contract, v1 (G-01-T02 stub): offices, teams and groups ---
  # Filters and review pools, never an access boundary (DEC-30). G-01 section 4.3 names
  # `office.*` and `team.*`; one pair covers both so no rule names an office
  # (test_office_not_access).
  org_structure.read:       {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, agent: deny, system: deny}
  org_structure.manage:     {firm_admin: allow, security_admin: allow, agent: deny, system: deny, mfa_recent: required}

  # --- C19 v1 (T-01-T01 stub; T-01 §4.3; DEC-1155): the §7216 consent registry, the TRI gate and
  # the tax-profile family. Every write is a person's: agent, system and client principals are
  # denied (I-AGENT-NEVER, INV-4). The plan's function_in(preparer, reviewer, signer) narrowing
  # on elections, authorizations and transcripts arrives with the routes (T-01-T43), when the
  # resource carries its work item; until then the engagement roles hold them. Reading consents
  # is not an agent's: the gate reads them through organisations.api, never the route.
  consent.read:               {firm_admin: allow, security_admin: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # GET /v1/consents*, /v1/client-entities/{id}/consents
  consent.evidence_download:  {engagement_partner: allow, manager: allow, client_service: allow, security_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the signed document, audited
  consent.request:            {firm_admin: allow, client_service: allow, manager: allow, engagement_partner: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # draft a C7 envelope, one purpose per document
  consent.record:             {client_service: allow, manager: allow, engagement_partner: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # record mode, declines, revocations
  consent.export:             {firm_admin: allow, security_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # async CSV, audited
  consent_template.manage:    {security_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # counsel-attested import (database content)
  consent_template.publish:   {firm_partner: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # a partner publishes a template version
  tax_profile.read:           {firm_admin: allow, security_admin: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # CLI-05 rail
  tax_election.manage:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # PUT /v1/client-entities/{id}/elections/{kind}
  tax_authorization.manage:   {client_service: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # 8821 and 2848 on file and drafted
  transcript.upload:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # IRS transcripts retrieved outside Accrued
  transcript.compare:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # code compares (ADR-050)
