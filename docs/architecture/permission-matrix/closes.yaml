# The closes module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's file
# into identity/authz/_matrix.py by `make regenerate`.
#
# C-01-T02, the S44 protected bundle (C-01 §4.3, §4.8; SPEC-655). Every human verb is agent: deny;
# the agent's only C-01 grants stay suggestion.create, issue.create and decision_card.raise under
# task_scope (agents.yaml, review.yaml). Platform support and every portal principal are denied on
# every firm route. CAS closes are non-attest work, so independence is not required (an attest
# client's entries are held by classify_entry, P-13). Walls and tenant apply as everywhere.
# QC-3 (staff start runs only with close_preparer on that close): `staff_function_in` binds staff
# alone (DEC-5057, TASK-8071); partners, managers and seniors start runs without it.

actions:
  # --- Portfolio and the close record (CLS-01, CLS-02) ---
  close.read:               {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # CLS-01 rows and tiles, CLS-02 summary, run view, requests tree, accounts, reconciliations, issues facets
  close.create:             {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/engagements/{id}/closes:generate (12 closes; a person's, also from ENG-03's monthly-close step)
  close.assign:             {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # PUT /v1/closes/{id}/assignees: close_preparer, close_reviewer (a Senior sees read-only pickers)
  close.status_move:        {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/closes/{id}/status: In review, back to In progress, the On hold flag (human-only; server gates)
  # --- Runs (CLS-02 a to e) ---
  close_run.start:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, staff_function_in: close_preparer, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/closes/{id}/runs (human-only; Idempotency-Key)
  close_run.retry:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, staff_function_in: close_preparer, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # retry a failed procedure as a new step (human-only)
  # --- Close plans and templates (CLS-09) ---
  close_plan.read:          {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # plan, versions and history
  close_plan.edit:          {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # drafts, rows, request templates (If-Match)
  close_plan.request_publish: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # C13 gate close_plan_publish_requested for Managers and Partners (QC-8)
  close_plan.publish:       {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # publish a version with effective_from (human-only)
  close_plan.draft_from_history: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person starts close.agent mode planner; rows arrive as suggestions
  close_template.import:    {firm_admin: allow, firm_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/close-templates:import (DB content, never a commit)
  # --- Accounts, schedules, reconciliation (CLS-04, CLS-05) ---
  arrangement.edit:         {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # O2 drawer: a new arrangement version per edit
  reconciliation.resolve_item: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # carry forward or cleared, with a required note (human-only)
  # --- Flux (CLS-10) ---
  flux.read:                {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # sets, lines and explanations; flux.xlsx
  flux.explain:             {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person starts close.agent mode flux
  flux.edit:                {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person edits an explanation (If-Match)
  flux.accept:              {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # Manager or Partner accepts (human-only; a Senior gets 403)
  # --- C-02-T02 CAS delivery, tax hand-off and information returns (SPEC-701; DEC-5501). Release is partner-only
  # with a live human and fresh MFA; no transmit action exists (IRIS-001, R-04).
  close_package.read:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}
  close_package.edit:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # sections and the CAS answer (manager+, service); commentary (senior+, Q4)
  close_package.generate:  {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}
  close_package.export:    {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # PDF / XLSX download, audited
  close_package.release:   {engagement_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required, mfa_recent: required}   # partner only; L2 sign-off, C10 publish, C18 item, POR-20 email
  close.lock:              {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required, mfa_recent: required}   # after client approval (client_approval_required)
  close.reopen:            {engagement_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # reason required; supersedes the next hand-off
  tax_handoff.read:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}
  tax_handoff.publish:     {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # C12 receive_tb_handoff; no TJE ever enters a batch
  information_returns.read: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}
  vendor_1099.update:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # classification edits; the agent proposes through a suggestion only
  w9.request:              {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # a person sends (DEC-74); portal channel only until R-03's link principal
  tin_match.record:        {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # manual TIN Matching result with evidence
  backup_withholding.record: {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # reason and evidence required
  information_return_batch.approve:      {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # after the December close locks; human only
  information_return_batch.export:       {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # deterministic IRIS CSV; never transmitted
  information_return_batch.record_filing: {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # Mark filed · IRIS (receipt id)
  information_return_batch.record_ack:   {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # Record acceptance with evidence
