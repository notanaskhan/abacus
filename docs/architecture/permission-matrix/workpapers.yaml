# The workpapers module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Working papers (SPEC-308; TASK-319) ---
  workpaper.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, agent: task_scope, independence: required}   # firm roles only; the agent reads through a run's task scope (the section drafter, A-04-T11)
  workpaper.edit:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # create, cells, citations; the agent proposes through its own channel (ADR-005)
  # --- Tie-out checks on the trial balance (SPEC-310; TASK-321) ---
  tie_out_check.define:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # human only (the database CHECK agrees); results are read with trial_balance.read
  # --- A-04 workpaper core (docs/contracts/workpapers-core.md; A-04-T01, DEC-1757) ---
  # Behind workpapers.core (drafts also workpapers.drafting). Client principals and client_service
  # hold none (INV-4, DEC-20); the agent holds reads only through a run's task scope.
  workpaper.draft:          {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/workpapers/{id}/drafts, …/risks/{rid}/drafts, …/soc-reports/{id}/drafts (202 + run id); staff with function_in(preparer) waits for the function register; the agent never starts its own draft
  workpaper.export:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # GET …/workpapers/{id}/export.xlsx: byte-identical for identical data, client strings written as text (ADR-052); audited workpaper.exported
  attention_flag.convert:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # a PBC GAP flag to a request draft (SHL-14 prefill) or a review note (C3); nothing is sent
  procedure.tailor:         {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PATCH …/procedures/{id} {tailored, rationale}: non-mandatory steps only (409 mandatory_step); reads use fieldwork's procedure.read
  # --- A-08 fieldwork testing on A-05's grid (A-08-T03; SPEC-657 F1–F3) ---
  test.run:                           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # POST /v1/tests/{tid}/runs: Begin… / Re-run starts a fieldwork_attribute run for the person
  test.adopt:                         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # POST /v1/tests/{tid}/adopt: L1 through review.api.record_sign_off (seen_hash)
  test.export:                        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # GET /v1/tests/{tid}/export.xlsx: JE Testing.xlsx, byte-identical, audited
  # --- K-03 sheets and agent columns (K-03-T06; DEC-5848) ---
  sheet.read:               {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, quality_partner: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny, independence: required}   # visible(); clients deny
  sheet.export:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, quality_partner: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, independence: required}
  sheet.edit:               {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # never on locked rows; agents write only suggestions (suggestion.create)
  sheet.configure:          {engagement_partner: allow, manager: allow, quality_partner: allow, agent: deny, system: deny, independence: required}
  agent_column.run:         {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny, independence: required}   # the AI policy for the engagement type; boundary and §7216 facts
