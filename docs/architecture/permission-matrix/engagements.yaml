# The engagements module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  methodology.manage:       {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-008 Q3
  methodology.read:         {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow, agent: task_scope}   # SPEC-008; agent: the guidance drafter on a template, firm-level (TASK-074 D1)
  # --- Engagements ---
  # P-07-T05 (DEC-143): agent and system denied (I-AGENT-NEVER). P-07-T16 (DEC-225): DEC-38's
  # partner cell lands with the live wizard as the derived `firm_partner` (DEC-132); the manager
  # and senior-by-setting cells wait for a derived firm-level grant (DEC-141's pattern).
  engagement.create:        {firm_admin: allow, practice_leader: allow, firm_partner: allow, agent: deny, system: deny}
  roll_forward.read:        {firm_admin: allow, practice_leader: allow}   # SPEC-025 (TASK-048 D3): last year's team, template and items, checked on that engagement
  engagement.ai_exclude:    {engagement_partner: allow}   # SPEC-036 (TASK-076): switch AI off for one engagement
  # --- Acceptance, independence and the letter (SPEC-025; TASK-044) ---
  acceptance.record:        {engagement_partner: allow, mfa_recent: required}   # decision, documentation, the independence conclusion
  independence.confirm:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, agent: deny, system: deny}   # for oneself only (the service refuses others); P-07-T29: agent and system denied (INV-1); P-07-T30 review: the EQR and specialists are asked on joining, so they confirm too
  # P-07-T05 (DEC-143): agent and system denied; `gates_met(G1)` joins with the live recorded
  # letter (P-07-T15), once the G1 provider's facts are registered (a condition fails closed).
  letter.record:            {engagement_partner: allow, manager: allow, agent: deny, system: deny}
  engagement.hold:          {engagement_partner: allow, manager: allow, mfa_recent: required}   # F-03-T13: on hold and back, a person with a reason code (§3.1.3)
  setup.read:               {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}
  engagement.read_metadata:
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_service: allow     # F-03-T30 (ADR-147): binders, invitations, request status; no evidence
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
    client_admin: allow       # SPEC-020: their own engagement's name, firm and period
    client_contributor: allow
  work_item.create:         {engagement_partner: allow, manager: allow, agent: deny}   # F-03-T22: a return, close, notice or project on the engagement
  work_item.assign:         {engagement_partner: allow, manager: allow, agent: deny, system: deny}   # P-07-T24 (ADR-164 item 2): assign a function on a work item; 409 gate_unmet G2 for an uncleared assignee on an attest client
  work_item.read_metadata:  # F-03-T05 (C1): an engagement's work items; firm staff only for now
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: task_scope
  engagement.self_join:     {firm_admin: allow, notify: engagement_team}
  client_contact.invite:    {engagement_partner: allow, manager: allow, client_service: allow, client_admin: allow}   # SPEC-015 Q2 (client admins: contributors only, in the service)
  client_contact.read:      {engagement_partner: allow, manager: allow, senior: allow, client_service: allow, client_admin: allow}   # SPEC-015
  client_contact.remove:    {engagement_partner: allow, manager: allow, client_service: allow, client_admin: allow}   # SPEC-015 (client admins: contributors only)
  engagement_contact.designate: {engagement_partner: allow, manager: allow, agent: deny}   # F-03-T25 (DEC-63): approver of record, SKE designee and the rest
  engagement.update:        {engagement_partner: allow, manager: allow}
  engagement.member_add:    {engagement_partner: allow, manager: allow}
  engagement.member_remove: {engagement_partner: allow, manager: allow}
  engagement.archive:       {engagement_partner: allow}
  # --- Team, acceptance and independence contract, v1 (P-07-T29 stub; P-07 §4.3, §4.4; DEC-326) ---
  # ENG-05, CLI-07 and CLI-08. Every decision and confirmation denies agent and system (INV-1,
  # I-AGENT-NEVER); no client role holds any. `acceptance.prepare` includes client service only
  # so a manual check assigned to them can be completed (the service limits them to that).
  acceptance.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_service: allow, quality_partner: in_scope, agent: deny, system: deny}
  acceptance.prepare:       {engagement_partner: allow, manager: allow, client_service: allow, agent: deny, system: deny}
  acceptance.request_review: {engagement_partner: allow, agent: deny, system: deny}
  acceptance.decide:        {engagement_partner: allow, mfa_recent: required, agent: deny, system: deny}   # human-only
  # P-07-T35 (DEC-372): the risk partner the EP named completes the review (AC-4). They are
  # usually not on the team, so the route authorises on the client, where the derived
  # `firm_partner` applies (walls too); the service admits only the named partner.
  acceptance.complete_review: {firm_partner: allow, mfa_recent: required, agent: deny, system: deny}   # human-only; fresh MFA (DEC-375)
  independence.read:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, agent: deny, system: deny}
  independence.remind:      {engagement_partner: allow, manager: allow, agent: deny, system: deny}   # sent by the person clicking
  independence.conclude:    {engagement_partner: allow, mfa_recent: required, agent: deny, system: deny}   # human-only
  independence.breach_manage: {engagement_partner: allow, manager: allow, quality_partner: allow, agent: deny, system: deny}
  nas.evaluate:             {engagement_partner: allow, manager: allow, agent: deny, system: deny}   # the evaluation decision is the EP's (service)
  team.approve:             {engagement_partner: allow, mfa_recent: required, agent: deny, system: deny}   # human-only; fresh MFA (P-07-T30 security review)
  eqr.assign:               {engagement_partner: allow, manager: allow, agent: deny, system: deny}
  eqr.approve_eligibility:  {quality_partner: allow, agent: deny, system: deny}   # human-only; never the EP (409 eqr_approver_is_ep)
