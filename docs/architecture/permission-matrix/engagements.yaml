# The engagements module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  methodology.manage:       {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-008 Q3
  methodology.read:         {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow, agent: task_scope}   # SPEC-008; agent: the guidance drafter on a template, firm-level (TASK-074 D1)
  # --- Engagements ---
  # P-07-T05 (DEC-143): agent and system denied (I-AGENT-NEVER). DEC-38's partner, manager and
  # senior-by-setting cells land with the live wizard (P-07-T16) the DEC-132 way.
  engagement.create:        {firm_admin: allow, practice_leader: allow, agent: deny, system: deny}
  roll_forward.read:        {firm_admin: allow, practice_leader: allow}   # SPEC-025 (TASK-048 D3): last year's team, template and items, checked on that engagement
  engagement.ai_exclude:    {engagement_partner: allow}   # SPEC-036 (TASK-076): switch AI off for one engagement
  # --- Acceptance, independence and the letter (SPEC-025; TASK-044) ---
  acceptance.record:        {engagement_partner: allow, mfa_recent: required}   # decision, documentation, the independence conclusion
  independence.confirm:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}   # for oneself only (the service refuses others)
  # P-07-T05 (DEC-143): agent and system denied; `gates_met(G1)` joins with the live recorded
  # letter (P-07-T15), once the G1 provider's facts are registered (a condition fails closed).
  letter.record:            {engagement_partner: allow, manager: allow, agent: deny, system: deny}
  engagement.hold:          {engagement_partner: allow, manager: allow, mfa_recent: required}   # F-03-T13: on hold and back, a person with a reason code (§3.1.3)
  setup.read:               {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}
  engagement.read_metadata:
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_service: allow     # F-03-T30 (ADR-147): binders, invitations, request status; no evidence
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
    client_admin: allow       # SPEC-020: their own engagement's name, firm and period
    client_contributor: allow
  work_item.create:         {engagement_partner: allow, manager: allow, agent: deny}   # F-03-T22: a return, close, notice or project on the engagement
  work_item.read_metadata:  # F-03-T05 (C1): an engagement's work items; firm staff only for now
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: task_scope
  engagement.self_join:     {firm_admin: allow, notify: engagement_team}
  client_contact.invite:    {engagement_partner: allow, manager: allow, client_service: allow, client_admin: allow}   # SPEC-015 Q2 (client admins: contributors only, in the service)
  client_contact.read:      {engagement_partner: allow, manager: allow, senior: allow, client_service: allow, client_admin: allow}   # SPEC-015
  client_contact.remove:    {engagement_partner: allow, manager: allow, client_service: allow, client_admin: allow}   # SPEC-015 (client admins: contributors only)
  engagement_contact.designate: {engagement_partner: allow, manager: allow, agent: deny}   # F-03-T25 (DEC-63): approver of record, SKE designee and the rest
  engagement.update:        {engagement_partner: allow, manager: allow}
  engagement.member_add:    {engagement_partner: allow, manager: allow}
  engagement.member_remove: {engagement_partner: allow, manager: allow}
  engagement.archive:       {engagement_partner: allow}
