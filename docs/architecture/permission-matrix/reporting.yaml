# The reporting module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's
# file into identity/authz/_matrix.py by `make regenerate`.
#
# C11 renderer and templates (P-11-T03; P-11 §4.3; ADR-320; SPEC-520). Reading a generated
# document follows the engagement team; regenerating is a person's (AC-18); importing and
# publishing templates are firm content rights (DEC-20; OQ-4 decided: import by firm_admin,
# quality_partner or practice_leader; publish by quality_partner or practice_leader with a fresh
# second factor, never the agent, the system or firm_admin). Final renders are not a route: they
# are `reporting.api.render_final` with a human approval (AC-15). The glossary keeps "document"
# in compounds, so the actions are `generated_document.*`; approvals are each consumer's own.

actions:
  generated_document.read:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, practice_leader: in_scope, quality_partner: in_scope, client_service: allow, agent: task_scope, independence: required}   # GET generated documents, fields, compare, changes; client roles and platform support deny
  generated_document.regenerate: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # human-only, Idempotency-Key, 409 document_locked
  report_template.read:          {firm_admin: allow, practice_leader: allow, quality_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, agent: deny, system: deny}   # list, version, SAMPLE preview
  report_template.import:        {firm_admin: allow, practice_leader: allow, quality_partner: allow, agent: deny, system: deny}   # dry run or draft version; never a migration
  report_template.publish:       {practice_leader: allow, quality_partner: allow, firm_admin: deny, agent: deny, system: deny, mfa_recent: required}   # human-only with a fresh second factor; a different person from the importer (the service's check)
  # --- Statements v1 and the disclosure checklist (A-06-T19, DEC-2209; A-06 §4.3; AUD-20). Reads
  # are the team's and reviewers'; the agent reads at a run's task_scope and drafts only through
  # the deterministic draft run (never a send or an approval). Sending a draft and recording
  # management's approval are a person's (I-AGENT-NEVER).
  statement.read:                    {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}   # GET …/financial-statements, lineage, tie-out
  statement.draft:                   {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # POST …/financial-statements/draft (202, code drafts)
  statement.tie_out:                 {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # POST /v1/statement-versions/{id}/tie-out
  statement.send_draft:              {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # POST …/send-draft (C10 deliverable + C18 item)
  statement.record_management_approval: {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # POST …/management-approval:record (record mode)
  disclosure_checklist.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}
  disclosure_checklist.answer:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # PUT …/items/{key}, POST …/adopt
  disclosure_checklist.review:       {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # POST …/items:review
  disclosure_checklist.export:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # GET …/export.xlsx

