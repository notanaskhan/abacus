# The practice module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- C13 home half (I-01-T02; I-01 §4.3): HOME-01 for every firm role; tiles and rows are each
  # owner's, under `visible()`; a client, the agent and the system never read Home ---
  home.read:                {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # GET /v1/home (DEC-404)
  # --- K-02-T01 (DEC-1150; K-02 §4.4; C21 part A): due dates and clocks computed from the
  # published reference sets.
  due_date.read:              {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # GET /v1/due-dates
  # --- I-02-T04 (SPEC-654; I-02 §4.3; DEC-4610): the Today brief. Every firm role reads, rebuilds
  # and asks about its own brief (the route asserts viewer_user_id = caller); client roles,
  # platform support (content) and the agent never do (INV-1, INV-4). Behind today_brief.enabled.
  briefing.read:            {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: deny, system: deny}   # GET /v1/me/today, the drill-in and history
  briefing.rebuild:         {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/me/today/builds (202; three forced rebuilds a day)
  briefing.ask:             {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # POST /v1/me/today/questions (read-only workbench.assistant turns)
  # --- T-08-T03 filing deadlines (SPEC-710; DEC-5602; T-08 §4.4). Every firm role reads its own
  # calendar under walls; firm admins see metadata only (ADR-024). A relief notice is applied by a
  # person with fresh MFA (OQ-17). Behind practice.filing_deadlines.
  filing_deadline.read:             {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: task_scope, system: deny}   # HOME-03, HOME-01 pane; portal principals 403 (AC-18)
  filing_deadline.apply_postponement: {firm_admin: allow, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, link_principal: deny, agent: deny, system: deny, mfa_recent: required}   # human-only; DF-10 client relief (T-08-T44)
  # --- Q-05-T02 quality management (SPEC-711; DEC-5609; Q-05 §4.3). Readers are the QM owner,
  # practice leaders in scope and the Monitoring reviewers group (OQ-4; `monitoring_reviewer`, fail
  # closed until Q-05-T08); never firm_admin (ADR-024). The agent reads and decides nothing here.
  # Assigned inspector and finding owner are checked by the services. Behind quality.management.
  quality.read:                       {quality_partner: allow, practice_leader: in_scope, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, monitoring_reviewer: required}   # ADM-11, ADM-12
  quality.manage:                     {quality_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, mfa_recent: required}   # register import publish, objectives, risk review, evaluation request
  inspection.plan:                    {quality_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # candidates, plan (issues grants); 409 inspector_not_objective
  inspection.update:                  {quality_partner: allow, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # start, conclude: the assigned inspector or the QM owner (service)
  qm_finding.record:                  {quality_partner: allow, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the assigned inspector or the QM owner (service)
  qm_finding.update:                  {quality_partner: allow, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the finding owner or the QM owner (service)
  qm_finding.remediate:               {quality_partner: allow, firm_partner: allow, firm_manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # the finding owner or the QM owner (service)
  qm_finding.evaluate:                {quality_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny}   # human-only, insert-only (AC-9)
