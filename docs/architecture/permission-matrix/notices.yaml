# The notices module's actions (ADR-027; P-39). Compiled with every other module's file into
# identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Notices v1 (N-04 §4.3; N-04-T01, DEC-2050) ---
  # Reads follow T-02's `tax_return.read`: the firm's tax staff and above plus client service;
  # walls apply globally; the agent reads only at a run's task_scope. Every write is a person's:
  # agent, system, support and every portal or link principal deny (INV-1, INV-4). Offshore
  # members hold no notices write until the per-subject offshore consent can be expressed as an
  # alternative to `not_offshore` (DEC-2050); the service checks C19 on reads.
  # Deciding a position is P-04's `decision.decide` (reserved role `signer`); there is no
  # `notice.decide`.
  notice.read:          {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # GET /v1/notices, /summary, /{id}, /analysis, /activity, /response
  notice_intake.read:   {firm_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # GET /v1/notice-intakes/{id}: before a match the intake scope (DEC-75); after, visible() on the client
  notice_intake.create: {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /v1/notice-intakes (upload, inbox item or evidence version)
  notice_intake.update: {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PUT /v1/notice-intakes/{id}: field corrections and confirmations, client and return choice
  notice_intake.confirm: {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /create, /attach, /discard (DB CHECK: a human confirms)
  notice.assign:        {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PATCH /v1/notices/{id} {assignee_id}
  notice.update:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PATCH /v1/notices/{id} {respond_by, related_return_id, client_visible}
  notice.start:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /v1/notices/{id}:start (received to classified)
  notice.record_as_filed: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PUT /return-as-filed and /proposed-items, each line cited
  notice.analyze:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /analysis/run (idempotent on inputs_hash)
  notice.request_decision: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /decision-requests raises the notice_position card (P-04)
  notice.note:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /notes: an insert-only note for the partner
  notice.agency_reply:  {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /agency-replies: resolved or escalated (DB CHECK human)
  notice_response.draft: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /response from the firm template for (kind, position)
  notice_response.edit: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PUT /response and /response/regenerate (If-Match)
  notice_response.send_for_signature: {engagement_partner: allow, manager: allow, function_in: "manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /response/send-for-signature (+ C7 envelope.create)
  notice_response.mark_sent: {engagement_partner: allow, manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST /response/mark-sent: sealed confirmation, sent to awaiting_irs (DB CHECK human)
