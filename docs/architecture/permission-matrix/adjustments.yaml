# The adjustments module's actions (ADR-027; P-39). Compiled with every other module's file into
# identity/authz/_matrix.py by `make regenerate`. A-06-T05 (C8; DEC-1965): nothing is ever posted
# to a client system (pe_posting_dormant); every approval, send and record is a named person's.

actions:
  proposed_entry.read:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}
  proposed_entry.create:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # the agent proposes through a suggestion only
  proposed_entry.update:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # lines editable until approved (entry_locked)
  proposed_entry.send_to_client: {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required, mfa_recent: required}   # approve, batch and send through C18 under a 10-second hold
  proposed_entry.reject:      {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # a firm-side withdrawal with a reason code
  proposed_entry.record_client_decision: {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # record mode, with the evidence attached
  approval_batch.create:      {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # a named person's batch under a policy version
  adjusted_tb.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # C8 read: Unadjusted, AJE, RJE, Final
  # --- A-09-T02 eliminations on C8 (C8 v1.1; SPEC-658 F4; DEC-5037): posted to the consolidation layer only.
  elimination.read:                       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: task_scope, system: deny, independence: required}   # list eliminations with code's balance and "off n"
  elimination.edit:                       {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # create and edit lines while Proposed (the proposer writes through proposed_entry at task_scope)
  elimination.propose_run:                {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # start EliminationProposal for the person
  elimination.approve:                    {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # approve one or a per-item batch, reject; 409 unbalanced_entry; never a policy actor (P-08)
  elimination.apply:                      {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # post to consolidation_layer only; no entity snapshot or client ledger changes
