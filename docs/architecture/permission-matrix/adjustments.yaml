# The adjustments module's actions (ADR-027; P-39). Compiled with every other module's file into
# identity/authz/_matrix.py by `make regenerate`. A-06-T05 (C8; DEC-1965): nothing is ever posted
# to a client system (pe_posting_dormant); every approval, send and record is a named person's.

actions:
  proposed_entry.read:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}
  proposed_entry.create:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # the agent proposes through a suggestion only
  proposed_entry.update:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, system: deny, independence: required}   # lines editable until approved (entry_locked)
  proposed_entry.send_to_client: {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required, mfa_recent: required}   # approve, batch and send through C18 under a 10-second hold
  proposed_entry.reject:      {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # a firm-side withdrawal with a reason code
  proposed_entry.record_client_decision: {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # record mode, with the evidence attached
  approval_batch.create:      {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # a named person's batch under a policy version
  adjusted_tb.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # C8 read: Unadjusted, AJE, RJE, Final
  # --- A-09-T02 eliminations on C8 (C8 v1.1; SPEC-658 F4; DEC-5037): posted to the consolidation layer only.
  elimination.read:                       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: task_scope, system: deny, independence: required}   # list eliminations with code's balance and "off n"
  elimination.edit:                       {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # create and edit lines while Proposed (the proposer writes through proposed_entry at task_scope)
  elimination.propose_run:                {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # start EliminationProposal for the person
  elimination.approve:                    {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # approve one or a per-item batch, reject; 409 unbalanced_entry; never a policy actor (P-08)
  elimination.apply:                      {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # post to consolidation_layer only; no entity snapshot or client ledger changes
  # --- C-02-T02 posting (C8 v2; SPEC-700; ADR-344 W1; DEC-5501). The agent is denied every write; the policy
  # principal never decides (ADR-187). The attest flag refuses posting_batch.post in the service, the grant and the
  # workflow (ADR-164). Reject on close work items opens to senior (Q4).
  proposed_entry.approve:           {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # a held or review-required entry; the service checks the policy's review approvers for a manager; 10 s Undo
  proposed_entry.request_approval:  {manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # HOME-02 gate proposed_entry_approval + bell entry_approval_requested
  proposed_entry.undo_approval:     {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # the decision's own actor, inside 10 s and before any effect: approval_undone
  proposed_entry.withdraw_approval: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # the approver, a manager or a partner (the service checks the approver for senior): approval_withdrawn
  proposed_entry.reject_close:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # Rejected + a CLS-06 issue on a close work item
  proposed_entry.record_external:   {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # Recorded in ledger / Recorded by <client>: a sync match or evidence
  proposed_entry.export:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # CLS-07 Open in Excel and the JE import file (export instead), audited
  posting_batch.dry_run:            {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # preflight only, no write
  posting_batch.post:               {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required, mfa_recent: required}   # create, undo inside the hold, retry; senior only on approved entries (service); never an attest client
  closing_date_conflict.resolve:    {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # CLS-11e ask the client (POR-20 row, a person sends) or re-date (withdraws the approval)
  # --- A-09-T34 (SPEC-658 F4; DEC-5522): consolidation.elimination_proposer's propose-only write. No person holds
  # it (people use elimination.edit); the agent only at task_scope, never approve or post (those deny it).
  elimination.agent_propose:        {engagement_partner: deny, manager: deny, senior: deny, staff: deny, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: task_scope, system: deny, independence: required}
