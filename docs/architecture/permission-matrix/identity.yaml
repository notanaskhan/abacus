# The identity module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Firm administration ---
  firm.manage_users:        {firm_admin: allow, mfa_recent: required}
  firm.manage_settings:     {firm_admin: allow, mfa_recent: required}
  support_session.read:     {firm_admin: allow}   # SPEC-012
  support_session.manage:   {firm_admin: allow, mfa_recent: required}   # SPEC-012 Q1
  autonomy_policy.update:   {firm_admin: allow, mfa_recent: required}
  firm.read_settings:       {firm_admin: allow, practice_leader: allow, security_admin: allow, firm_partner: allow}   # SPEC-024 (TASK-042 D1): autonomy and the checklist, read without fresh MFA; P-01-T04 (DEC-132): partners read settings (SHL-03c)
  wall.create:              {firm_admin: allow, mfa_recent: required}
  wall.remove:              {firm_admin: allow, mfa_recent: required}
  wall.list:                {firm_admin: allow, mfa_recent: required}   # SPEC-002 Q2 (named wall.read there)
  firm_agents.pause:        {firm_admin: allow, mfa_recent: required}   # every agent in the firm
  demo_clock.set:           {firm_admin: allow, agent: deny, mfa_recent: required}   # F-04-T07 (ADR-143): synthetic firms outside production only, in the service; support stays read-only (SPEC-012)
  # F-03-T26 (ADR-146): client access grants. On an engagement for its scopes; on the firm (firm
  # admin) for client-wide ones.
  client_access.grant:      {firm_admin: allow, engagement_partner: allow, manager: allow, client_service: allow, agent: deny, mfa_recent: required}
  client_access.revoke:     {firm_admin: allow, engagement_partner: allow, manager: allow, client_service: allow, agent: deny, mfa_recent: required}
  firm.ai_client_data:      {firm_admin: allow, mfa_recent: required}   # SPEC-036 (TASK-076): opt in to AI on clients' data, against the disclosure
  # --- C5 v1.1 portal half (P-08-T01 stub; P-08 §4.3, §4.9): firm-side recovery of a client's
  # portal sign-in. Human-only: the agent and system principals are denied (INV-1).
  contact.unlock:           {firm_admin: allow, security_admin: allow, engagement_partner: allow, manager: allow, client_service: allow, agent: deny, system: deny}   # Story 7.1: clear a sign-in lock
  contact.mfa_reset:        {security_admin: allow, agent: deny, system: deny, mfa_recent: required}   # Story 7.2: remove the factor, backup codes and trusted devices (OQ-1)
  # --- Firm-settings family contract, v1 (G-01-T02 stub; G-01 section 4.3) ---
  # New actions only. `firm.read_settings` gained `security_admin` with the live settings
  # (G-01-T04); `wall.create` and `wall.remove` move to partners with G-01-T09.
  firm.read_people:         {firm_admin: allow, security_admin: allow, firm_partner: allow, agent: deny, system: deny}   # ADM-02 list, drawer, role templates
  security_role.assign:     {firm_admin: allow, security_admin: allow, agent: deny, system: deny, mfa_recent: required}   # grant or remove security_admin only
  service_line_policy.manage: {firm_admin: allow, security_admin: allow, agent: deny, system: deny, mfa_recent: required}   # ADM-03h; audit stays engagement-team-only
  wall.approve:             {firm_partner: allow, agent: deny, system: deny, mfa_recent: required}   # the named partner only (the service checks the name; DEC-73)
  independence.annual_read: {firm_admin: allow, quality_partner: allow, firm_partner: allow, agent: deny, system: deny}   # ADM-02g
  independence.annual_confirm:
    firm_admin: allow
    practice_leader: allow
    quality_partner: allow
    security_admin: allow
    firm_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    eqr_reviewer: allow
    specialist: allow
    client_service: allow
    agent: deny
    system: deny
