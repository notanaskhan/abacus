# The tax module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's file into
# identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- the engine bridge and the e-file record (T-01-T02 stub; T-01 §4.3; DEC-1156). Every write
  # is a person's: agent, system and client principals are denied (I-AGENT-NEVER). Accrued never
  # transmits (R-04): `transmission.record` records what the ERO did in the engine. Work-item
  # conditions narrow the reviewer and signer acts; the ERO designation and BH-TAX-02's named
  # approver are checked by the service on the return (T-01-T27, T37).
  tax_return.read:            {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # final-approval facts, engine sync, imports, delivery
  tax_return.approve:         {engagement_partner: allow, function_in: signer, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # POST /v1/tax-returns/{id}/final-approval (only tax/approval.py records it)
  tax_return.export:          {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the workbook after final approval
  engine_import.create:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # upload an engine file
  engine_import.approve:      {engagement_partner: allow, manager: allow, senior: allow, reviewer: allow, function_in: "first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # a person approves the diff
  delivery_packet.prepare:    {client_service: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # assemble, edit, letter, 8879 envelope, ERO notice
  delivery_packet.approve:    {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # DEC-38: the signer or a manager-level person (service)
  transmission.record:        {engagement_partner: allow, manager: allow, function_in: signer, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the ERO's record; ero_designated checked by the service
  efile_ack.record:           {engagement_partner: allow, manager: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # a manual ack with evidence
  deliverable.publish:        {client_service: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # release the client copy to the portal
  # --- tax-returns v1, K-1 packages (T-02-T03, DEC-1162; T-02 §4.4): T-02's rows of the S16
  # bundle. Reads of metadata are every firm role's (walls apply); writes are a person's. The
  # BH-TAX-02 approver, the release eligibility and the target-return reach are the service's.
  tax_return.read_metadata:   {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # TAX-01 rows, tiles, the ReturnFrame record
  tax_return.assign:          {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # bulk and single assignment
  tax_return.status_change:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,detail_reviewer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # start_preparation, start_review
  k1_package.read:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TXP-12 rows, packages, documents, release check
  k1_package.share_internal:  {manager: allow, engagement_partner: allow, function_in: "preparer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # share to another return's intake
  k1_package.release:         {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # release to the portal, undo within the window (tax/k1_release.py)
  k1_package.resend:          {manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # resend a released package
  k1_disclosure.import:       {firm_admin: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # the counsel-approved electronic-furnishing disclosure, a new version (DV-12, S20e; DEC-1579)
  k1_recipient.review_details: {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # DV-10: accept or reject a recipient's details change
  # --- extensions and estimates (T-03-T01, DEC-2200; T-03 §4.3; TAX-13). Reads are every firm
  # role's (walls through visible(); the service checks C19's offshore consent on reads, as
  # DEC-2050 does for notices); the agent reads only at a run's task_scope. Every write is a
  # person's: agent, system and portal principals deny. Approving an extension payment is the
  # return's reviewer function only (detail, manager or partner reviewer), never client service.
  filing_extension.read:              {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # GET /v1/tax/extensions, /{id}, /v1/tax/payments
  filing_extension.prepare:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST :prepare and :submit-for-approval (registers the C13 gate)
  filing_extension.approve_payment:   {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST :approve-and-request (human only, Idempotency-Key)
  filing_extension.mark_filed:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PATCH {filed_on, form}: a person's record of what the engine filed (never transmit, DEC-49)
  filing_extension.flag_likely:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PATCH {likely_to_extend, reason} (G1/G3 guard)
  filing_extension.confirmation_send: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST …/confirmation-requests (sent on the click)
  estimate_schedule.read:               {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # GET /v1/tax/estimates
  estimate_schedule.update:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # PATCH inputs and installments (client service records only)
  estimate_schedule.confirmation_send:  {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required}   # POST …/installments/{q}/confirmation-requests
  tax_schedule.export:         {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, not_offshore: required, mfa_recent: required}   # GET …/extensions/export.xlsx and …/estimates/export.xlsx (visible rows only)
  # --- T-04 return review workspace and individual returns (T-04-T03, protected bundle; DEC-37,
  # DEC-21, DEC-3018; SPEC-649). Reads are the return team's (walls apply; the agent within its
  # task_scope). Every approve, override, confirm, draft-run and request action is a person's: the
  # agent and the system are denied (I-AGENT-NEVER). Document approval levels follow the viewer's
  # work-item function (preparer, detail, manager; DEC-37: staff included at preparer level).
  return_worksheet.read:      {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # TXI-01 worksheets and fields, TAX-05 leadsheets
  document.approve:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TAX-04 b and TAX-05 b, one row per level (DEC-37)
  tax_return.request_approval: {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TAX-05 e "Request final approval…"
  tax_return.draft_run:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, function_in: "preparer,detail_reviewer,manager_reviewer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the Return Drafter's staff-only start (Q12)
  k1_treatment.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # TXI-02 rows
  k1_treatment.resolve:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # a proposed treatment (the agent proposes; a person decides)
  k1_treatment.approve:       {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TXI-02 b
  k1_treatment.override:      {engagement_partner: allow, manager: allow, function_in: "manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TXI-02 d, with a required reason (service)
  residency.read:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # TXI-03 residency and allocation
  residency.request_proposal: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # ask for the SHL-10 proposal (Q1)
  residency.confirm:          {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TXI-03 b "Residency confirmed by Samuel Ito"
  # --- T-05 entity returns (T-05-T04, the S35 protected bundle; T-05 §4.3; SPEC-651). Every human
  # verb is agent: deny, platform support and portal principals deny; reads give the agent its
  # task scope. Independence is not required for tax. Walls, tenant and the Filed/Accepted lock
  # (archived_write) apply as everywhere.
  workbook.read:              {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # TXP-11 sheets, cells, versions, sync and diffs; TXP-00 run reads
  workbook.edit:              {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person keys or overrides a cell (expected version; cells a run holds are locked)
  workbook.export:            {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, mfa_recent: required}   # the workbook xlsx (formula-escaped); never the engine export
  workbook_import.create:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # import-mode steps: the firm's depreciation register, state K-1s and K-3s
  workbook_run.start:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # ▶ Run, re-run and cancel: a person starts the run; its steps run as that person via Agent
  tax_ownership.edit:         {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # ownership periods and interest transfers, each with its clause citation
  allocation_structure.read:  {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # TXP-06 rungs, periods and their clause citations
  allocation_structure.edit:  {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # key or edit the structure; its approval is a review sign-off (C3)
  tax_memo.read:              {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # TXP-01 the preparer memo, its sections and markers
  tax_memo.edit:              {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person writes or adopts the memo (agent-off path: the whole memo)
  tax_memo.draft:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny}   # a person asks for a draft; the drafting run proposes, never adopts
  tax_reconciliation.read:    {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, platform_support: deny, platform_support_content: deny, agent: task_scope, system: deny}   # tie-out tallies against the engine import (CCH reconciliation)
