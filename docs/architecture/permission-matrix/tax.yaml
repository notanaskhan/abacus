# The tax module's actions (ADR-027; P-39, F-03-T07). Compiled with every other module's file into
# identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- the engine bridge and the e-file record (T-01-T02 stub; T-01 §4.3; DEC-1156). Every write
  # is a person's: agent, system and client principals are denied (I-AGENT-NEVER). Accrued never
  # transmits (R-04): `transmission.record` records what the ERO did in the engine. Work-item
  # conditions narrow the reviewer and signer acts; the ERO designation and BH-TAX-02's named
  # approver are checked by the service on the return (T-01-T27, T37).
  tax_return.read:            {firm_admin: allow, practice_leader: allow, quality_partner: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # final-approval facts, engine sync, imports, delivery
  tax_return.approve:         {engagement_partner: allow, function_in: signer, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # POST /v1/tax-returns/{id}/final-approval (only tax/approval.py records it)
  tax_return.export:          {engagement_partner: allow, manager: allow, reviewer: allow, function_in: "detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the workbook after final approval
  engine_import.create:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # upload an engine file
  engine_import.approve:      {engagement_partner: allow, manager: allow, senior: allow, reviewer: allow, function_in: "first_level_reviewer,detail_reviewer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # a person approves the diff
  delivery_packet.prepare:    {client_service: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # assemble, edit, letter, 8879 envelope, ERO notice
  delivery_packet.approve:    {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # DEC-38: the signer or a manager-level person (service)
  transmission.record:        {engagement_partner: allow, manager: allow, function_in: signer, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # the ERO's record; ero_designated checked by the service
  efile_ack.record:           {engagement_partner: allow, manager: allow, reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # a manual ack with evidence
  deliverable.publish:        {client_service: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # release the client copy to the portal
  # --- tax-returns v1, K-1 packages (T-02-T03, DEC-1162; T-02 §4.4): T-02's rows of the S16
  # bundle. Reads of metadata are every firm role's (walls apply); writes are a person's. The
  # BH-TAX-02 approver, the release eligibility and the target-return reach are the service's.
  tax_return.read_metadata:   {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: task_scope, system: deny}   # TAX-01 rows, tiles, the ReturnFrame record
  tax_return.assign:          {firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # bulk and single assignment
  tax_return.status_change:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, function_in: "preparer,detail_reviewer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # start_preparation, start_review
  k1_package.read:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # TXP-12 rows, packages, documents, release check
  k1_package.share_internal:  {manager: allow, engagement_partner: allow, function_in: "preparer,manager_reviewer,signer", client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # share to another return's intake
  k1_package.release:         {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny, mfa_recent: required}   # release to the portal, undo within the window (tax/k1_release.py)
  k1_package.resend:          {manager: allow, client_service: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # resend a released package
  k1_recipient.review_details: {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, agent: deny, system: deny}   # DV-10: accept or reject a recipient's details change
