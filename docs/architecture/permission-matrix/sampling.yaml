# The sampling module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- Sampling ---
  sample_set.create:        {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny}   # create a sample set and start a draw (a person starts every draw, DV-A1)
  # --- Sampling engine (A-03 §4.3, §4.7; A-03-T01, DEC-1550; ADR-340) ---
  # Every write is a person's: agent, system, support and every portal principal deny (INV-1).
  # Reads are engagement members through visible(); the agent reads at task_scope (C17 later).
  population.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}   # GET /v1/populations/{pid}
  population.create:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # build a population and record its completeness ties
  sample_set.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}   # picker, projection, draw progress, items
  sample_set.approve:       {engagement_partner: allow, manager: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required, not_preparer_of_target: required}   # L2 approval through review.api; never the preparer (R-SO-3); DB CHECK approved_actor_kind = 'human'
  sample_set.export:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required, not_offshore: required}   # deterministic XLSX (ADR-042), audited; census display fields stay onshore
  sample_set.generate_requests: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # preview and create the item-request fan-out (Idempotency-Key)
  support_match.run:        {system: allow, agent: task_scope}
  # --- A-08 audit fieldwork depth (A-08-T03; A-08 §4.3; SPEC-657; DEC-5030) ---
  # Every adopt, decide and send is a person's: agent, system, support, every portal principal and
  # the link principal deny (INV-1, I-AGENT-NEVER). Reads are team members through visible().
  je_test.read:                       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: task_scope, system: deny, independence: required}   # GET /v1/je-tests/{jid} and …/entries (accounts masked)
  je_test.create:                     {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # POST /v1/work-items/{wid}/je-tests: population, tie, draft (409 population_not_tied)
  je_test.configure:                  {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # PUT …/criteria and …/posting-user-roles (firm policy version, cited role map)
  je_test.score:                      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # POST …/score: 202, JeScoringWorkflow dispatched for the person
  je_test.compute:                    {system: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny}   # the workflow's scoring activities (identifiers in and out)
  sample_expansion.request:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required}   # POST /v1/sample-sets/{sid}/expansions and …/withdraw; rationale and a named approver required
  sample_expansion.decide:            {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, link_principal: deny, agent: deny, system: deny, independence: required, is_named_approver: required, not_preparer_of_target: required}   # only the named approver, never the requester; DB CHECK decided_actor_kind = 'human'
