# The assurance module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- The trial balance of record (SPEC-309; TASK-320; A-02 §4.4) ---
  trial_balance.read:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # firm roles only; client and agent principals deny
  trial_balance.adopt:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # human only (the database CHECK agrees)
  trial_balance.annotate:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # audit area and WP ref; amounts are never editable
  trial_balance.export:     {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny, independence: required, mfa_recent: required, not_offshore: required}   # A-02 §4.4 (TASK-1185): Open in Excel (C9 v1 stub, A-02-T22 live); audited; a fresh second factor and no wider than run_trace.export (DEC-316, amended by the security review)
  # --- Completion, release and archive (SPEC-314; TASK-332; A-07 record mode) ---
  completion.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}
  completion.record:        {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # the report record and the signed representation letter (documents and dates)
  completion.decide:        {engagement_partner: allow, agent: deny, independence: required}   # going concern, reserved to the engagement partner
  eqr.concur:               {reviewer: allow, agent: deny, independence: required}   # only the assigned EQR (the service checks), never on the team that performed it
  report.approve:           {engagement_partner: allow, agent: deny, independence: required}
  report.release:           {engagement_partner: allow, agent: deny, independence: required}   # G8; the server re-checks G5-G7 in the same unit. A-07 adds fresh MFA with the step-up flow
  archive.lock:             {engagement_partner: allow, manager: allow, agent: deny, independence: required}   # G9; afterwards the engagement is archived and read-only
  # --- Account mapping and draft statements (SPEC-316; TASK-345; A-03) ---
  grouping_set.import:      {firm_admin: allow, practice_leader: allow, quality_partner: allow, agent: deny, system: deny}   # firm content through the import endpoint (never seeded); lists versions too
  grouping_set.publish:     {practice_leader: allow, quality_partner: allow, agent: deny, system: deny, mfa_recent: required}   # a draft with no problems; frozen once published; human only (published_actor_kind)
  mapping_set.edit:         {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny, independence: required}   # live v0 routes (SPEC-316): start the mapping and map accounts; A-03-T08 moves them to mapping_set.run and account_mapping.edit (DEC-1550)
  # --- C9 v2 taxonomy and mapping (A-03 §4.3, §4.7; A-03-T01, DEC-1550; ADR-341) ---
  # Routes live here because ledger has none (Q-15). Every write: agent, support and portal deny;
  # the system holds only mapping_set.run (the trial_balance.version_created subscriber's start).
  grouping_set.read:        {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # catalogue and picker (Recently used is the viewer's own)
  mapping_set.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}   # rows, tallies, run progress, mapped trial balance
  mapping_set.run:          {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: allow, independence: required}   # start or re-run the rules; the system only as the subscriber's dispatch on adoption
  mapping_set.confirm:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # L1 Prepared through review.api; DB CHECK confirmed_actor_kind = 'human'
  account_mapping.edit:     {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # one account's FS line, insert-only edit (ADR-341 §5)
  # --- The engagement dashboard (SPEC-317; TASK-346; K-04 ENG-12) ---
  dashboard.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # team members only; client and agent principals deny
  # --- Audits cockpit, record mode (A-01 §4.4; A-01-T02 stub, DEC-261) ---
  # Human only: a named person records a phase, an external release or an external archive while
  # Accrued computes no gate for it (INV-1; the database CHECKs agree). Client roles hold no cell.
  assurance.record_phase:   {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # POST /v1/audits/{id}/phase; forward one step only (409 phase_backward, phase_skip, phase_follows_gate)
  assurance.record_release: {engagement_partner: allow, agent: deny, system: deny, mfa_recent: required, independence: required}   # POST /v1/audits/{id}/release-record; interim G8; 409 release_mode_in_app when the firm releases in Accrued
  assurance.record_archive: {engagement_partner: allow, manager: allow, agent: deny, system: deny, mfa_recent: required, independence: required}   # POST /v1/audits/{id}/archive-record; interim G9 against a ready final binder export (DEC-83)
