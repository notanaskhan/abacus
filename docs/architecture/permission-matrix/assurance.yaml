# The assurance module's actions (ADR-027; P-39, F-03-T07). Compiled with every other
# module's file into identity/authz/_matrix.py by `make regenerate`.

actions:
  # --- The trial balance of record (SPEC-309; TASK-320; A-02 §4.4) ---
  trial_balance.read:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # firm roles only; client and agent principals deny
  trial_balance.adopt:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # human only (the database CHECK agrees)
  trial_balance.annotate:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # audit area and WP ref; amounts are never editable
  trial_balance.export:     {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny, independence: required, mfa_recent: required, not_offshore: required}   # A-02 §4.4 (TASK-1185): Open in Excel (C9 v1 stub, A-02-T22 live); audited; a fresh second factor and no wider than run_trace.export (DEC-316, amended by the security review)
  # --- Completion, release and archive (SPEC-314; TASK-332; A-07 record mode) ---
  completion.read:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}
  completion.record:        {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # the report record and the signed representation letter (documents and dates)
  completion.decide:        {engagement_partner: allow, agent: deny, independence: required}   # going concern, reserved to the engagement partner
  eqr.concur:               {reviewer: allow, agent: deny, independence: required}   # only the assigned EQR (the service checks), never on the team that performed it
  report.approve:           {engagement_partner: allow, agent: deny, independence: required}
  report.release:           {engagement_partner: allow, agent: deny, independence: required}   # G8; the server re-checks G5-G7 in the same unit. A-07 adds fresh MFA with the step-up flow
  archive.lock:             {engagement_partner: allow, manager: allow, agent: deny, independence: required}   # G9; afterwards the engagement is archived and read-only
  # --- Account mapping and draft statements (SPEC-316; TASK-345; A-03) ---
  grouping_set.import:      {firm_admin: allow, practice_leader: allow, quality_partner: allow, agent: deny, system: deny}   # firm content through the import endpoint (never seeded); lists versions too
  grouping_set.publish:     {practice_leader: allow, quality_partner: allow, agent: deny, system: deny, mfa_recent: required}   # a draft with no problems; frozen once published; human only (published_actor_kind)
  mapping_set.edit:         {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny, independence: required}   # live v0 routes (SPEC-316): start the mapping and map accounts; A-03-T08 moves them to mapping_set.run and account_mapping.edit (DEC-1550)
  # --- C9 v2 taxonomy and mapping (A-03 §4.3, §4.7; A-03-T01, DEC-1550; ADR-341) ---
  # Routes live here because ledger has none (Q-15). Every write: agent, support and portal deny;
  # the system holds only mapping_set.run (the trial_balance.version_created subscriber's start).
  grouping_set.read:        {firm_admin: allow, practice_leader: allow, quality_partner: allow, security_admin: allow, firm_partner: allow, firm_manager: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_service: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny}   # catalogue and picker (Recently used is the viewer's own)
  mapping_set.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: task_scope, system: deny, independence: required}   # rows, tallies, run progress, mapped trial balance
  mapping_set.run:          {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: allow, independence: required}   # start or re-run the rules; the system only as the subscriber's dispatch on adoption
  mapping_set.confirm:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # L1 Prepared through review.api; DB CHECK confirmed_actor_kind = 'human'
  account_mapping.edit:     {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, agent: deny, system: deny, independence: required}   # one account's FS line, insert-only edit (ADR-341 §5)
  # --- The engagement dashboard (SPEC-317; TASK-346; K-04 ENG-12) ---
  dashboard.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # team members only; client and agent principals deny
  # --- Audits cockpit, record mode (A-01 §4.4; A-01-T02 stub, DEC-261) ---
  # Human only: a named person records a phase, an external release or an external archive while
  # Accrued computes no gate for it (INV-1; the database CHECKs agree). Client roles hold no cell.
  assurance.record_phase:   {engagement_partner: allow, manager: allow, agent: deny, system: deny, independence: required}   # POST /v1/audits/{id}/phase; forward one step only (409 phase_backward, phase_skip, phase_follows_gate)
  assurance.record_release: {engagement_partner: allow, agent: deny, system: deny, mfa_recent: required, independence: required}   # POST /v1/audits/{id}/release-record; interim G8; 409 release_mode_in_app when the firm releases in Accrued
  assurance.record_archive: {engagement_partner: allow, manager: allow, agent: deny, system: deny, mfa_recent: required, independence: required}   # POST /v1/audits/{id}/archive-record; interim G9 against a ready final binder export (DEC-83)
  # --- A-04 audit planning (docs/contracts/audit-planning.md; A-04-T01, DEC-1757) ---
  # Behind assurance.materiality, .risk_register, .internal_control and .service_orgs. Every write
  # denies the agent, the system and every client principal; decisions go through C3's decision.decide.
  materiality.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # GET materiality (A-04 shape, T12) and POST …/materiality/preview: code-computed thresholds, no write; never on a client surface (AC3.9)
  materiality.propose:      {manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/materiality/proposals: options by code, raises the planning_materiality card (reserved to the EP)
  materiality.reassess:     {manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/materiality/reassessments: final-basis compute; raises the reassessment card
  risk.read:                {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # the register with its code tally, a risk's drawer, the linkage matrix, the coverage check
  risk.edit:                {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PATCH …/risks/{rid} through review.api.record_value; RMM recomputed by code; 422 presumption_not_rebuttable on management override
  risk.link:                {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST and DELETE …/risks/{rid}/responses
  risk.route_for_approval:  {manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/risks/approval-requests: one significant_risk card over every pending proposal; the agent may raise only inside a task scope later, never decide
  fraud_session.read:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # GET …/fraud-brainstorm and …/fraud-inquiries
  fraud_session.edit:       {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PUT …/fraud-brainstorm and …/fraud-brainstorm/minutes (written or adopted)
  fraud_minutes.approve:    {engagement_partner: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/fraud-brainstorm/minutes/approve: the EP only; five layers with require_live_human, the DB CHECK and FRAUD-MINUTES-001 (A-04-T19)
  fraud_inquiry.request:    {manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST …/fraud-inquiries: a POR-05 questionnaire draft through C5; a person sends it
  control.read:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # processes, walkthroughs and the exceptions sheet
  control.edit:             {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PUT …/internal-control/processes/{id}
  deficiency.propose_severity: {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PATCH …/exceptions/{row}/proposed-severity: a proposal only; concluding stays A-06's (EP)
  exception.route:          {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # send-to-findings and convert-to-misstatement through A-06's registered router (503 route_not_available until it registers)
  service_org.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, eqr_reviewer: allow, specialist: allow, quality_partner: in_scope, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: task_scope, system: deny, independence: required}   # the inventory shared by AUD-04 and AUD-10, and SOC report evaluations
  service_org.edit:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # POST and PATCH …/service-organizations[/{id}]
  soc_report.evaluate:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: deny, client_contributor: deny, third_party: deny, client_service: deny, agent: deny, system: deny, independence: required}   # PATCH …/soc-reports/{id} and …/cuecs/{n}; POST …/reliance-requests (409 gap_open, cuec_evidence_missing); the agent never raises reliance
