# Feature flag registry (ADR-089; SPEC-011). PROTECTED: changes need the founder's approval.
#
# Each flag: name, description, owner, created, expires (at most 90 days after created; an
# expired flag fails `make check-fast` until it is removed), kind (boolean | variant), values
# (variants only) and default (the safe behaviour: flags fall back to it on any read error).
# Regenerate the runtime module after editing: python -m abacus_tools.codegen.feature_flags

flags:
  - name: prompt.evidence.screener
    description: The screener's prompt version per firm (prompt rollouts, SPEC-011 Q3).
    owner: founder
    created: 2026-10-07
    expires: 2027-01-05
    kind: variant
    values: [evidence.screen@v0]
    default: evidence.screen@v0
  - name: uploads.processing
    description: Each upload is read in isolation (text, tables, fields) by a background workflow (SPEC-029; TASK-054). Scanning applies whatever this says. Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: founder
    created: 2026-10-12
    expires: 2027-01-09
    kind: boolean
    default: false
  - name: ledger.import
    description: Clients (or the firm on their behalf) upload an exported trial balance instead of connecting (SPEC-028; TASK-052). Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: founder
    created: 2026-10-11
    expires: 2027-01-08
    kind: boolean
    default: false
  - name: engagement_agent.enabled
    description: Route automatic screening, retrieval and inbox matching through each engagement's agent, with its activity feed and pause switches (SPEC-027; TASK-050). Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: founder
    created: 2026-10-10
    expires: 2027-01-07
    kind: boolean
    default: false
  - name: retrieval.auto
    description: Start retrievals automatically for available tier A items (SPEC-022 AC-4). Off until the founder switches it on per firm; the local seed turns it on for Dev firm.
    owner: founder
    created: 2026-10-09
    expires: 2027-01-07
    kind: boolean
    default: false
