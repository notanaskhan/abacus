# Role templates (G-01-T02 skeleton; G-01 section 3.5, 4.3). PROTECTED.
#
# Each template names its allowed levels, its firm role (if any) and, once G-01-T05 compiles this
# file (`abacus_tools/codegen/permission_matrix.py` into `_role_templates.py` and
# `roleTemplates.gen.ts`), its eligible engagement roles, work-item functions and the 16 grid
# rows. Grid cells are computed from the compiled permission matrix for actions that exist, and
# taken from `declared_policy` (marked `source: policy`) for actions that don't yet; a drift test
# fails when the two disagree (AC5.2). The Accrued Agent row is locked (AC5.3).
#
# Skeleton only: no grid rows yet (G-01-T05 adds them with the compiler).

templates:
  partner:      {levels: [partner], firm_role: null}
  manager:      {levels: [manager], firm_role: null}
  tax_reviewer: {levels: [manager, senior], firm_role: null}
  senior:       {levels: [senior], firm_role: null}
  staff:        {levels: [staff, seasonal], firm_role: null}
  tax_preparer: {levels: [staff, seasonal], firm_role: null}
  firm_admin:   {levels: [admin], firm_role: firm_admin}
  it_security:  {levels: [admin], firm_role: security_admin}

grid: []
