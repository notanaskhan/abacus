# Permission matrix (ADR-027). Change it in the same change as the routes it governs; make regenerate.
# Tests are generated from this file. Every API route declares exactly one action below.
#
# Values:
#   allow                     permitted, subject to global conditions
#   deny                      never permitted
#   assigned_only             only items assigned to this client user
#   client_visible_only       only client-visible fields and items
#   firm_setting(<name>)      permitted if the firm enables <name>
#   in_scope                  practice leader / quality partner: engagements in their scope
#   task_scope                agent: only if the task declares this action
#
# Global conditions (apply to every action unless overridden):
#   walled: deny              ADR-026 — overrides every role
#   tenant_mismatch: deny     ADR-014 / ADR-023
#   archived_write: deny      archived engagements are read-only
#   access_expired: deny      expired client grants and connections
#
# Roles without an engagement relationship (firm_admin, practice_leader, quality_partner)
# are evaluated per ADR-024. Agents: ADR-005, ADR-025. Draft v0.1 — finalise in SPEC.

roles: [firm_admin, practice_leader, quality_partner,
        engagement_partner, manager, senior, staff, reviewer,
        client_admin, client_contributor, agent, system,
        platform_support, platform_support_content]   # SPEC-012: break-glass, read-only

actions:

  # --- Firm administration ---
  firm.manage_users:        {firm_admin: allow, mfa_recent: required}
  firm.manage_settings:     {firm_admin: allow, mfa_recent: required}
  support_session.read:     {firm_admin: allow}   # SPEC-012
  support_session.manage:   {firm_admin: allow, mfa_recent: required}   # SPEC-012 Q1
  budget.read:              {firm_admin: allow, practice_leader: allow, platform_support: allow, platform_support_content: allow}   # SPEC-007
  budget.manage:            {firm_admin: allow, mfa_recent: required}     # SPEC-007 Q3
  methodology.manage:       {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-008 Q3
  methodology.read:         {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow, agent: task_scope}   # SPEC-008; agent: the guidance drafter on a template, firm-level (TASK-074 D1)
  knowledge.manage:         {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-009 Q4
  knowledge.read:           {firm_admin: allow, practice_leader: allow, quality_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, platform_support_content: allow}   # SPEC-009 Q4
  autonomy_policy.update:   {firm_admin: allow, mfa_recent: required}
  firm.read_settings:       {firm_admin: allow, practice_leader: allow}   # SPEC-024 (TASK-042 D1): autonomy and the checklist, read without fresh MFA
  wall.create:              {firm_admin: allow, mfa_recent: required}
  wall.remove:              {firm_admin: allow, mfa_recent: required}
  wall.list:                {firm_admin: allow, mfa_recent: required}   # SPEC-002 Q2 (named wall.read there)
  legal_hold.place:         {firm_admin: allow, mfa_recent: required}
  legal_hold.lift:          {firm_admin: allow, mfa_recent: required}

  # --- Engagements ---
  engagement.create:        {firm_admin: allow, practice_leader: allow}
  roll_forward.read:        {firm_admin: allow, practice_leader: allow}   # SPEC-025 (TASK-048 D3): last year's team, template and items, checked on that engagement
  # --- The engagement agent (SPEC-027; TASK-050) ---
  activity.read:            {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}   # the activity feed
  agent.pause:              {engagement_partner: allow, manager: allow}   # pause or resume an engagement's agent
  firm_agents.pause:        {firm_admin: allow, mfa_recent: required}   # every agent in the firm
  firm.ai_client_data:      {firm_admin: allow, mfa_recent: required}   # SPEC-036 (TASK-076): opt in to AI on clients' data, against the disclosure
  engagement.ai_exclude:    {engagement_partner: allow}   # SPEC-036 (TASK-076): switch AI off for one engagement
  # --- Acceptance, independence and the letter (SPEC-025; TASK-044) ---
  acceptance.record:        {engagement_partner: allow, mfa_recent: required}   # decision, documentation, the independence conclusion
  independence.confirm:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}   # for oneself only (the service refuses others)
  letter.record:            {engagement_partner: allow, manager: allow}
  setup.read:               {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}
  client.read:              {firm_admin: allow, practice_leader: allow}   # SPEC-025 (TASK-043 D1): the client picker, as engagement.create
  engagement.apply_methodology: {engagement_partner: allow, manager: allow}   # SPEC-008 AC-4
  engagement.read_metadata:
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
    client_admin: allow       # SPEC-020: their own engagement's name, firm and period
    client_contributor: allow
  engagement.read:          # content, not just metadata — ADR-024
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: client_visible_only
    platform_support_content: allow   # SPEC-012
  engagement.self_join:     {firm_admin: allow, notify: engagement_team}
  client_contact.invite:    {engagement_partner: allow, manager: allow, client_admin: allow}   # SPEC-015 Q2 (client admins: contributors only, in the service)
  client_contact.read:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: allow}   # SPEC-015
  client_contact.remove:    {engagement_partner: allow, manager: allow, client_admin: allow}   # SPEC-015 (client admins: contributors only)
  engagement.update:        {engagement_partner: allow, manager: allow}
  engagement.member_add:    {engagement_partner: allow, manager: allow}
  engagement.member_remove: {engagement_partner: allow, manager: allow}
  engagement.archive:       {engagement_partner: allow}

  # --- Request items ---
  request_item.read:
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  request_item.create:      {engagement_partner: allow, manager: allow, senior: allow}
  request_item.update:      {engagement_partner: allow, manager: allow, senior: allow}
  request_item.assign:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: allow}
  client_item.respond:      {client_admin: client_visible_only, client_contributor: assigned_only}   # SPEC-042 (TASK-106): "This doesn't apply", with a reason
  client_list.mark_done:    {client_admin: allow}   # SPEC-042 AC-4: the client admin marks their list done
  request_item.waive:       {engagement_partner: allow, manager: allow, requires: reason}
  request_item.mark_ready:  {engagement_partner: allow, manager: allow, senior: allow, staff: allow}

  # --- Evidence ---
  evidence.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support_content: allow   # SPEC-012
  evidence.upload:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    client_admin: allow
    client_contributor: assigned_only
    system: allow             # retrieval via connections
  # --- Comments (SPEC-032; TASK-062; ADR-109): client roles see shared comments only (service) ---
  comment.read:
    independence: required   # client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    platform_support_content: allow   # TASK-062 D4: break-glass content, read-only
  comment.create:
    independence: required
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
  comment.share:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, independence: required}
  comment.redact:           {firm_admin: allow, mfa_recent: required}   # ADR-109: a comment posted in error
  evidence.accept:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  evidence.reject:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  evidence.void:            {engagement_partner: allow, manager: allow, requires: reason}

  # --- Fulfilments ---
  fulfilment.propose:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: task_scope, system: allow}
  fulfilment.confirm:       {engagement_partner: allow, manager: allow, senior: allow, agent: deny}

  # --- Review queues (SPEC-004 Q7, Q8; TASK-019) ---
  review.read:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: deny               # ADR-005
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  review.take:
    independence: required   # SPEC-025 (TASK-045): client data, per person
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  review.assign:           {engagement_partner: allow, manager: allow, agent: deny, independence: required}

  # --- Screening and suggestions ---
  screening.run:            {system: allow, agent: task_scope}
  screening.request:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, independence: required}   # SPEC-024 (TASK-042 D1): "Screen now" at Advise
  upload_review.run:        {system: allow, agent: task_scope}   # SPEC-030 (TASK-058): the upload reviewer records its review
  guidance_draft.read:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # SPEC-035 (TASK-073): firm roles; drafts never reach clients
  guidance_draft.request:   {engagement_partner: allow, manager: allow, senior: allow, independence: required}   # SPEC-035: "Draft guidance"
  guidance_draft.decide:    {engagement_partner: allow, manager: allow, senior: allow, independence: required}   # SPEC-035: approve or discard (ADR-005)
  guidance_draft.run:       {system: allow, agent: task_scope}   # SPEC-035 (TASK-072): the guidance drafter records its drafts
  template_guidance.read:   {firm_admin: allow, practice_leader: allow}   # SPEC-035 Q3 (TASK-074 D3): drafts on a template version
  template_guidance.request: {firm_admin: allow, practice_leader: allow}   # SPEC-035 Q3: "Draft guidance" on a template version
  template_guidance.decide: {firm_admin: allow, practice_leader: allow}   # SPEC-035 Q3: approve or discard; publishing a version is methodology.manage
  inbox_match.run:          {system: allow, agent: task_scope}   # SPEC-033 (TASK-065): the matcher records its proposals
  inbox_match.read:         {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # SPEC-033 (TASK-066): firm roles only; clients get request IDs through the inbox
  inbox_match.request:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, independence: required}   # SPEC-033: "Suggest with AI"
  upload_review.read:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, independence: required}   # SPEC-030 (TASK-059 D1): firm roles only; clients are refused by role
  upload_review.request:    {engagement_partner: allow, manager: allow, senior: allow, independence: required}   # SPEC-030: "Review now" at Advise
  suggestion.create:        {agent: task_scope}
  # --- Fieldwork (SPEC-037; TASK-083) ---
  materiality.set:          {engagement_partner: allow, manager: allow, independence: required}   # Q3: entered by people
  procedure.configure:      {engagement_partner: allow, manager: allow, independence: required}   # a procedure's criteria
  procedure.run:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, independence: required}   # start, pick, select
  procedure.read:           {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, agent: task_scope, independence: required}   # firm roles only; clients are refused by role. agent: the entry assessor (TASK-085)
  workpaper.sign_ready:     {manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # SPEC-037 (TASK-084), ADR-131 Q2: the preparer; TASK-089: never the agent
  entry_assessment.request: {engagement_partner: allow, manager: allow, senior: allow, staff: allow, independence: required}   # SPEC-037 Q4 (TASK-085): "Assess with AI"
  entry_assessment.run:     {system: allow, agent: task_scope}   # TASK-085: the entry assessor records its assessments
  entry_assessment.adopt:   {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # SPEC-044 (TASK-109) AC-4: a person adopts the agent's proposals as results
  workpaper.sign_reviewed:  {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # ADR-131 Q2: never the preparer (the service refuses); TASK-089: never the EQR (`reviewer`) or the agent
  suggestion.resolve:       {engagement_partner: allow, manager: allow, senior: allow, agent: deny}
  sample.approve:           {engagement_partner: allow, manager: allow, agent: deny, independence: required}   # SPEC-040 (TASK-100) Q1: a manager or the partner agrees the sample
  item.sign_prepared:       {manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # SPEC-040 AC-6: the row's preparer (Q5: never the partner)
  item.sign_reviewed:       {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # SPEC-040 AC-7: never the row's preparer (the service refuses), the EQR or the agent
  review_note.raise:        {engagement_partner: allow, manager: allow, senior: allow, reviewer: allow, agent: deny, independence: required}   # SPEC-041 (TASK-103) Q1: reviewers, the EQR included
  review_note.respond:      {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, agent: deny, independence: required}   # SPEC-041 AC-2: the preparer answers; the raiser can reply
  review_note.clear:        {engagement_partner: allow, manager: allow, senior: allow, reviewer: allow, agent: deny, independence: required}   # SPEC-041 AC-3: only the raiser (the service checks)
  finding.raise:            {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: deny, independence: required}   # SPEC-043 (TASK-107) AC-4
  misstatement.set:         {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # SPEC-043 AC-4: people record misstatements
  materiality.decide:       {engagement_partner: allow, agent: deny, independence: required}   # SPEC-300 (TASK-301) AC-2: only the engagement partner decides materiality
  risk.assess:              {engagement_partner: allow, manager: allow, senior: allow, agent: deny, independence: required}   # SPEC-300 AC-4: the team records and revises risks
  risk.approve:             {engagement_partner: allow, agent: deny, independence: required}   # SPEC-300 AC-5: the partner approves significant risks and rebuttals

  # --- Communications (SPEC-006 Q4; TASK-021) ---
  message.send:             {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny}

  # --- Connections ---
  connection.create:        {client_admin: allow, mfa_recent: required}   # only the client grants access; fresh MFA (SPEC-020 AC-3)
  connection.check:         {client_admin: allow, engagement_partner: allow, manager: allow}   # SPEC-020 AC-4 (TASK-036 D4)
  connection.revoke:        {client_admin: allow, engagement_partner: allow, manager: allow}
  connection.pull:          {system: allow}
  connection.read_log:     {client_admin: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow, independence: required}
  ledger_import.upload:     {client_admin: allow, engagement_partner: allow, manager: allow, senior: allow, independence: required}   # SPEC-028 (TASK-052): an exported trial balance (staff: on behalf, Q4)

  # --- Follow-ups ---
  follow_up.draft:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: task_scope}
  follow_up.send:
    engagement_partner: allow
    manager: allow
    senior: allow
    agent: firm_setting(autonomy_policy)   # routine reminders only, per autonomy policy. TASK-104: the agent no longer sends (it only drafts); the deny follows with the agent-spec change (DEC-74)

  # --- Sampling ---
  sample_set.create:        {engagement_partner: allow, manager: allow, senior: allow}
  support_match.run:        {system: allow, agent: task_scope}

  # --- Audit trail and export ---
  audit_event.read:         {engagement_partner: allow, manager: allow, quality_partner: in_scope, firm_admin: allow, platform_support: allow, platform_support_content: allow}
  export.create:            {engagement_partner: allow, manager: allow, mfa_recent: required}
