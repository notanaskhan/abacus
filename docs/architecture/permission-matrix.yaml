# Permission matrix — PROTECTED PATH (ADR-027). Changes require human approval.
# Tests are generated from this file. Every API route declares exactly one action below.
#
# Values:
#   allow                     permitted, subject to global conditions
#   deny                      never permitted
#   assigned_only             only items assigned to this client user
#   client_visible_only       only client-visible fields and items
#   firm_setting(<name>)      permitted if the firm enables <name>
#   in_scope                  practice leader / quality partner: engagements in their scope
#   task_scope                agent: only if the task declares this action
#
# Global conditions (apply to every action unless overridden):
#   walled: deny              ADR-026 — overrides every role
#   tenant_mismatch: deny     ADR-014 / ADR-023
#   archived_write: deny      archived engagements are read-only
#   access_expired: deny      expired client grants and connections
#
# Roles without an engagement relationship (firm_admin, practice_leader, quality_partner)
# are evaluated per ADR-024. Agents: ADR-005, ADR-025. Draft v0.1 — finalise in SPEC.

roles: [firm_admin, practice_leader, quality_partner,
        engagement_partner, manager, senior, staff, reviewer,
        client_admin, client_contributor, agent, system,
        platform_support, platform_support_content]   # SPEC-012: break-glass, read-only

actions:

  # --- Firm administration ---
  firm.manage_users:        {firm_admin: allow, mfa_recent: required}
  firm.manage_settings:     {firm_admin: allow, mfa_recent: required}
  support_session.read:     {firm_admin: allow}   # SPEC-012
  support_session.manage:   {firm_admin: allow, mfa_recent: required}   # SPEC-012 Q1
  budget.read:              {firm_admin: allow, practice_leader: allow, platform_support: allow, platform_support_content: allow}   # SPEC-007
  budget.manage:            {firm_admin: allow, mfa_recent: required}     # SPEC-007 Q3
  methodology.manage:       {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-008 Q3
  methodology.read:         {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow}   # SPEC-008
  knowledge.manage:         {firm_admin: allow, practice_leader: allow, mfa_recent: required}   # SPEC-009 Q4
  knowledge.read:           {firm_admin: allow, practice_leader: allow, quality_partner: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow, platform_support_content: allow}   # SPEC-009 Q4
  autonomy_policy.update:   {firm_admin: allow, mfa_recent: required}
  firm.read_settings:       {firm_admin: allow, practice_leader: allow}   # SPEC-024 (TASK-042 D1): autonomy and the checklist, read without fresh MFA
  wall.create:              {firm_admin: allow, mfa_recent: required}
  wall.remove:              {firm_admin: allow, mfa_recent: required}
  wall.list:                {firm_admin: allow, mfa_recent: required}   # SPEC-002 Q2 (named wall.read there)
  legal_hold.place:         {firm_admin: allow, mfa_recent: required}
  legal_hold.lift:          {firm_admin: allow, mfa_recent: required}

  # --- Engagements ---
  engagement.create:        {firm_admin: allow, practice_leader: allow}
  # --- Acceptance, independence and the letter (SPEC-025; TASK-044) ---
  acceptance.record:        {engagement_partner: allow, mfa_recent: required}   # decision, documentation, the independence conclusion
  independence.confirm:     {engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}   # for oneself only (the service refuses others)
  letter.record:            {engagement_partner: allow, manager: allow}
  setup.read:               {firm_admin: allow, practice_leader: allow, engagement_partner: allow, manager: allow, senior: allow, staff: allow, reviewer: allow}
  client.read:              {firm_admin: allow, practice_leader: allow}   # SPEC-025 (TASK-043 D1): the client picker, as engagement.create
  engagement.apply_methodology: {engagement_partner: allow, manager: allow}   # SPEC-008 AC-4
  engagement.read_metadata:
    firm_admin: allow
    practice_leader: in_scope
    quality_partner: allow
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
    client_admin: allow       # SPEC-020: their own engagement's name, firm and period
    client_contributor: allow
  engagement.read:          # content, not just metadata — ADR-024
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: client_visible_only
    platform_support_content: allow   # SPEC-012
  engagement.self_join:     {firm_admin: allow, notify: engagement_team}
  client_contact.invite:    {engagement_partner: allow, manager: allow, client_admin: allow}   # SPEC-015 Q2 (client admins: contributors only, in the service)
  client_contact.read:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: allow}   # SPEC-015
  client_contact.remove:    {engagement_partner: allow, manager: allow, client_admin: allow}   # SPEC-015 (client admins: contributors only)
  engagement.update:        {engagement_partner: allow, manager: allow}
  engagement.member_add:    {engagement_partner: allow, manager: allow}
  engagement.member_remove: {engagement_partner: allow, manager: allow}
  engagement.archive:       {engagement_partner: allow}

  # --- Request items ---
  request_item.read:
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  request_item.create:      {engagement_partner: allow, manager: allow, senior: allow}
  request_item.update:      {engagement_partner: allow, manager: allow, senior: allow}
  request_item.assign:      {engagement_partner: allow, manager: allow, senior: allow, client_admin: allow}
  request_item.waive:       {engagement_partner: allow, manager: allow, requires: reason}
  request_item.mark_ready:  {engagement_partner: allow, manager: allow, senior: allow, staff: allow}

  # --- Evidence ---
  evidence.read:
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    client_admin: client_visible_only
    client_contributor: assigned_only
    agent: task_scope
    platform_support_content: allow   # SPEC-012
  evidence.upload:
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    client_admin: allow
    client_contributor: assigned_only
    system: allow             # retrieval via connections
  evidence.accept:
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  evidence.reject:
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  evidence.void:            {engagement_partner: allow, manager: allow, requires: reason}

  # --- Fulfilments ---
  fulfilment.propose:       {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: task_scope, system: allow}
  fulfilment.confirm:       {engagement_partner: allow, manager: allow, senior: allow, agent: deny}

  # --- Review queues (SPEC-004 Q7, Q8; TASK-019) ---
  review.read:
    practice_leader: in_scope
    quality_partner: in_scope
    engagement_partner: allow
    manager: allow
    senior: allow
    staff: allow
    reviewer: allow
    agent: deny               # ADR-005
    platform_support: allow   # SPEC-012
    platform_support_content: allow   # SPEC-012
  review.take:
    engagement_partner: allow
    manager: allow
    senior: firm_setting(seniors_can_accept)
    agent: deny               # ADR-005
  review.assign:            {engagement_partner: allow, manager: allow, agent: deny}

  # --- Screening and suggestions ---
  screening.run:            {system: allow, agent: task_scope}
  screening.request:        {engagement_partner: allow, manager: allow, senior: allow, staff: allow}   # SPEC-024 (TASK-042 D1): "Screen now" at Advise
  suggestion.create:        {agent: task_scope}
  suggestion.resolve:       {engagement_partner: allow, manager: allow, senior: allow, agent: deny}

  # --- Communications (SPEC-006 Q4; TASK-021) ---
  message.send:             {engagement_partner: allow, manager: allow, senior: allow, agent: deny, system: deny}

  # --- Connections ---
  connection.create:        {client_admin: allow, mfa_recent: required}   # only the client grants access; fresh MFA (SPEC-020 AC-3)
  connection.check:         {client_admin: allow, engagement_partner: allow, manager: allow}   # SPEC-020 AC-4 (TASK-036 D4)
  connection.revoke:        {client_admin: allow, engagement_partner: allow, manager: allow}
  connection.pull:          {system: allow}
  connection.read_log:      {client_admin: allow, engagement_partner: allow, manager: allow, platform_support: allow, platform_support_content: allow}

  # --- Follow-ups ---
  follow_up.draft:          {engagement_partner: allow, manager: allow, senior: allow, staff: allow, agent: task_scope}
  follow_up.send:
    engagement_partner: allow
    manager: allow
    senior: allow
    agent: firm_setting(autonomy_policy)   # routine reminders only, per autonomy policy

  # --- Sampling ---
  sample_set.create:        {engagement_partner: allow, manager: allow, senior: allow}
  support_match.run:        {system: allow, agent: task_scope}

  # --- Audit trail and export ---
  audit_event.read:         {engagement_partner: allow, manager: allow, quality_partner: in_scope, firm_admin: allow, platform_support: allow, platform_support_content: allow}
  export.create:            {engagement_partner: allow, manager: allow, mfa_recent: required}
