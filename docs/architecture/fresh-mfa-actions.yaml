# Fresh-MFA actions (Q-02-T30; Q-02 AC-42; conflict C-08). Policy file: change it deliberately,
# in the same change as the matrix row it names.
#
# Every action listed here must carry `mfa_recent: required` in the permission matrix
# (`docs/architecture/permission-matrix/*.yaml`): a second factor verified in the last 15 minutes.
# `tests/unit/quality/test_fresh_mfa_actions.py` and the lint `abacus_tools.quality.fresh_mfa`
# (`make check-fast`) fail when a listed action is missing from the matrix or lacks the
# condition; Q-02-T37's generated `tests/security/test_fresh_mfa_generated.py` also shows that
# `authorise` refuses each one without a fresh second factor and lists the routes declaring it.
#
# Groups follow AC-42: lifting a wall, publishing AI policy, exports, legal holds, the
# independence conclusion, the data-boundary opt-in, TIN reveal and incident decisions; P-07-T25
# adds a client's portal unlock (`portal_access`, DEC-303).
actions:
  # Ethical walls (ADR-026)
  - action: wall.create
    group: wall
  - action: wall.remove
    group: wall
  - action: wall.approve
    group: wall
  # AI policy
  - action: autonomy_policy.update
    group: ai_policy
  - action: firm_agents.pause
    group: ai_policy
  # Exports
  - action: export.create
    group: export
  - action: export.download  # A-01-T17: the engagement export's download (ADR-036)
    group: export
  - action: run_trace.export
    group: export
  - action: trial_balance.export  # A-02 Open in Excel (DEC-316, amended 2026-10-25)
    group: export
  - action: firm_export.request
    group: export
  - action: firm_export.approve
    group: export
  - action: firm_export.download
    group: export
  # Legal holds and retention (DEC-71 / P-14)
  - action: legal_hold.place
    group: legal_hold
  - action: legal_hold.lift
    group: legal_hold
  - action: retention_policy.update
    group: legal_hold
  # The independence conclusion
  - action: acceptance.record
    group: independence
  - action: acceptance.decide  # P-07-T29: the acceptance decision (CLI-07)
    group: independence
  - action: independence.conclude  # P-07-T29: the independence conclusion (CLI-08)
    group: independence
  - action: acceptance.complete_review  # P-07-T35 review (DEC-375): the risk-partner review
    group: independence
  # The engagement partner's team approval (P-07-T30 security review, DEC-327)
  - action: team.approve
    group: team
  # The data-boundary opt-in (SPEC-036)
  - action: firm.ai_client_data
    group: data_boundary
  # TIN and PII reveal
  - action: tin.reveal
    group: reveal
  - action: pii.reveal
    group: reveal
  # A client's portal access (P-07-T25 security review, DEC-303): clearing a sign-in lockout
  - action: contact.unlock
    group: portal_access
  # P-08-T21 (Story 7.2, SPEC-320 AC-19): resetting a client's lost second factor
  - action: contact.mfa_reset
    group: portal_access
  # Security-role changes (P-08-T21 security review): who holds security_admin (the QI)
  - action: security_role.assign
    group: access_control
  # G-02-T02 (SPEC-349 §9): firm governance v1
  - action: incident.decide
    group: incident
  - action: ai_policy.publish
    group: ai_policy
  - action: ai_policy.approve
    group: ai_policy
  - action: audit_event.export
    group: export
  - action: firm_export.schedule
    group: export
  - action: security.manage
    group: access_control
  - action: session.end
    group: access_control
  - action: staff.unlock
    group: access_control
  # Sign-offs and decisions (P-04-T22, T23; DEC-501, DEC-505): every verdict of the review
  # grammar, one at a time or in bulk
  - action: sign_off.bulk
    group: sign_off
  - action: sign_off.create
    group: sign_off
  - action: decision.decide
    group: sign_off
  # Record-mode release and archive (A-01-T23; DEC-83: release and archive carry fresh MFA)
  - action: assurance.record_release
    group: release
  - action: assurance.record_archive
    group: release
  # Signatures (N-02-T02; SPEC-381 AC-5, AC-9, AC-13)
  - action: signer.reveal_ip
    group: reveal
  - action: envelope_policy.manage
    group: access_control
  - action: letter.approve
    group: release
  # Firm standards (K-02-T01, DEC-1150; K-02 §4.4): creating a standard and publishing a version
  - action: firm_standard.create
    group: standards
  - action: firm_standard.publish
    group: standards
