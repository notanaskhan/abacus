# Fresh-MFA actions (Q-02-T30; Q-02 AC-42; conflict C-08). Policy file: change it deliberately,
# in the same change as the matrix row it names.
#
# Every action listed here must carry `mfa_recent: required` in the permission matrix
# (`docs/architecture/permission-matrix/*.yaml`): a second factor verified in the last 15 minutes.
# `tests/unit/quality/test_fresh_mfa_actions.py` fails when a listed action is missing from the
# matrix or lacks the condition; Q-02-T37 adds the generated overlay and the staff-route check.
#
# Groups follow AC-42: lifting a wall, publishing AI policy, exports, legal holds, the
# independence conclusion, the data-boundary opt-in, TIN reveal and incident decisions; P-07-T25
# adds a client's portal unlock (`portal_access`, DEC-303).
actions:
  # Ethical walls (ADR-026)
  - action: wall.create
    group: wall
  - action: wall.remove
    group: wall
  - action: wall.approve
    group: wall
  # AI policy
  - action: autonomy_policy.update
    group: ai_policy
  - action: firm_agents.pause
    group: ai_policy
  # Exports
  - action: export.create
    group: export
  - action: run_trace.export
    group: export
  - action: firm_export.request
    group: export
  - action: firm_export.approve
    group: export
  - action: firm_export.download
    group: export
  # Legal holds and retention (DEC-71 / P-14)
  - action: legal_hold.place
    group: legal_hold
  - action: legal_hold.lift
    group: legal_hold
  - action: retention_policy.update
    group: legal_hold
  # The independence conclusion
  - action: acceptance.record
    group: independence
  - action: acceptance.decide  # P-07-T29: the acceptance decision (CLI-07)
    group: independence
  - action: independence.conclude  # P-07-T29: the independence conclusion (CLI-08)
    group: independence
  # The engagement partner's team approval (P-07-T30 security review, DEC-327)
  - action: team.approve
    group: team
  # The data-boundary opt-in (SPEC-036)
  - action: firm.ai_client_data
    group: data_boundary
  # TIN and PII reveal
  - action: tin.reveal
    group: reveal
  - action: pii.reveal
    group: reveal
  # A client's portal access (P-07-T25 security review, DEC-303): clearing a sign-in lockout
  - action: contact.unlock
    group: portal_access
  # Incident decisions: G-02's `incident.decide` joins this list with its route.
