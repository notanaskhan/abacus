      not_signed: {label: "Not signed", variant: amber, terminal: false, derived: false}   # ENG-01 b filter "Letter │ Not signed"; ENG-02 c amber G3 banner
      signed:     {label: "Letter signed", variant: green-tint, terminal: true, derived: false, context_labels: {gate_row: "Letter signed by {signers} · {date}"}}   # same words as engagement.contracted; ENG-02 b G3 row

