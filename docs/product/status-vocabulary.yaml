      decided:          {label: "Decided", variant: green-tint, terminal: true, derived: false}   # CLI-07d pill "{option} · {person} · {date}", e.g. "Accepted with conditions · Daniel Reyes · Sep 14, 9:46 AM", with a lock
      declined:         {label: "Declined", variant: null, terminal: true, derived: false}   # CLI-07e; the engagement becomes Declined

