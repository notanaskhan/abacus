# Every status word in sources/handoff/lib/status.js, mapped to a registry code or marked
# `status: false` (no registry home yet), with the reason. Keyed by the handoff object name.
# Entries marked `# CONFLICT` change meaning in the move; entries with status: false need a
# decision from the product founder (see F-05-T12).
#
# COUNT: 144 words across 21 handoff objects (verified by script against status.js).
handoff_words:

  "Engagement":   # 6
    "Draft":       {status: false, reason: "no Draft engagement state in 3.3.1; nearest is engagement.prospect, which is a pre-contract state", replacement: engagement.prospect}
    "Letter sent": {object: envelope, code: sent}   # the engagement letter is an envelope; the engagement stays accepted until contracted
    "Active":      {object: engagement, code: active}
    "On hold":     {object: engagement, code: on_hold}
    "Complete":    {object: engagement, code: delivered}
    "Archived":    {object: engagement, code: archived}

  "Tax return":   # 12
    "Not started":      {object: return, code: not_started}
    "Waiting on client": {object: card_overlay, code: waiting_on_client}   # overlay, not a return state
    "Preparing":        {object: return, code: preparing}
    "Working":          {object: return, code: preparing}   # context label on entity returns
    "Processing":       {object: agent_run, code: running}   # transient run badge, not a return state
    "In review":        {object: return, code: in_review}
    "Ready to file":    {object: return, code: approved}   # CONFLICT: 3.3.1 has Approved then Awaiting signature, no Ready to file
    "Transmitted":      {object: return, code: filed}      # Filed = transmitted, acknowledgement pending
    "Accepted":         {object: return, code: accepted}
    "Rejected":         {object: return, code: rejected}
    "Filed":            {object: return, code: filed}      # CONFLICT: handoff Filed is green (done); 3.3.1 Filed is ack-pending; done is accepted
    "Extended":         {object: return_flag, code: extended}

  "Return sync chip":   # 7
    "Not yet exported":        {object: return_sync_chip, code: not_yet_exported}
    "Ready for export":        {object: return_sync_chip, code: ready_for_export}
    "Exporting":               {object: return_sync_chip, code: exporting}
    "Synced":                  {object: return_sync_chip, code: synced}
    "Out of sync":             {object: return_sync_chip, code: out_of_sync}
    "Import pending approval": {object: return_sync_chip, code: import_pending_approval}
    "Export failed":           {object: return_sync_chip, code: failed}

  "Document":   # 8
    "Requested":    {object: request, code: requested}   # a request state, not a document state
    "Received":     {object: request, code: uploaded}    # CONFLICT: handoff Received meant uploaded; Accrued received means accepted
    "Processing":   {object: document, code: processing}
    "Needs review": {object: document, code: classified}   # nearest; awaiting approval
    "Approved":     {object: document, code: approved}
    "Rejected":     {object: document, code: rejected}
    "Duplicate":    {status: false, reason: "no Duplicate state in 3.3.1; a duplicate is a flag on a document, not a lifecycle state"}
    "Superseded":   {object: document, code: superseded}

  "Audit":   # 9
    "Not started":   {status: false, reason: "no pre-Planning state on the audit engagement record in 3.3.1"}
    "Planning":      {object: audit_engagement, code: planning}
    "Processing":    {object: audit_engagement, code: processing}
    "Fieldwork":     {object: audit_engagement, code: fieldwork}
    "Completion":    {object: audit_engagement, code: completion}
    "In review":     {object: audit_engagement, code: in_review}
    "Ready to issue": {object: audit_engagement, code: ready_to_release}   # CONFLICT: 3.3.1 word is release, not issue
