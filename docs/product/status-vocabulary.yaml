# status-vocabulary.yaml - the single source of status words for Accrued.
#
# Authority: ADR-138, DEC-08 (docs/plan/09-decisions-adrs.md). Sources: blueprint
# 01-platform-blueprint.md section 3.3.1, addendum-waves-5-8 section 3.2, gap analysis
# section 6.5, the code bridge in 09-decisions-adrs.md section 9.5.6, DF-31, and the review
# grammar (ADR-160, ADR-161; P-04 section 4) with its SHL-09 to SHL-16 handoff words.
# Backend StrEnums, OpenAPI enums and UI labels (packages/ui/src/status.ts) are GENERATED
# from this file (F-03, F-05-T12). Do not hand-write a status word anywhere else.
#
# Rules
#   - Labels are sentence case ("In review"). Title-case demo words are normalized.
#   - The `match` pill variant is source tracing only and is never used for a status.
#   - Overdue (and past due) is DERIVED from a due date. It is never stored (derived: true).
#   - `label` is the firm-side display word. `context_labels` are the same code shown
#     differently in a named place. `client_label` is the portal wording when it differs.
#   - `variant` is a pill variant from blueprint 3.3.1: state, amber, green-tint, green,
#     red-tint, red, neutral, muted, soon, outline, tag. `variant: null` means the
#     blueprint gives only a disc/glyph (see `disc`) or gives no pill; none is invented.
#   - `terminal: true` means no further transition in the normal flow.
#   - Where the app's current label (packages/ui/src/status.tsx) differs from the
#     blueprint, the blueprint label is kept and an "app label" comment names the app
#     label so F-05-T12 can reconcile.
#   - Placeholders in labels ({date}, {n}, {role}) are filled at render time.
#
# Handoff word count (sources/handoff/lib/status.js): 21 objects, 144 words. All 144 appear
# under handoff_words below (see the count comment there).

version: 1

objects:

  # ---- Engagement (domain P1 lifecycle; 8 states) ----
  engagement:
    source: "blueprint 3.3.1; 9.5.6"
    codes:
      prospect:   {label: "Prospect",  variant: neutral,   terminal: false, derived: false}
      accepted:   {label: "Accepted",  variant: neutral,   terminal: false, derived: false}
      declined:   {label: "Declined",  variant: soon,      terminal: true,  derived: false}
      contracted: {label: "Letter signed", variant: green-tint, terminal: false, derived: false}   # canonical state is Contracted; display is "Letter signed"
      active:     {label: "Active",    variant: state,     terminal: false, derived: false}   # app label: "Active" (success tone)
      on_hold:    {label: "On hold",   variant: muted,     terminal: false, derived: false}
      delivered:  {label: "Delivered", variant: green,     terminal: false, derived: false}
      archived:   {label: "Archived",  variant: soon,      terminal: true,  derived: false, context_labels: {with_lock_icon: "Archived"}}   # app label: "Archived" (neutral tone)

  # ---- Return (tax) ----
  return:
    source: "blueprint 3.3.1"
    codes:
      not_started:     {label: "Not started", variant: neutral, terminal: false, derived: false}
      gathering:       {label: "Gathering",   variant: state,   terminal: false, derived: false}
      preparing:       {label: "Preparing",   variant: state,   terminal: false, derived: false, context_labels: {subbar_1040_1041: "Draft", subbar_entity_returns: "Working"}}   # Working = 1065/1120-S/1120/990 while the Agent tab builds the workbook
      prepared:        {label: "Prepared",    variant: neutral, terminal: false, derived: false, context_variants: {subbar: state}}
      in_review:       {label: "In review",   variant: state,   terminal: false, derived: false, context_labels: {subbar_rail_rows: "In review · {level}"}}   # level: Detail, Manager, Partner
      action_required: {label: "Action required", variant: red-tint, terminal: false, derived: false, context_labels: {home_and_tax_tiles: "Issues"}}
      approved:        {label: "Approved",    variant: green-tint, terminal: false, derived: false}
      awaiting_signature: {label: "Awaiting signature", variant: amber, terminal: false, derived: false}
      filed:           {label: "Filed",       variant: green-tint, terminal: false, derived: false}   # transmitted, acknowledgement pending
      accepted:        {label: "Accepted",    variant: green,  terminal: true,  derived: false}
      rejected:        {label: "Rejected",    variant: red-tint, terminal: false, derived: false}
      fixing:          {label: "Fixing",      variant: state,  terminal: false, derived: false}

  return_flag:   # side flags on a return, not part of the main flow
    source: "blueprint 3.3.1 (Return side flags)"
    codes:
      extended:   {label: "Extended", variant: tag,   terminal: false, derived: false, context_labels: {tag: "Extended · {date}"}}
      on_hold:    {label: "On hold",  variant: muted, terminal: false, derived: false}
      superseded: {label: "Superseded", variant: soon, terminal: true,  derived: false}   # shown struck through
      amended:    {label: "Amended",  variant: tag,   terminal: false, derived: false}

  return_sync_chip:   # every state is the same white chip with a leading glyph; no green-tint fill
    source: "blueprint 3.3.1; TAX-09"
    codes:
      not_yet_exported:      {label: "Not yet exported", variant: outline, disc: refresh_amber, terminal: false, derived: false}
      ready_for_export:      {label: "Ready for export", variant: outline, disc: refresh_amber, terminal: false, derived: false, context_labels: {tile: "Ready"}}
      exporting:             {label: "Exporting…", variant: outline, disc: spinner, terminal: false, derived: false}
      synced:                {label: "Synced {date}", variant: outline, disc: check_olive, terminal: false, derived: false}   # e.g. "Synced Sep 10"; the older two-word completion label is retired
      out_of_sync:           {label: "Out of sync", variant: outline, disc: triangle_amber, terminal: false, derived: false}
      import_pending_approval: {label: "Import pending approval", variant: outline, disc: dot_amber, terminal: false, derived: false}
      failed:                {label: "Export failed", variant: outline, disc: x_brick, terminal: false, derived: false}

  k1_package:
    source: "blueprint 3.3.1; TXP-12"
    codes:
      not_prepared: {label: "Not prepared", variant: neutral, terminal: false, derived: false, client_label: "Not released yet"}
      draft:        {label: "Draft K-1 · pre-release", variant: amber, terminal: false, derived: false, client_label: "Not released yet"}   # sub-line "final pending {entity} approval"; internal handoff only, never on the portal; portal adds "Expected by {date}"
      released:     {label: "Released {date}", variant: green-tint, terminal: false, derived: false}
      viewed:       {label: "Viewed",     variant: green-tint, terminal: false, derived: false}
      downloaded:   {label: "Downloaded", variant: green-tint, terminal: false, derived: false}
      bounced:      {label: "Bounced",    variant: red-tint,   terminal: false, derived: false}
      superseded:   {label: "Superseded (amended K-1)", variant: soon, terminal: true, derived: false}

  # ---- Audit ----
  audit_engagement:   # record card (AUD-01)
    source: "blueprint 3.3.1"
    codes:
      planning:        {label: "Planning",   variant: state, terminal: false, derived: false}
      fieldwork:       {label: "Fieldwork",  variant: state, terminal: false, derived: false}
      in_review:       {label: "In review",  variant: state, terminal: false, derived: false}
      completion:      {label: "Completion", variant: state, terminal: false, derived: false}
      ready_to_release: {label: "Ready to release", variant: green-tint, terminal: false, derived: false}
      released:        {label: "Released {date}", variant: green, terminal: false, derived: false}
      archiving:       {label: "Archive in {days} days", variant: muted, disc: clock, terminal: false, derived: false}
      archived:        {label: "Archived", variant: soon, disc: lock, terminal: true, derived: false}
      processing:      {label: "Processing", variant: state, terminal: false, derived: true}   # transient run badge, replaces the phase pill while a run executes; not stored

  audit_section:   # section / workpaper rail row
    source: "blueprint 3.3.1"
    codes:
      not_started:        {label: "Not started", variant: null, disc: ring, terminal: false, derived: false}
      queued:             {label: "Queued", variant: null, disc: ring, terminal: false, derived: false}   # sub-line ink-3, projection of the active run
      waiting_on_inputs:  {label: "Waiting on inputs", variant: null, disc: half, terminal: false, derived: false, context_labels: {pill_when_idle: "In progress", sub_line_when_run_active: "Waiting on inputs"}}
      ready_to_run:       {label: "Ready", variant: null, disc: ring, terminal: false, derived: false}   # "Compliance Testing Ready"
      in_progress:        {label: "In progress", variant: null, disc: half, terminal: false, derived: false}
      running:            {label: "Running", variant: null, disc: spinner, terminal: false, derived: false, context_labels: {pill: "In progress"}}
      blocked_on_decision: {label: "Blocked on a {role} decision", variant: null, disc: triangle_amber, terminal: false, derived: false, context_labels: {pill: "In progress"}}
      draft_ready:        {label: "Ready", variant: null, disc: check_olive, terminal: false, derived: false, context_labels: {sub_line: "Complete · {time}"}}
      prepared:           {label: "Prepared · {initials}", variant: null, disc: check_grey, terminal: false, derived: false}   # L1; app label (workpaper.ready): "Prepared"
      reviewed:           {label: "Reviewed · {initials}", variant: null, disc: check_olive, terminal: false, derived: false}   # L2/L3; app label (workpaper.reviewed): "Reviewed"
      signed_off:         {label: "Signed off", variant: null, disc: check_olive, terminal: false, derived: false}   # L4 partner approved
      locked:             {label: "Locked", variant: soon, disc: lock, terminal: true, derived: false}
      failed:             {label: "Failed — see run", variant: null, disc: x_brick, terminal: false, derived: false}
      changed_after_signoff: {label: "Changed after sign-off", variant: null, disc: triangle_amber, terminal: false, derived: false}   # sign-off chip struck

  engagement_export:   # binder export package (ADR-036; A-01-T01, DF-31 "export"); the O3 export sheet, AUD-02 / AUD-03
    source: "DF-31; A-01 §3.6, §4.2"
    codes:
      queued:    {label: "Queued", variant: neutral, terminal: false, derived: false}   # inside the 10-s Undo window (not_before)
      packaging: {label: "Packaging…", variant: state, disc: spinner, terminal: false, derived: false}
      ready:     {label: "Ready", variant: green-tint, terminal: false, derived: false, context_labels: {sheet: "Download · {n} files · {size} · expires {date}"}}
      failed:    {label: "Export failed", variant: red-tint, disc: x_brick, terminal: true, derived: false}
      expired:   {label: "Expired", variant: soon, terminal: true, derived: false}   # 7 days on kernel.clock, or voided on withdrawal
      undone:    {label: "Undone", variant: muted, terminal: true, derived: false}   # Undo inside the 10-s window

  program_board:   # audit programs on the Board
    source: "addendum 3.2; gap 6.5"
    codes:
      not_started: {label: "Not started", variant: null, disc: ring,  terminal: false, derived: false}
      in_progress: {label: "In progress", variant: null, disc: half,  terminal: false, derived: false}
      in_review:   {label: "In review",   variant: null, disc: dot_amber, terminal: false, derived: false}
      complete:    {label: "Complete",    variant: null, disc: check_olive, terminal: true, derived: false}

  control_board:   # attest / internal-audit controls on the Board
    source: "addendum 3.2; gap 6.5"
    codes:
      not_started:     {label: "Not started", variant: null, disc: ring, terminal: false, derived: false}
      testing:         {label: "Testing",     variant: null, disc: spinner, terminal: false, derived: false}
      pending:         {label: "Pending",     variant: muted, terminal: false, derived: false}
      preparer_review: {label: "Preparer review", variant: null, disc: half, terminal: false, derived: false}
      manager_review:  {label: "Manager review",  variant: null, disc: half, terminal: false, derived: false}
      review_complete: {label: "Review complete", variant: null, disc: check_olive, terminal: true, derived: false}

  card_overlay:   # overlay state on a Board card
    source: "addendum 3.2"
    codes:
      needs_input:       {label: "Needs input",       variant: amber, terminal: false, derived: false}
      waiting_on_client: {label: "Waiting on client", variant: muted, terminal: false, derived: false}
      agent_running:     {label: "Agent running",     variant: null, disc: spinner, terminal: false, derived: false}   # ink-2 spinner
      sent_back:         {label: "Sent back",         variant: null, disc: left_bar_brick, terminal: false, derived: false}   # brick 3px left bar; app label (decision.reject): "Sent back"

  control_test_result:
    source: "addendum 3.2; gap 6.5"
    codes:
      not_tested:         {label: "Not tested", variant: null, disc: ring, terminal: false, derived: false}   # app label (result.not_tested): "Not tested"
      no_exceptions_noted: {label: "No exceptions noted", variant: null, disc: check_olive, terminal: false, derived: false}   # app label (result.supported): "Supported"
      exceptions_noted:   {label: "Exceptions noted", variant: red-tint, terminal: false, derived: false}   # app label (result.exception): "Exception"
      not_applicable:     {label: "Not applicable", variant: muted, terminal: true, derived: false}

  attest_exception:
    source: "addendum 3.2"
    codes:
      noted:             {label: "Noted",             variant: red-tint, terminal: false, derived: false}
      response_received: {label: "Response received", variant: state,    terminal: false, derived: false}
      evaluated:         {label: "Evaluated",         variant: green-tint, terminal: true, derived: false}

  deficiency:   # AU-C 265 workflow
    source: "blueprint 3.3.1"
    codes:
      exception_for_resolution: {label: "Exception for resolution", variant: amber, terminal: false, derived: false}
      proposed:    {label: "Proposed",    variant: state,  terminal: false, derived: false}
      concluded:   {label: "Concluded",   variant: neutral, terminal: false, derived: false}
      communicated: {label: "Communicated", variant: green-tint, terminal: true, derived: false}

  deficiency_severity:
    source: "blueprint 3.3.1"
    codes:
      deficiency:             {label: "Deficiency", variant: red-tint, terminal: false, derived: false}
      significant_deficiency: {label: "Significant deficiency", variant: red, terminal: false, derived: false}
      material_weakness:      {label: "Material weakness", variant: red, emphasis: bold, terminal: false, derived: false}   # Accrued addition; label bold

  misstatement:   # AU-C 450
    source: "blueprint 3.3.1"
    codes:
      candidate:         {label: "Candidate", variant: state, terminal: false, derived: false}
      confirmed:         {label: "Confirmed", variant: neutral, terminal: false, derived: false}
      below_ct:          {label: "Below CT", variant: muted, terminal: false, derived: false}
      proposed_to_client: {label: "Proposed to client", variant: amber, terminal: false, derived: false}
      booked:            {label: "Booked", variant: green, terminal: true, derived: false}
      passed_on_sum:     {label: "Passed on SUM", variant: neutral, terminal: true, derived: false}

  misstatement_type:   # type tag beside a confirmed misstatement; a category, never a state
    source: "blueprint 3.3.1"
    codes:
      factual:    {label: "Factual",    variant: tag, terminal: false, derived: false}
      judgmental: {label: "Judgmental", variant: tag, terminal: false, derived: false}
      projected:  {label: "Projected",  variant: tag, terminal: false, derived: false}

  ia_issue_rating:
    source: "addendum 3.2"
    codes:
      high:   {label: "High",   variant: red,     terminal: false, derived: false}
      medium: {label: "Medium", variant: amber,   terminal: false, derived: false}
      low:    {label: "Low",    variant: neutral, terminal: false, derived: false}

  action_plan:
    source: "addendum 3.2; gap 6.5"
    codes:
      open:        {label: "Open",        variant: neutral,    terminal: false, derived: false}
      in_progress: {label: "In progress", variant: state,      terminal: false, derived: false}
      implemented: {label: "Implemented", variant: green-tint, terminal: false, derived: false}
      validated:   {label: "Validated",   variant: green,      terminal: true,  derived: false}
      overdue:     {label: "Overdue",     variant: red-tint,   terminal: false, derived: true}

  # ---- Close ----
  close:
    source: "blueprint 3.3.1"
    codes:
      not_started: {label: "Not started", variant: neutral, terminal: false, derived: false}
      in_progress: {label: "In progress", variant: state,   terminal: false, derived: false}
      in_review:   {label: "In review",   variant: state,   terminal: false, derived: false}
      approved:    {label: "Approved",    variant: green-tint, terminal: false, derived: false}
      delivered:   {label: "Delivered",   variant: green,   terminal: false, derived: false}
      locked:      {label: "Locked",      variant: soon,    terminal: true,  derived: false}
      past_due:    {label: "{n} days past due", variant: null, terminal: false, derived: true}   # derived chip; variant not specified in 3.3.1

  close_task:   # close task / agent task row
    source: "blueprint 3.3.1"
    codes:
      queued:          {label: "Queued",          variant: null, disc: ring, terminal: false, derived: false}
      running:         {label: "Running",         variant: null, disc: spinner, terminal: false, derived: false}
      needs_attention: {label: "Needs attention", variant: null, disc: triangle_amber, terminal: false, derived: false}
      done:            {label: "Done",            variant: null, disc: check_olive, terminal: true, derived: false}
      failed:          {label: "Failed",          variant: null, disc: x_brick, terminal: false, derived: false}

  proposed_entry:   # AJE
    source: "blueprint 3.3.1"
    codes:
      proposed:         {label: "Proposed", variant: state, terminal: false, derived: false}
      within_threshold: {label: "Within threshold", variant: null, disc: check_olive, terminal: false, derived: false, context_labels: {with_class: "Within threshold · ≤ {amount} {class}"}}
      review_required:  {label: "Review required", variant: null, disc: ring, text_tone: amber, terminal: false, derived: false}
      approved:         {label: "Approved", variant: green, terminal: false, derived: false, context_labels: {attribution: "Approved by {person} under {policy}"}}   # a named human; never the agent
      client_approved:  {label: "Client approved", variant: green, terminal: false, derived: false}   # attest only
      posted:           {label: "Posted", variant: green-tint, terminal: true, derived: false, context_labels: {with_ref: "Posted · {system} {ref}"}}
      failed_post:      {label: "Failed post", variant: red, terminal: false, derived: false}
      reversed:         {label: "Reversed", variant: soon, terminal: true, derived: false}

  tie_out_tally:
    source: "blueprint 3.3.1"
    codes:
      tie:            {label: "tie", variant: green, terminal: false, derived: false}   # lower-case literal in 3.3.1; handoff word is "Ties"
      "off":          {label: "off {amount}", variant: amber, terminal: false, derived: false}   # handoff word is "Off {amount}"
      check:          {label: "Check", variant: amber, terminal: false, derived: false}
      pending:        {label: "Pending", variant: muted, terminal: false, derived: false}
      ties_once_posted: {label: "Ties once posted", variant: null, disc: conic_dot_amber, text_tone: amber, terminal: false, derived: false}
      reconciled:     {label: "Reconciled", variant: green, terminal: true, derived: false}

  # ---- Trial balance of record (A-02 §3.4, AUD-06 g; SPEC-333 AC-17, AC-31; TASK-1185) ----
  trial_balance_label:   # trial_balances.label and ledger_snapshots.label; the AUD-06 label chip "TB: {label}"
    source: "A-02 §3.4 (AUD-06 g); SPEC-309"
    codes:
      standard:    {label: "Standard", variant: null, terminal: false, derived: false}
      interim:     {label: "Interim", variant: null, terminal: false, derived: false, context_labels: {chip: "TB: Interim · {date}"}}   # AUD-06 g "TB: Interim · 8/31/2026"
      prior:       {label: "Prior", variant: null, terminal: false, derived: false}   # the prior-year pull (A-02-T30)
      budget:      {label: "Budget", variant: null, terminal: false, derived: false}
      preliminary: {label: "Preliminary", variant: null, terminal: false, derived: false}

  trial_balance_layer:   # the AUD-06 layer control; AJE, RJE and Final need a registered adjustment source (C8)
    source: "A-02 §3.4 (AUD-06 a, d); SPEC-311"
    codes:
      unadjusted: {label: "Unadjusted", variant: null, terminal: false, derived: false}
      aje:        {label: "AJE", variant: null, terminal: false, derived: false}
      rje:        {label: "RJE", variant: null, terminal: false, derived: false}
      final:      {label: "Final", variant: null, terminal: false, derived: false}

  # ---- Requests and documents ----
  request:   # PBC / binder request; UI label "Request" (record: request_item)
    source: "blueprint 3.3.1; addendum 3.2; 9.5.6; DEC-09"
    codes:
      draft:         {label: "Draft", variant: neutral, terminal: false, derived: false}   # firm only, never client-visible; neutral outline
      requested:     {label: "Requested {date}", variant: null, disc: ring, terminal: false, derived: false, client_label: "To do"}   # app label (open): "Requested"; client row action "Upload…"; app clientRequest.open: "To do"
      uploaded:      {label: "Uploaded – needs review", variant: null, disc: dot_amber, terminal: false, derived: false, client_label: "Done"}   # app label (received/ready_for_review): "Uploaded" (TASK-105); client sees "✓ You uploaded {date}"; screening sub-state in evidence_screening
      received:      {label: "Received ✓", variant: green, terminal: true, derived: false, client_label: "Done"}   # app label (accepted): "Received"; the repo's old `received` meant uploaded
      returned:      {label: "Returned · {reason}", variant: red-tint, terminal: false, derived: false, client_label: "Returned"}   # app label (needs_revision): "Returned"
      not_applicable: {label: "Not applicable", variant: muted, terminal: true, derived: false, client_label: "Ignored"}   # app clientRequest.not_applicable: "Doesn't apply"
      overdue:       {label: "Overdue", variant: red-tint, terminal: false, derived: true}   # never stored

  request_close:   # close-intake variant
    source: "blueprint 3.3.1"
    codes:
      requested:   {label: "Requested", variant: null, disc: ring, terminal: false, derived: false}
      received:    {label: "Received",  variant: null, disc: dot_amber, terminal: false, derived: false}
      matched:     {label: "Matched",   variant: green-tint, terminal: false, derived: false}
      pending_incorporation: {label: "Pending incorporation", variant: amber, terminal: false, derived: false}
      incorporated: {label: "Incorporated", variant: green, terminal: true, derived: false}

  document:
    source: "blueprint 3.3.1"
    codes:
      uploading:  {label: "Uploading",  variant: null, disc: ring_upload, terminal: false, derived: false}
      processing: {label: "Processing", variant: null, disc: spinner, terminal: false, derived: false}
      classified: {label: "Classified", variant: neutral, terminal: false, derived: false}
      matched:    {label: "Matched",    variant: green-tint, terminal: false, derived: false}
      approved:   {label: "Approved",   variant: null, disc: check_ink_micro, terminal: false, derived: false, context_labels: {row_micro_pill: "✓ {n}"}}   # ink micro-pill, never green
      rejected:   {label: "Rejected",   variant: null, disc: x_grey, terminal: false, derived: false}
      superseded: {label: "Superseded", variant: soon, terminal: true, derived: false}

  evidence_screening:
    source: "addendum 3.2; 9.5.6"
    codes:
      passed:       {label: "Passed",       variant: null, disc: check_olive, terminal: false, derived: false}
      flagged:      {label: "Flagged",      variant: null, disc: triangle_amber, terminal: false, derived: false}
      not_screened: {label: "Not screened", variant: null, disc: ring, terminal: false, derived: false}

  inbox_item:
    source: "blueprint 3.3.1"
    codes:
      new:     {label: "New",     variant: null, disc: ring_16, terminal: false, derived: false}
      waiting: {label: "Waiting", variant: null, disc: dot_gold_16, terminal: false, derived: false}
      filed:   {label: "Filed",   variant: null, disc: check_olive_15, terminal: true, derived: false}
      ignored: {label: "Ignored", variant: null, disc: x_ink4_15, terminal: true, derived: false}
      held:      {label: "Waiting", variant: null, disc: dot_gold_16, terminal: false, derived: false, context_labels: {sub_line: "Asked the client · {date}"}}   # N-01 DV-15: blueprint 3.3.1 allows four dot states, so `held` shows the waiting dot with a sub-line
      withdrawn: {label: "Withdrawn", variant: muted, terminal: true, derived: false}   # ADR-162: the client withdrew it before it was filed

  inbox_thread:   # N-01-T04 (C2); the INB-01 rail row's match state
    source: "N-01 section 3.3; ADR-210 clause 3"
    codes:
      unmatched: {label: "Unmatched", variant: amber, terminal: false, derived: false}   # INB-01 b "Match client…" chip; intake scope only
      matched:   {label: "Matched", variant: null, terminal: false, derived: false}
      ignored:   {label: "Ignored", variant: muted, terminal: true, derived: false}

  portal_intake_upload:   # N-01-T04; the client words on POR-03's own uploads (portal never renders "Accrued")
    source: "N-01 section 3.1; DEC-58 b"
    codes:
      sent:      {label: "Sent", variant: null, terminal: false, derived: false, context_labels: {to_firm: "Sent to {firm}"}}   # new or waiting
      received:  {label: "Received by {firm}", variant: green-tint, terminal: true, derived: false}   # filed, ignored or held: the firm has it
      withdrawn: {label: "Withdrawn", variant: muted, terminal: true, derived: false}

  file_document:   # N-01-T04; the FIL-01 list and drawer status of one document (a projection over evidence versions and acceptances)
    source: "N-01 section 3.7; FIL-01 a-d; DV-17"
    codes:
      processing:   {label: "Processing", variant: null, terminal: false, derived: false}   # FIL-01 b: extraction or classification running
      needs_review: {label: "Uploaded – needs review", variant: amber, terminal: false, derived: false}   # DV-4: filed by someone without evidence.accept
      accepted:     {label: "Approved", variant: null, disc: check_olive, terminal: false, derived: false}   # DV-17: label plus olive disc
      superseded:   {label: "Superseded", variant: muted, terminal: true, derived: false, context_labels: {replaced_by: "Superseded · replaced by {name} · {date}"}}   # FIL-01 c: struck through
      on_hold:      {label: "On hold", variant: amber, terminal: false, derived: false}   # FIL-01 d legal hold banner; destruction suspended

  issue:
    source: "blueprint 3.3.1"   # kind lines (Missing information, Action required, Review point, Waiting on client) are labels on an issue, not states
    codes:
      open:           {label: "Open", variant: null, disc: flag, terminal: false, derived: false}   # sub-state "Instructions required"; flag brick when high, amber otherwise
      in_progress:    {label: "In progress", variant: null, disc: atom_spinner, terminal: false, derived: false}   # agent fixing
      resolved:       {label: "Resolved", variant: null, disc: check_olive, terminal: false, derived: false}
      verified:       {label: "Verified", variant: null, disc: check_olive, terminal: true, derived: false}
      reopened:       {label: "Reopened", variant: null, disc: flag, terminal: false, derived: false}
      not_applicable: {label: "Not applicable", variant: muted, terminal: true, derived: false}

  issue_severity:
    source: "blueprint 3.3.1"
    codes:
      high:   {label: "High",   variant: null, disc: flag_brick, terminal: false, derived: false}
      medium: {label: "Medium", variant: null, disc: flag_amber, terminal: false, derived: false}
      low:    {label: "Low",    variant: null, disc: flag_amber, terminal: false, derived: false}

  issue_audit_route:
    source: "blueprint 3.3.1"
    codes:
      under_evaluation:         {label: "Under evaluation", variant: state, terminal: false, derived: false}
      converted_to_misstatement: {label: "Converted to misstatement", variant: neutral, terminal: true, derived: false}
      converted_to_deficiency:  {label: "Converted to deficiency", variant: neutral, terminal: true, derived: false}

  review_note:
    source: "blueprint 3.3.1"
    codes:
      open:      {label: "Open",      variant: amber, terminal: false, derived: false}
      responded: {label: "Responded", variant: state, terminal: false, derived: false}
      cleared:   {label: "Cleared",   variant: green, terminal: false, derived: false}
      closed:    {label: "Closed",    variant: green-tint, terminal: true, derived: false}
      withdrawn: {label: "Withdrawn", variant: soon, terminal: true, derived: false}

  # ---- Review grammar (ADR-160, ADR-161; P-04-T02) ----
  sign_off_slot:   # one level on a ladder (SHL-12) or one field tick (SHL-09); computed from sign_offs and the target's content_hash; sign_offs has no status column
    source: "DF-31 (sign-off slot: signed, stale); SHL-09; SHL-12"
    codes:
      signed: {label: "✓ {initials}", variant: green-tint, terminal: false, derived: true, context_labels: {with_date: "✓ {initials} · {date}"}}   # an L1 on agent work also shows the R-SO-8 adoption line (ADR-160 clause 4), which is copy, not a status word
      stale:  {label: "Changed after sign-off", variant: amber, terminal: false, derived: true, context_labels: {struck_chip: "✓ {initials} · {date} (before this change)"}}   # the chip is struck; only Re-sign is offered (SHL-12 e)

  human_gate:   # C13 (I-01-T02); the projection's `state`; "Snoozed until" is per viewer and computed (I-01-T04 snoozes)
    source: "I-01 section 4.6 (gate state words); P-04 section 4 (human_gates.state)"
    codes:
      open:    {label: "Open", variant: null, terminal: false, derived: false}
      done:    {label: "Done", variant: green-tint, terminal: true, derived: false}
      voided:  {label: "Voided", variant: muted, terminal: true, derived: false}
      snoozed: {label: "Snoozed until {date}", variant: neutral, terminal: false, derived: true}   # the viewer's latest snooze row; never stored on the gate

  due_risk:   # C13 (I-01-T02): a deadline's or gate's due chip, computed by code on kernel.clock, never stored
    source: "HOME-01 and HOME-02 handoff spec (due chips: red-tint 'Sep 15 · 1 day', amber-tint 'Sep 23 · 9 days'; red ink within 7 days)"
    codes:
      overdue:     {label: "Overdue", variant: red-tint, terminal: false, derived: true}
      due_soon:    {label: "{date} · {n} days", variant: red-tint, terminal: false, derived: true}   # 0 to 7 days; one day reads "{date} · 1 day"
      approaching: {label: "{date} · {n} days", variant: state, terminal: false, derived: true}   # 8 to 14 days
      later:       {label: "{date}", variant: neutral, terminal: false, derived: true}   # beyond 14 days

  decision_card:   # SHL-11; the human act is an insert-only `decisions` row; options are computed by code
    source: "P-04 section 4 (decision_cards.status); ADR-160 clause 8; SHL-11"
    codes:
      awaiting_role: {label: "Waiting on {person}", variant: null, terminal: false, derived: false, context_labels: {banner: "Waiting on {person} · requested {time}", history: "Proposed"}, context_variants: {history: state}}   # amber banner, no pill (SHL-11 b); history v1 "Proposed" is struck
      decided:       {label: "Decided", variant: green, terminal: false, derived: false, context_labels: {history_reassessed: "No change"}, context_variants: {history: green-tint, history_reassessed: neutral}}   # a reassessment with no change is a new version of the same card (SHL-11 d)
      superseded:    {label: "Superseded by v{n}", variant: soon, terminal: true, derived: false}   # values struck (SHL-11 h)

  field_value:   # SHL-09 value pill on a cell or field; computed from field_value_versions (value_source, value_kind, citation_ids), never stored
    source: "SHL-09; SHL-10 c; ADR-160 clauses 5 and 10"
    codes:
      updated:     {label: "Updated", variant: amber, terminal: false, derived: true}   # the latest value differs from the previous one; the prior value is struck beside it
      edited:      {label: "Edited", variant: amber, terminal: false, derived: true}   # value_source human; a citation note is required
      estimate:    {label: "≈", variant: null, disc: estimate_badge, terminal: false, derived: true}   # value_kind estimate; 16px amber circle
      unsupported: {label: "Unsupported", variant: red-tint, terminal: false, derived: true}   # no verified citation; cannot be ticked or approved (422 uncited_change)

  comment_thread:
    source: "addendum 3.2; gap 6.5"
    codes:
      open:     {label: "Open",     variant: null,  terminal: false, derived: false}
      resolved: {label: "Resolved", variant: muted, terminal: true,  derived: false}

  todo:   # UI "To-do" (hyphenated); the word "task" is banned for assignable work
    source: "addendum 3.2; gap 6.5"
    codes:
      open:    {label: "Open", variant: null, disc: ring, terminal: false, derived: false}
      done:    {label: "Done", variant: null, disc: check_olive, terminal: true, derived: false}
      overdue: {label: "Overdue", variant: red-tint, terminal: false, derived: true}

  # ---- Knowledge and methodology (K-01-T01; KNW-01 to KNW-03 handoff words) ----
  methodology_version:   # methodology_version_states.status (migration 0180); KNW-02 shows Published as "Approved · {date} · {person}"
    source: "K-01 section 4.2; KNW-01, KNW-02 and KNW-03 handoff pills"
    codes:
      draft:        {label: "Draft", variant: neutral, terminal: false, derived: false}
      parsing:      {label: "Parsing…", variant: state, terminal: false, derived: false}
      needs_review: {label: "Needs review", variant: state, terminal: false, derived: false}
      published:    {label: "Published", variant: green-tint, terminal: false, derived: false, context_labels: {knw02: "Approved"}}
      superseded:   {label: "Superseded", variant: soon, terminal: true, derived: false}
      discarded:    {label: "Discarded", variant: muted, terminal: true, derived: false}   # no handoff pill; a discarded draft leaves the lists

  methodology_import:   # methodology_imports.status (K-01-T18)
    source: "K-01 section 4.2 (migration C); KNW-02 a and b"
    codes:
      awaiting_files: {label: "Awaiting files", variant: neutral, terminal: false, derived: false}
      scanning:       {label: "Scanning", variant: state, terminal: false, derived: false}
      parsing:        {label: "Parsing…", variant: state, terminal: false, derived: false}
      needs_review:   {label: "Needs review", variant: state, terminal: true, derived: false}
      failed:         {label: "Failed", variant: red-tint, terminal: true, derived: false}
      cancelled:      {label: "Cancelled", variant: muted, terminal: true, derived: false}

  knowledge_item:   # a KNW-01 catalog card's state, from its provider
    source: "KNW-01 handoff (Published green-tint · Draft neutral · Superseded soon)"
    codes:
      draft:      {label: "Draft", variant: neutral, terminal: false, derived: false}
      published:  {label: "Published", variant: green-tint, terminal: false, derived: false}
      superseded: {label: "Superseded", variant: soon, terminal: true, derived: false}

  firm_standard_version:   # firm_standard_versions.status and threshold_policy_versions.status (K-02-T04); KNW-04 header pill and Timeline
    source: "K-02 section 4.2 (migration M-B); KNW-04 a-i handoff pills"
    codes:
      draft:      {label: "Draft", variant: neutral, terminal: false, derived: false}
      published:  {label: "Published", variant: green-tint, terminal: false, derived: false}
      superseded: {label: "Superseded", variant: soon, terminal: true, derived: true}   # computed: a later published version is effective on or before as_of
      discarded:  {label: "Discarded", variant: muted, terminal: true, derived: false}   # hidden: a discarded draft leaves the lists

  reference_set_version:   # reference_set_versions.status (K-02-T03); KNW-04 j
    source: "K-02 section 4.2 (migration M-A); ADR-300"
    codes:
      draft:      {label: "Draft", variant: neutral, terminal: false, derived: false}
      published:  {label: "Published", variant: green-tint, terminal: false, derived: false}
      superseded: {label: "Superseded", variant: soon, terminal: true, derived: true}   # computed, never stored
      withdrawn:  {label: "Withdrawn", variant: muted, terminal: true, derived: false}

  parse_flag:   # program_steps.parse_flag (K-01-T05); the ⚑ amber flag on KNW-02 rows
    source: "K-01 section 4.2 (migration B); KNW-02 c"
    codes:
      low_confidence:          {label: "Low confidence", variant: amber, terminal: false, derived: false}
      split_across_pages:      {label: "Split across pages", variant: amber, terminal: false, derived: false}
      numbering_gap:           {label: "Numbering gap", variant: amber, terminal: false, derived: false}
      unverified_citation:     {label: "Unverified citation", variant: amber, terminal: false, derived: false}
      cross_reference_missing: {label: "Cross-reference missing", variant: amber, terminal: false, derived: false}

  # ---- Signing, notices, consent ----
  envelope:
    source: "blueprint 3.3.1"
    codes:
      draft:  {label: "Draft",  variant: neutral, terminal: false, derived: false}
      sent:   {label: "Sent",   variant: amber,   terminal: false, derived: false}
      viewed: {label: "Viewed", variant: amber,   terminal: false, derived: false}
      partially_signed: {label: "{signed} of {total} signed", variant: amber, terminal: false, derived: false}
      completed: {label: "Completed", variant: green, terminal: true, derived: false}
      declined:  {label: "Declined",  variant: red-tint, terminal: true, derived: false}
      expired:   {label: "Expired",   variant: muted, terminal: true, derived: false}
      voided:    {label: "Voided",    variant: soon,  terminal: true, derived: false}

  envelope_signer:   # C7 v1 (N-02-T03); one signer's state on an envelope (SIG-01 drawer, POR-06 "my state"). F-06-T03 (DF-31) adds `verified` and the T16 chip and signer-band labels; N-02's stored codes win (S14 batch)
    source: "N-02 section 4.2 (envelope_signers.status); DF-11; DF-31; TPL-16 b, d, e; blueprint 9.7 signer chips"
    codes:
      pending:             {label: "Waiting", variant: neutral, terminal: false, derived: false, context_labels: {chip: "○ {name}"}}
      viewed:              {label: "Viewed", variant: amber, terminal: false, derived: false}
      verified:            {label: "Identity verified", variant: neutral, terminal: false, derived: false, context_labels: {signer_band: "Identity verified {time} · {n} fields left"}}   # F-06-T03: the ceremony's KBA passed; not stored by C7 v1 yet
      signed:              {label: "Signed", variant: green-tint, terminal: true, derived: false, context_labels: {with_date: "Signed · {date}", chip: "✓ {name} · {date}", signer_band: "✓ Signed {date}, {time} · identity verified"}}
      declined:            {label: "Declined", variant: red-tint, terminal: true, derived: false}
      verification_failed: {label: "Needs a handwritten signature", variant: amber, terminal: false, derived: false}   # DF-11: three failed KBA attempts; SIG-01 offers "Upload signed 8879…"

  signing_step:   # F-06-T03 (DF-31): the T16 steps pane and the 390 step chips; computed from the signer's state, never stored
    source: "DF-31; T16, TPL-16 b and g"
    codes:
      verify: {label: "Verify identity", variant: null, terminal: false, derived: true, context_labels: {chip: "Verify"}}
      review: {label: "Review", variant: null, terminal: false, derived: true}
      sign:   {label: "Sign", variant: null, terminal: false, derived: true}
      done:   {label: "Done", variant: null, terminal: true, derived: true}

  envelope_purpose:   # F-06-T03 (DF-31, DF-11): what an envelope is for; sets the identity method (8879 family KBA, the rest email code)
    source: "DF-31; DF-11; blueprint 9.5 and 9.7 (signatures out: 8879 family, engagement letters, rep letters, 7216 consents)"
    codes:
      e_file_authorization:  {label: "E-file authorization", variant: tag, terminal: false, derived: false}   # Form 8879 family
      engagement_letter:     {label: "Engagement letter", variant: tag, terminal: false, derived: false}
      representation_letter: {label: "Rep letter", variant: tag, terminal: false, derived: false}
      consent_7216:          {label: "§7216 consent", variant: tag, terminal: false, derived: false}

  generated_document:   # F-06-T03 (DF-31): the T10 document status, computed by P-11 (C11); "Adopted by" is a sub-line, never a status (F-06 Q6); the render status stays a separate field
    source: "DF-31; T10 a-d; TPL-10 a-c"
    codes:
      drafting: {label: "Drafting", variant: null, terminal: false, derived: false}   # header spinner; paper variant only while ADR P-25 is off
      draft:    {label: "Draft", variant: neutral, terminal: false, derived: false}
      approved: {label: "Approved", variant: green-tint, terminal: false, derived: false, context_labels: {meta_line: "Approved by {actor} · {when}"}}
      locked:   {label: "Locked", variant: soon, terminal: true, derived: false}   # with Lock 12 and the locked reason

  notice:
    source: "blueprint 3.3.1"
    codes:
      received:       {label: "New", variant: red-tint, terminal: false, derived: false}   # canonical state Received, display "New"
      classified:     {label: "Classified", variant: neutral, terminal: false, derived: false}
      analyzing:      {label: "Analyzing", variant: state, terminal: false, derived: false}
      response_drafted: {label: "Response drafted", variant: state, terminal: false, derived: false}
      approved:       {label: "Approved", variant: green-tint, terminal: false, derived: false}
      sent:           {label: "Response sent", variant: amber, terminal: false, derived: false}
      awaiting_irs:   {label: "Awaiting IRS", variant: muted, terminal: false, derived: false}
      closed:         {label: "Resolved", variant: green, terminal: true, derived: false}   # canonical state Closed, display "Resolved"
      escalated:      {label: "Escalated", variant: red-tint, terminal: false, derived: false}

  consent:   # section 7216
    source: "blueprint 3.3.1"
    codes:
      requested: {label: "Requested", variant: amber, terminal: false, derived: false}
      signed:    {label: "Signed · expires {date}", variant: green, terminal: false, derived: false}
      expiring:  {label: "Expiring",  variant: amber, terminal: false, derived: false}
      expired:   {label: "Expired",   variant: red-tint, terminal: true, derived: false}
      declined:  {label: "Declined",  variant: neutral, terminal: true, derived: false}
      revoked:   {label: "Revoked",   variant: soon, terminal: true, derived: false}

  consent_purpose:   # each purpose is its own signed document; a category, never a state
    source: "blueprint 3.3.1"
    codes:
      use:                   {label: "Consent to use", variant: tag, terminal: false, derived: false}
      ai_disclosure:         {label: "Consent to disclose — AI sub-processors", variant: tag, terminal: false, derived: false}
      offshore_disclosure:   {label: "Consent to disclose — offshore preparers", variant: tag, terminal: false, derived: false}
      third_party_disclosure: {label: "Consent to disclose — named third party", variant: tag, terminal: false, derived: false}

  # ---- Platform ----
  agent_run:
    source: "blueprint 3.3.1; 9.5.6; DEC-09"
    codes:
      queued:                 {label: "Queued", variant: muted, terminal: false, derived: false}
      planning:               {label: "Planning…", variant: null, disc: spinner, terminal: false, derived: false}   # spinner ink-2, never amber
      awaiting_plan_approval: {label: "Plan ready — approve?", variant: amber, terminal: false, derived: false}
      dispatched:             {label: "Dispatched", variant: neutral, terminal: false, derived: false}
      running:                {label: "Running", variant: null, disc: spinner, terminal: false, derived: false}
      needs_input:            {label: "Needs your answer", variant: amber, terminal: false, derived: false}   # escalations arrive here with reason `escalated`
      blocked_on_decision:    {label: "Blocked on a {role} decision", variant: null, disc: triangle_amber, terminal: false, derived: false}
      waiting_on_inputs:      {label: "Waiting on inputs", variant: muted, terminal: false, derived: false}
      succeeded:              {label: "Ready for review", variant: state, terminal: true, derived: false}
      approved:               {label: "Approved", variant: green, terminal: true, derived: true}   # outcome, derived from reviewer decisions
      partially_approved:     {label: "{n} of {total} approved", variant: green-tint, terminal: true, derived: true}
      rejected:               {label: "Rejected", variant: red-tint, terminal: true, derived: true}
      failed:                 {label: "Failed", variant: red, terminal: true, derived: false, context_labels: {run_row: "Failed — see run"}}
      cancelled:              {label: "Cancelled", variant: muted, terminal: true, derived: false}

  suggestion:   # agents.suggestions: one proposed value for one target (ADR-161 clause 1); the atom glyph on a cell; the human act is a suggestion_decisions row
    source: "P-04 section 4 (suggestions.status); addendum 3.3 (Suggestion); AUD-31; AUD-37"
    codes:
      pending:    {label: "Suggestion", variant: null, disc: atom, terminal: false, derived: false}   # ghost dashed value with Accept; addendum 3.3 tooltip word
      adopted:    {label: "Adopted by {initials}", variant: null, disc: atom_olive, terminal: true, derived: false}   # AUD-31; never adopted without a person
      edited:     {label: "Edited by {initials}", variant: null, disc: atom_olive, terminal: true, derived: false, context_labels: {with_prior: "Edited by {initials} · was {value}"}}   # C-31 on AUD-31
      dismissed:  {label: "Dismissed", variant: null, terminal: true, derived: false}   # AUD-37 group; no pill
      superseded: {label: "Superseded", variant: soon, terminal: true, derived: false}   # no source wording; the document and return pattern
      expired:    {label: "Expired", variant: muted, terminal: true, derived: false}   # no source wording; the envelope pattern

  proposal:   # agents.proposals, the SHL-10 change set (ADR-161 clause 2); the human act is a proposal_decisions row; approving a linked checkpoint is the same decision
    source: "P-04 section 4 (proposals.state); SHL-10; SHL-16"
    codes:
      pending:             {label: "Ready for review", variant: state, terminal: false, derived: false}   # SHL-10 head pill
      approved:            {label: "Approved", variant: green, terminal: true, derived: false, context_labels: {attribution: "Approved by {person}", under_policy: "✓ Approved by {person} under {policy} · {time}"}}   # a named human; never the agent (L5/L6); SHL-10 e′
      approved_with_edits: {label: "Approved with edits", variant: green, terminal: true, derived: false}   # from the SHL-10 CTA "Approve with edits"; label not verbatim
      rejected:            {label: "Rejected", variant: red-tint, terminal: true, derived: false, context_labels: {attribution: "Rejected by {person} · reason: {reason}"}}   # SHL-10 f; SHL-16 e
      superseded:          {label: "Superseded", variant: soon, terminal: true, derived: false}   # no source wording; the document and return pattern

  workbench_session:
    source: "blueprint 3.3.1"
    codes:
      live:             {label: "Live", variant: null, disc: dot_olive, terminal: false, derived: false}
      running:          {label: "Running", variant: null, disc: spinner, terminal: false, derived: false}
      awaiting_answer:  {label: "Needs your answer", variant: null, disc: dot_amber, terminal: false, derived: false}
      ready_for_review: {label: "Ready for review", variant: state, terminal: false, derived: false}
      complete:         {label: "Complete", variant: null, disc: check_olive, terminal: true, derived: false}
      failed:           {label: "Failed", variant: null, disc: x_brick, terminal: false, derived: false}

  integration:   # catalogue and connection (repo object: connection)
    source: "blueprint 3.3.1; 9.5.6"
    codes:
      available:    {label: "Available",  variant: outline, terminal: false, derived: false, client_label: "Not connected"}   # POR-16 a: a catalogue card with no connection (A-02-T06, C20 v1)
      connecting:   {label: "Connecting", variant: null, disc: spinner, terminal: false, derived: false}
      connected:    {label: "Connected",  variant: null, disc: check_olive, terminal: false, derived: false}
      needs_attention: {label: "Needs attention", variant: amber, terminal: false, derived: false}   # blueprint canonical state Degraded; split from needs_reauth on failure code
      needs_reauth: {label: "Needs reauth", variant: amber, terminal: false, derived: false}   # failure codes token_expired / invalid_grant
      disconnected: {label: "Disconnected", variant: neutral, terminal: false, derived: false}   # neutral, not red
      coming_soon:  {label: "Coming soon", variant: soon, terminal: false, derived: false}
      paused:       {label: "Paused", variant: muted, terminal: false, derived: false}   # DF-31; variant not specified in the sources, muted proposed

  agent_template:
    source: "blueprint 3.3.1"
    codes:
      available:        {label: "Available", variant: outline, terminal: false, derived: false}
      installed:        {label: "Installed", variant: null, disc: check_olive, terminal: false, derived: false}
      update_available: {label: "Update available", variant: amber, terminal: false, derived: false}
      coming_soon:      {label: "Coming soon", variant: soon, terminal: false, derived: false}

  template_version:
    source: "addendum 3.2; gap 6.5"
    codes:
      draft:      {label: "Draft",      variant: neutral, terminal: false, derived: false}
      published:  {label: "Published",  variant: green-tint, terminal: false, derived: false}
      deprecated: {label: "Deprecated", variant: muted, terminal: true, derived: false}

  engagement_template_link:
    source: "addendum 3.2"
    codes:
      current:          {label: "Current", variant: green-tint, terminal: false, derived: false}
      update_available: {label: "Update available", variant: state, terminal: false, derived: false}
      updated:          {label: "Updated {date}", variant: neutral, terminal: false, derived: false}
      held:             {label: "Held", variant: muted, terminal: false, derived: false}

  trigger:
    source: "addendum 3.2"
    codes:
      "on":      {label: "On", variant: green-tint, terminal: false, derived: false}   # quoted: YAML 1.1 reads bare on/off as booleans
      "off":     {label: "Off", variant: muted, terminal: false, derived: false}
