  binder:
    source: "blueprint 3.3.1"
    codes:
      draft:       {label: "Draft", variant: neutral, terminal: false, derived: false}
      published:   {label: "Published", variant: state, terminal: false, derived: false}
      unpublished: {label: "Unpublished", variant: muted, terminal: false, derived: false}
