      closed:      {label: "Closed", variant: soon, terminal: true, derived: false}

  archive:   # locked binder
    source: "blueprint 3.3.1"
    codes:
      assembling:         {label: "Archive in {days} days", variant: muted, disc: clock, terminal: false, derived: false}
      locked:             {label: "Locked · WORM", variant: soon, disc: lock, terminal: false, derived: false}
      post_lock_addition: {label: "Addition logged", variant: amber, terminal: false, derived: false}

  checkpoint:
    source: "blueprint 3.3.1"
    codes:
      proposed: {label: "Proposed", variant: state, terminal: false, derived: false}   # an agent run or an engine import awaiting approval (SHL-16 a; sync chip "Import pending approval")
      approved: {label: "Approved", variant: green, terminal: false, derived: false, context_labels: {attribution: "Approved · {person} · {time}"}}   # SHL-16 renders green-tint; the 3.3.1 variant is kept (F-05-T12 to reconcile)
      rejected: {label: "Rejected", variant: red-tint, terminal: true, derived: false, context_labels: {attribution: "{person} · reason: {reason}"}}
      saved:    {label: "Saved", variant: null, terminal: false, derived: false}   # P-04 section 4; a person's "Save checkpoint…" or a restore copy; no pill in SHL-16; label not in 3.3.1
      current:  {label: "Current",  variant: tag, terminal: false, derived: true}   # derived tag, never stored (ADR-160 clause 9); a star marks a named checkpoint

  project:   # advisory
    source: "blueprint 3.3.1"
    codes:
      scoping:   {label: "Scoping",   variant: neutral, terminal: false, derived: false}
      active:    {label: "Active",    variant: state,   terminal: false, derived: false}
      delivered: {label: "Delivered", variant: green,   terminal: false, derived: false}
      closed:    {label: "Closed",    variant: soon,    terminal: true,  derived: false}

