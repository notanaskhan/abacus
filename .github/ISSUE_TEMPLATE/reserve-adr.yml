name: Reserve a ADR number
description: Reserve the next number for an architecture decision record in your own block, before writing it (F-01-T10).
title: "ADR-133: <title>"
labels: ["reservation", "adr"]
body:
  - type: markdown
    attributes:
      value: |
        Title the issue `ADR-NNN: <title>` with the next free number in **your** block.
        Blocks: notanaskhan 116–199 · ayushkbhatia 200–299. `validate_docs` refuses ids outside every block and duplicate ids.
        Close the issue with the merge that adds the file.
  - type: dropdown
    id: owner
    attributes:
      label: Block owner
      options: [notanaskhan, ayushkbhatia]
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Owning epic or task
      placeholder: "e.g. F-01, P-07-T06"
  - type: textarea
    id: summary
    attributes:
      label: What it covers
    validations:
      required: true
