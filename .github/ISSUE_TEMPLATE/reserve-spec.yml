name: Reserve a SPEC number
description: Reserve the next number for a spec in your own block, before writing it (F-01-T10).
title: "SPEC-038: <title>"
labels: ["reservation", "spec"]
body:
  - type: markdown
    attributes:
      value: |
        Title the issue `SPEC-NNN: <title>` with the next free number in **your** block.
        Blocks: notanaskhan 037–099 · ayushkbhatia 100–199. `validate_docs` refuses ids outside every block and duplicate ids.
        Close the issue with the merge that adds the file.
  - type: dropdown
    id: owner
    attributes:
      label: Block owner
      options: [notanaskhan, ayushkbhatia]
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Owning epic or task
      placeholder: "e.g. F-01, P-07-T06"
  - type: textarea
    id: summary
    attributes:
      label: What it covers
    validations:
      required: true
