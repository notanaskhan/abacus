# The security stage (Q-02-T15, Q-02 AC-46; chapter 10 §10.3.4): CodeQL, dependency review,
# pip-audit and Trivy. The generated security suites (tenant isolation, permission matrix, route
# introspection: backend/tests/security) run in ci.yml's stage 2 integration shards with the
# database they need. Third-party actions are pinned to full commit SHAs; the token is read-only
# except where CodeQL uploads its results; no secrets are used.
#
# Making this stage required on main is a repository-ruleset change the owner makes by hand
# (work/tasks/TASK-411-route-introspection.md lists the exact check names).
name: security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "41 6 * * 1" # weekly: new advisories against unchanged code
  workflow_dispatch:

permissions:
  contents: read

# Every commit on main keeps its own complete run; elsewhere a newer push wins.
concurrency:
  group: security-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: security codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # A pull request may not add a dependency with a known high or critical advisory. Elsewhere
  # (push, merge queue, schedule) there is no diff to review: the job is skipped, which a
  # required check accepts.
  dependency-review:
    name: security dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Every locked Python package (runtime and dev) against the PyPI advisory database. The lock is
  # exported with hashes, so pip-audit resolves nothing itself (pip-audit is on the dev allowlist).
  pip-audit:
    name: security pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: export the lock
        working-directory: backend
        run: uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
          --progress-spinner off

  # Known vulnerabilities in every lockfile in the repository (uv.lock, pnpm-lock.yaml), high and
  # critical with a fix available. infra.yml's Trivy config scan covers Terraform.
  trivy:
    name: security trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
