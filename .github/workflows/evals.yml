# CI stage 5 evaluations (SPEC-005 AC-11; TASK-020b): every agent's full suite, nightly and on
# demand. PROTECTED. Fake model until a provider exists (TASK-014); the summaries are kept as
# artifacts. Actions are pinned to full commit SHAs; the token is read-only.
name: evals

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: stage 5 evaluations (full suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: corepack enable
      - run: make setup
      - run: make evals EVAL_ARGS="--subset full"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-summaries
          path: backend/.evals
          if-no-files-found: warn
          retention-days: 30
