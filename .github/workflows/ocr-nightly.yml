# Nightly OCR conformance on real Textract (P-11-T29; P-11 §8; evals/ocr_extraction/suite.yaml).
# The same cases as CI's code-only run (FakeOcr, tests/unit/evidence/test_ocr_extraction_suite.py),
# read by Textract in the staging account: synthetic scanned pages only, never a firm's document.
#
# Report-only until two consecutive runs pass; then set the repository variable
# OCR_NIGHTLY_BLOCKING to "true" and a failing run fails the job (the row's acceptance). Without
# the OCR_NIGHTLY_ROLE_ARN variable (the staging role Textract trusts through OIDC) the run says
# "skipped", which proves nothing either way. The repository is public: only the metrics report
# leaves the runner (synthetic values, no page text). Nothing is built, pushed or deployed.
# Third-party actions are pinned to full commit SHAs.
name: ocr-nightly

on:
  schedule:
    - cron: "41 9 * * *" # daily, 3:41 CT (4:41 in daylight time), after connectors-nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-nightly
  cancel-in-progress: false

env:
  ROLE: ${{ vars.OCR_NIGHTLY_ROLE_ARN }}
  REGION: us-east-2

jobs:
  textract:
    name: OCR conformance on real Textract (report-only until two passes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configured?
        id: gate
        run: |
          if [ -n "$ROLE" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "configured=false" >> "$GITHUB_OUTPUT"; echo "skipped: no OCR_NIGHTLY_ROLE_ARN"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.configured == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.configured == 'true'
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.REGION }}
          role-session-name: ocr-nightly-${{ github.run_id }}
      - name: Install the backend (no build)
        if: steps.gate.outputs.configured == 'true'
        run: cd backend && uv sync --frozen
      - name: Run the suite on Textract
        if: steps.gate.outputs.configured == 'true'
        working-directory: backend
        env:
          BLOCKING: ${{ vars.OCR_NIGHTLY_BLOCKING }}
        run: |
          if [ "$BLOCKING" = "true" ]; then flag="--blocking"; else flag=""; fi
          uv run python -m abacus_tools.evals.ocr_extraction --provider textract --out ../ocr-report $flag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.configured == 'true'
        with:
          name: ocr-conformance
          path: ocr-report/
          retention-days: 30
