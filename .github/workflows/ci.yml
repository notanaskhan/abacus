# CI stages 1 and 2 (ADR-083). PROTECTED. Runs the same Makefile targets as local development.
# Third-party actions are pinned to full commit SHAs; the token is read-only; no secrets are used.
name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

# Every commit on main keeps its own complete run (F-01-T06); elsewhere a newer push wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  stage-1:
    name: stage 1 (make check-fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: corepack enable
      - run: make setup
      - run: make check-fast

  # Stage 2 runs on pushes to main, ready (non-draft) pull requests and the merge queue
  # (F-01-T06); a draft gets stage 1 only. It is `make check` split into parallel jobs (TASK-017):
  # the suites run in shards balanced by recorded run time (every test file in exactly one shard),
  # and the coverage floor applies to the combined data. Stage 1 is the job above, so it isn't
  # repeated here. Path filters (F-01-T07): `changes` classifies the diff once
  # (abacus_tools.ci.paths, the only filter source); a job whose paths didn't change still runs
  # and reports success without running its suite, so the check names stay stable.
  changes:
    name: stage 2 changed paths
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      gallery: ${{ steps.paths.outputs.gallery }}
      agents: ${{ steps.paths.outputs.agents }}
      journeys: ${{ steps.paths.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PYTHONPATH: backend/src
        run: python3 -m abacus_tools.ci.paths "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  unit:
    name: stage 2 unit tests (${{ matrix.shard }}/2)
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - if: needs.changes.outputs.backend != 'true'
        run: echo "no backend paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.backend == 'true'
        run: corepack enable
      - if: needs.changes.outputs.backend == 'true'
        run: make setup
      - if: needs.changes.outputs.backend == 'true'
        run: make ci-unit SHARD=${{ matrix.shard }} SHARDS=2
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: backend/.coverage.unit-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration:
    name: stage 2 integration tests (${{ matrix.shard }}/5)
    needs: [changes]
    runs-on: ubuntu-24.04
    # Headroom for a shard's slowest files (TASK-422); the split is balanced by
    # backend/tests/durations.json, re-recorded when files grow.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - if: needs.changes.outputs.backend != 'true'
        run: echo "no backend paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.backend == 'true'
        run: corepack enable
      - if: needs.changes.outputs.backend == 'true'
        run: make setup
      - if: needs.changes.outputs.backend == 'true'
        run: make ci-integration SHARD=${{ matrix.shard }} SHARDS=5
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: backend/.coverage.integration-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  contracts:
    name: stage 2 schema and api-client
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.backend != 'true'
        run: echo "no backend paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.backend == 'true'
        run: corepack enable
      - if: needs.changes.outputs.backend == 'true'
        run: make setup
      - if: needs.changes.outputs.backend == 'true'
        run: make ci-contracts

  frontend:
    name: stage 2 frontend tests
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.frontend != 'true'
        run: echo "no frontend paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.frontend == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.frontend == 'true'
        run: corepack enable
      - if: needs.changes.outputs.frontend == 'true'
        run: make setup
      - if: needs.changes.outputs.frontend == 'true'
        run: make ci-frontend

  # The gallery's visual run (F-05-T17; epic F-05 section 3, I2 and I3): on a change to packages/ui or the
  # gallery (abacus_tools.ci.paths, `gallery`), the screenshot regression of every specimen against
  # the base commit, parity Tier A and Tier D, and the axe gate. Tier A and D block. It runs on
  # the fixtures dev server: no database, no backend, no secrets. The parity references (the
  # handoff's cropped PNGs) are fetched, never committed, and no baseline source is configured
  # here yet (the bucket, Q-01), so the handoff comparison skips and Tier D and the regression run.
  gallery:
    name: stage 2 gallery visual regression
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - if: needs.changes.outputs.gallery != 'true'
        run: echo "no gallery paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.gallery == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: needs.changes.outputs.gallery == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.gallery == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.gallery == 'true'
        run: corepack enable
      - if: needs.changes.outputs.gallery == 'true'
        run: make setup
      - if: needs.changes.outputs.gallery == 'true'
        name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.gallery == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - if: needs.changes.outputs.gallery == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium
      - if: needs.changes.outputs.gallery == 'true'
        name: Axe gate and accessibility harness on the gallery (fixtures server, port 5173)
        run: |
          make dev-fixtures > dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173/components > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5173/components > /dev/null || { tail -50 dev.log; exit 1; }
          pnpm -C apps/web exec playwright test --project=chromium components.spec.ts a11y.spec.ts e3.spec.ts inv.spec.ts ds-white-label.spec.ts --workers=4
      - if: needs.changes.outputs.gallery == 'true'
        name: Screenshot regression and parity Tier A and D
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ABACUS_VISUAL_PORT: 5290
          VISUAL_REGRESSION_BLOCKING: ${{ github.event_name != 'push' }}
        run: make ci-visual
      - if: always() && needs.changes.outputs.gallery == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-visual-report
          path: |
            apps/web/playwright-report
            apps/web/parity-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Fixture-mode journeys (F-04-T28; F-04.32): the journey specs and the harness self-checks in
  # the `fixture` project, on a change to what they walk (abacus_tools.ci.paths, `journeys`).
  # Playwright starts vite on fixtures itself (ABACUS_FIXTURES=1): no database, no backend, no
  # secrets. Every run publishes its traces and the report; each step's axe findings are
  # attachments in the report.
  journeys:
    name: stage 2 fixture journeys
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.journeys != 'true'
        run: echo "no journey paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.journeys == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.journeys == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.journeys == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.journeys == 'true'
        run: corepack enable
      - if: needs.changes.outputs.journeys == 'true'
        run: make setup
      - if: needs.changes.outputs.journeys == 'true'
        name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: needs.changes.outputs.journeys == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - if: needs.changes.outputs.journeys == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium
      - if: needs.changes.outputs.journeys == 'true'
        name: Journeys in fixture mode (make journeys)
        run: make journeys JOURNEY_ARGS=--trace=on
      - if: always() && needs.changes.outputs.journeys == 'true'
        name: Traces and the report with axe findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-journeys
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: stage 2 coverage floor
    needs: [changes, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.backend != 'true'
        run: echo "no backend paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.backend == 'true'
        run: corepack enable
      - if: needs.changes.outputs.backend == 'true'
        run: make setup
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: backend
          merge-multiple: true
      - if: needs.changes.outputs.backend == 'true'
        run: make ci-coverage

  # Stage 3 (SPEC-005 AC-10; TASK-020b): the fast evaluation subset, only when the change touches
  # what an agent's behaviour depends on (ADR-082). Fake model until a provider exists; a
  # real-model run will need the evaluation key secret.
  evals-fast:
    name: stage 3 evaluations (fast subset)
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.agents != 'true'
        run: echo "no agent paths changed (abacus_tools.ci.paths), so nothing to run"
      - if: needs.changes.outputs.agents == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.agents == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: needs.changes.outputs.agents == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: needs.changes.outputs.agents == 'true'
        run: corepack enable
      - if: needs.changes.outputs.agents == 'true'
        run: make setup
      - if: needs.changes.outputs.agents == 'true'
        run: make evals EVAL_ARGS="--subset fast"

  # One stable check for branch protection: green only when every stage 1 and 2 job passed.
  stage-2:
    name: stages 1 and 2 (make check)
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    needs: [stage-1, changes, unit, integration, contracts, frontend, gallery, journeys, coverage, evals-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every stage 1 and 2 job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
