# Mutation floors only rise (Q-03-T027; QD-4; ADR-079; DEC-365). A pull request or merge-queue
# entry that lowers or removes a floor in backend/mutation-thresholds.yaml fails here, compared
# with its base on full history (stage 1's `make check-fast` compares with origin/main only when a
# checkout has it). The guard is standard-library Python, so nothing is installed. Making this
# check required on main is a repository-ruleset change the owner makes by hand.
name: mutation-floors

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: mutation-floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floors:
    name: mutation floors only rise
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare the floors with the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PYTHONPATH: backend/src
        run: python3 -m abacus_tools.quality.mutation_floors --base "$BASE"
