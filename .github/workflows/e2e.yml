# CI stage 5 (ADR-083): the Playwright journey with accessibility checks, nightly and on demand,
# not on every pull request (TASK-012 Q5). PROTECTED. Runs the same Makefile targets as local
# development against the compose stack. Actions are pinned to full commit SHAs; the token is
# read-only; no secrets are used.
name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: stage 5 (make e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: corepack enable
      - run: make setup
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: Start the local stack (API, sign-in, worker, SPA)
        run: |
          make dev > dev.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:5173/ > /dev/null && \
              curl -sf http://127.0.0.1:9000/jwks > /dev/null && \
              curl -s -o /dev/null http://127.0.0.1:8001/v1/me; then
              exit 0
            fi
            sleep 2
          done
          echo "the local stack did not come up"; tail -100 dev.log; exit 1
      - run: make seed
      - run: make e2e
      - name: Stack log on failure
        if: failure()
        run: tail -200 dev.log
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
