# CI stage 5 (ADR-083): the Playwright journey with accessibility checks, nightly and on demand,
# not on every pull request (TASK-012 Q5). PROTECTED. Runs the same Makefile targets as local
# development against the compose stack. Actions are pinned to full commit SHAs; the token is
# read-only except in nightly-red, which may only write issues; no secrets are used.
# F-01-T08 (SPEC-045 AC-14, AC-15): a red scheduled night opens or updates one nightly-red issue.
name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: stage 5 (make e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: corepack enable
      - run: make setup
      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium
      - name: Start the local stack (API, sign-in, worker, SPA)
        run: |
          make dev > dev.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:5173/ > /dev/null && \
              curl -sf http://127.0.0.1:9000/jwks > /dev/null && \
              curl -s -o /dev/null http://127.0.0.1:8001/v1/me; then
              exit 0
            fi
            sleep 2
          done
          echo "the local stack did not come up"; tail -100 dev.log; exit 1
      - run: make seed
      - run: make e2e
      - name: Stack log on failure
        if: failure()
        run: tail -200 dev.log
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  nightly-red:
    name: open or update the nightly-red issue
    needs: journey
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-red --repo "$REPO" --color B60205 \
            --description "The nightly e2e journey failed" --force
          open=$(gh issue list --repo "$REPO" --label nightly-red --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "Red again: $RUN_URL"
          else
            gh issue create --repo "$REPO" --label nightly-red \
              --title "Nightly e2e journey is red" \
              --body "The scheduled e2e journey failed: $RUN_URL. Two red nights in a row make the fix the first work of the next session (SPEC-045 AC-15)."
          fi
