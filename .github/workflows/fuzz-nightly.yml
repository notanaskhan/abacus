# Nightly parser fuzzing (Q-03-T030; ADR-052, ADR-085, ADR-110). The Hypothesis suite in
# backend/tests/property/fuzz/ runs on its `nightly` profile inside a 15-minute budget: five TB
# and five GL ledger formats, the XLSX request-list importer and PDF extraction in its child.
# Reaching the budget is a clean night; a crash fails the job and opens a SEV3 issue. The repository
# is public, so nothing here publishes a crashing input or names the parser it crashes before the
# fix ships (security review, 2026-10-26): pytest's output stays on the runner (not echoed, not
# uploaded), the summary and the issue carry only the count, the commit and the night's seed, and a
# maintainer reproduces it locally from those (docs/ops/fuzzing.md). Inputs are generated, never
# client data. Third-party actions are pinned to full commit SHAs; no secrets are used.
name: fuzz-nightly

on:
  schedule:
    - cron: "41 8 * * *" # daily, 2:41 CT (3:41 in daylight time), after mutation-nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: parser fuzzing (15-minute budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # the SEV3 ticket on a crash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the backend (no build)
        run: cd backend && uv sync --frozen
      - name: Fuzz inside the 15-minute budget
        id: fuzz
        working-directory: backend
        env:
          ABACUS_FUZZ_PROFILE: nightly
        run: |
          OUT="$RUNNER_TEMP/fuzz-report"
          mkdir -p "$OUT"
          SEED="$(date -u +%Y%m%d)"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          set +e
          # At the budget, timeout interrupts pytest (exit 124): the junit report still names any
          # crash found before then, so the verdict is read from the report, not the exit code.
          # Its output goes to a file on the runner only: the job log is public.
          timeout --signal=INT 15m uv run pytest tests/property/fuzz -p no:cacheprovider \
            --hypothesis-seed="$SEED" --junitxml="$OUT/junit.xml" -o junit_family=xunit2 \
            > "$OUT/pytest.log" 2>&1
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          uv run python - "$OUT/junit.xml" "$code" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report, code = Path(sys.argv[1]), int(sys.argv[2])
          crashes = 0
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      crashes += 1
          elif code not in (0, 124):
              crashes = 1  # the suite did not report
          print(f"crashes={crashes}")
          PY
      - name: Night summary
        if: always()
        env:
          EXIT: ${{ steps.fuzz.outputs.exit }}
          CRASHES: ${{ steps.fuzz.outputs.crashes }}
          SEED: ${{ steps.fuzz.outputs.seed }}
        run: |
          {
            echo "## Nightly parser fuzzing"
            echo "pytest exit: $EXIT (124 = the 15-minute budget was spent)"
            echo "Crashing targets: ${CRASHES:-0} (named only locally; the repository is public)"
            echo "Seed: $SEED at $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open the SEV3 ticket
        if: steps.fuzz.outputs.crashes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CRASHES: ${{ steps.fuzz.outputs.crashes }}
          SEED: ${{ steps.fuzz.outputs.seed }}
        run: |
          title="SEV3: parser fuzz crash $(date -u +%Y-%m-%d)"
          body=$(printf 'Nightly fuzzing found %s crashing target(s) (Q-03-T030).\n\nReproduce locally at commit %s with seed %s (docs/ops/fuzzing.md, "A crash"). The targets and inputs are not published here: the repository is public.\n' "$CRASHES" "$GITHUB_SHA" "$SEED")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          exit 1
