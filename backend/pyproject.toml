# PROTECTED. Layout per ADR-101; tooling per ADR-009, ADR-083.
[project]
name = "abacus-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "anthropic[bedrock]>=1.11.0",
    "asyncpg",
    "boto3",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4",
    "pillow>=13.0.0",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]",
    "structlog",
    "temporalio",
    "uvicorn>=0.40",
    "workos>=10.6.0",
    "pyyaml",  # ECS ops tasks run abacus_tools (tenants, flags, release) that read YAML
    "weasyprint>=66",
    "python-docx>=1.2",
    "pillow-heif>=1.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "import-linter",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "hypothesis",
    "bandit",
    "types-PyYAML",
    "testcontainers",
    "types-boto3[kms,s3,secretsmanager,sesv2,sqs,ssm]",
    "asyncpg-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Runtime wheel ships product code only; abacus_tools is importable in dev via src/ (ADR-101).
packages = ["src/abacus"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PGH", "T20", "TID", "S"]

[tool.ruff.lint.isort]
known-first-party = ["abacus", "abacus_tools"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"openai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"langchain".msg = "No agent frameworks (ADR-057)."
"langchain_core".msg = "No agent frameworks (ADR-057)."
"langchain_community".msg = "No agent frameworks (ADR-057)."
"langchain_openai".msg = "No agent frameworks (ADR-057)."
"langchain_anthropic".msg = "No agent frameworks (ADR-057)."
"llama_index".msg = "No agent frameworks (ADR-057)."
"crewai".msg = "No agent frameworks (ADR-057)."
"autogen".msg = "No agent frameworks (ADR-057)."
"google.generativeai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"google.genai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"vertexai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"mistralai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"cohere".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"litellm".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"groq".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"ollama".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"together".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"langgraph".msg = "No agent frameworks (ADR-057)."
"pydantic_ai".msg = "No agent frameworks (ADR-057)."
"dspy".msg = "No agent frameworks (ADR-057)."
"haystack".msg = "No agent frameworks (ADR-057)."
"semantic_kernel".msg = "No agent frameworks (ADR-057)."
"smolagents".msg = "No agent frameworks (ADR-057)."
"autogen_agentchat".msg = "No agent frameworks (ADR-057)."
"autogen_core".msg = "No agent frameworks (ADR-057)."
"ag2".msg = "No agent frameworks (ADR-057)."
"instructor".msg = "No agent frameworks (ADR-057)."
"agents".msg = "No agent frameworks (ADR-057)."

[tool.ruff.lint.per-file-ignores]
# SPEC-010 AC-8: provider SDKs only in the route adapters.
"src/abacus/ai_gateway/routes/**" = ["TID251"]
"src/abacus_tools/**" = ["T20"]
"src/abacus_tools/quality/secrets_scan.py" = ["T20", "S603"]  # runs git ls-files
"src/abacus_tools/quality/schema_check.py" = ["S106", "T20"]  # local container credentials
"src/abacus_tools/quality/mutation.py" = ["T20", "S603"]  # runs git log (Q-03-T026)
"src/abacus_tools/quality/mutation_floors.py" = ["T20", "S603"]  # runs git show (Q-03-T027)
"src/abacus_tools/quality/expand_only.py" = ["T20", "S603"]  # runs git diff (Q-03-T081)
"src/abacus_tools/quality/backfill_rerun.py" = ["T20", "S603", "S607", "S314"]  # runs pytest and vitest, reads their JUnit (Q-03-T059)
"src/abacus_tools/ci/paths.py" = ["T20", "S603"]  # runs git diff (F-01-T07)
"src/abacus_tools/drill.py" = ["T20", "S608"]  # table names from the catalogue and the insert-only registry (Q-01-T38)
"src/abacus_tools/ci/coverage_floor.py" = ["T20", "S603"]  # runs coverage report (DEC-10)
"src/abacus_tools/quality/coverage_floors.py" = ["T20", "S603"]  # git show, coverage json (Q-03-T066)
"src/abacus_tools/local/worktree_env.py" = ["T20", "S603"]  # runs git worktree list (F-01-T09)
"src/abacus_tools/synthetic/scenarios/brightwater_hale/loader.py" = ["S311", "S603"]  # runs gh run list (F-04.16)
"src/abacus_tools/synthetic/**" = ["S311"]  # seeded, non-cryptographic by design (ADR-085)
"src/abacus_tools/loadtest/run.py" = ["S311"]  # a seeded, repeatable request mix (Q-03-T035)
"src/abacus/modules/sampling/selection.py" = ["S311"]  # seeded audit sampling, re-performable (ADR-132)
"src/abacus/modules/sampling/compute/draw.py" = ["S311"]  # sampler v2.3: getrandbits from a recorded seed, re-performable (ADR-340)
"src/abacus/kernel/_statuses.py" = ["S105"]  # generated status codes such as wrong_password
"tests/**" = ["S101"]
"tests/acceptance/support.py" = ["S106"]  # throwaway credentials for stubbed AWS clients that never connect
"tests/unit/quality/test_hooks.py" = ["S101", "S603"]  # runs the repo's own hook scripts
"tests/unit/quality/test_mutation_floors.py" = ["S101", "S603"]  # runs the repo's own hook scripts
"tests/unit/quality/test_secrets_scan.py" = ["S101", "S603"]  # git init in a tmp repo
"tests/unit/tools/test_paths.py" = ["S101", "S603"]  # git init in a tmp repo
"tests/unit/tools/test_f05t62_ci_frontend_independent.py" = ["S101", "S603"]  # git and the paths module in a tmp repo
"tests/unit/tools/test_worktree_env.py" = ["S101", "S603"]  # git init in a tmp repo
"tests/integration/conftest.py" = ["S105", "S106", "S310"]  # local container credentials; health checks
"tests/integration/test_q03t028_plan_tests.py" = ["S101", "S608"]  # the synthetic fixture's INSERT is built from catalog column names (Q-03-T028)
"tests/integration/test_local_stack.py" = ["S105", "S106", "S310"]  # local container smoke tests
"tests/unit/synthetic/**" = ["S314", "S603"]  # runs this interpreter; parses our own XLSX

[tool.ruff.format]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = [
    "serial: a wall-clock budget; runs alone after the parallel workers (DEC-335)",
    "source_scan: reads source or repository files, not behaviour; left out of mutation runs only (DEC-599)",
    "quarantine(issue, owner, since): a flaky test held at most 10 working days; it still runs (Q-03-T097)",
]

[tool.coverage.run]
source = ["abacus", "abacus_tools"]
branch = true

[tool.coverage.report]
# Coverage floor (ADR-079). Protected: only ever raised, with founder review. Red-zone modules get
# their own higher floors when they gain code (SPEC-000).
fail_under = 95
show_missing = true
skip_covered = true

[tool.mutmut]
# Q-03-T026 (ADR-079, DEC-365): mutation over the red scopes of abacus_tools.quality.mutation, run
# only by mutation-nightly.yml and mutation-weekly.yml (mutmut 3.8.0 through `uv run --with`; it is
# allowlisted and not in the lock). Each run narrows only_mutate to its files on the runner's copy
# (`python -m abacus_tools.quality.mutation narrow`); the list below is the whole scope. The suites
# that need no containers decide a mutant: mutmut re-runs pytest per mutant in one process, and the
# integration suites' session containers would restart each time.
source_paths = ["src/"]
only_mutate = [
    "src/abacus/modules/identity/authz/*",
    "src/abacus/kernel/db/*",
    "src/abacus/kernel/uow/*",
    "src/abacus/kernel/crypto/*",
    "src/abacus/modules/evidence/*",
    "src/abacus/ai_gateway/*",
    "src/abacus/modules/audit_trail/*",
    "src/abacus/*/compute/*",
]
do_not_mutate = [
    "*/_matrix.py",
    "*/_flags.py",
    "*/_specs.py",
    "*/_statuses.py",
    "*/_eval_suites.py",
    "*/_human_only_actions.py",
    "*/_provider_terms.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property", "tests/acceptance"]
pytest_add_cli_args = ["-p", "no:xdist", "-p", "no:cacheprovider", "-m", "not serial"]
also_copy = ["migrations", "alembic.ini", "typings"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_packages = ["abacus", "abacus_tools"]

[[tool.importlinter.contracts]]
name = "Top-level layers (ADR-101)"
type = "layers"
layers = [
    "abacus.api | abacus.worker",
    "abacus.modules",
    "abacus.ai_gateway",
    "abacus.kernel",
]

[[tool.importlinter.contracts]]
name = "Product never imports tooling (ADR-101)"
type = "forbidden"
source_modules = ["abacus"]
forbidden_modules = ["abacus_tools"]

[[tool.importlinter.contracts]]
name = "Workflows orchestrate only: no data access or clients (ADR-017)"
type = "forbidden"
source_modules = ["abacus.modules.*.workflows"]
forbidden_modules = [
    "abacus.kernel",
    "abacus.modules.*.repository",
    "abacus.modules.*.service",
    "abacus.modules.*.pipeline",
    "abacus.modules.*.activities",
    "abacus.modules.*.routes",
]

[[tool.importlinter.contracts]]
name = "Clients never reach the model or the agent: TINs and client records stay out (P-07-T04)"
type = "forbidden"
source_modules = ["abacus.modules.organisations"]
forbidden_modules = ["abacus.ai_gateway", "abacus.modules.agents"]
# Direct imports only: identity (which every module imports for authz) reaches the gateway for
# the firm's AI settings, so an indirect path is not a leak of client data.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Compute packages import only kernel.numeric and kernel.calendar (A-03-T21; chapter 03 §10.1)"
type = "forbidden"
source_modules = [
    "abacus.modules.sampling.compute",
    "abacus.modules.ledger.compute",
    "abacus.modules.assurance.compute",
]
forbidden_modules = [
    "abacus.api",
    "abacus.worker",
    "abacus.ai_gateway",
    "abacus.kernel",
    "abacus.modules",
    "abacus_tools",
]
# The two kernel helpers, and a compute package's own submodules, are the only allowed edges.
ignore_imports = [
    "abacus.modules.*.compute.** -> abacus.kernel.numeric",
    "abacus.modules.*.compute.** -> abacus.kernel.calendar",
    "abacus.modules.sampling.compute.** -> abacus.modules.sampling.compute.**",
    "abacus.modules.ledger.compute.** -> abacus.modules.ledger.compute.**",
    "abacus.modules.assurance.compute.** -> abacus.modules.assurance.compute.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "In-module layering: routes -> service -> repository (ADR-012)"
type = "layers"
layers = ["(routes)", "(retrievals)", "(service)", "(repository)"]
containers = [
    "abacus.modules.identity",
    "abacus.modules.organisations",
    "abacus.modules.engagements",
    "abacus.modules.requests",
    "abacus.modules.evidence",
    "abacus.modules.connections",
    "abacus.modules.ledger",
    "abacus.modules.sampling",
    "abacus.modules.fieldwork",
    "abacus.modules.agents",
    "abacus.modules.audit_trail",
    "abacus.modules.communications",
    "abacus.modules.platform",
    # F-03-T08: pre-registered modules (ADR-140).
    "abacus.modules.methodology",
    "abacus.modules.review",
    "abacus.modules.collaboration",
    "abacus.modules.workpapers",
    "abacus.modules.adjustments",
    "abacus.modules.signatures",
    "abacus.modules.integrations",
    "abacus.modules.reporting",
    "abacus.modules.assurance",
    "abacus.modules.attest",
    "abacus.modules.tax",
    "abacus.modules.closes",
    "abacus.modules.notices",
    "abacus.modules.workbench",
    "abacus.modules.practice",
    "abacus.modules.portal",
    "abacus.modules.notifications",
]
