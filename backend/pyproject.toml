# PROTECTED. Layout per ADR-101; tooling per ADR-009, ADR-083.
[project]
name = "abacus-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "import-linter",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "bandit",
    "pyyaml",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Runtime wheel ships product code only; abacus_tools is importable in dev via src/ (ADR-101).
packages = ["src/abacus"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PGH", "T20", "TID", "S"]

[tool.ruff.lint.isort]
known-first-party = ["abacus", "abacus_tools"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"openai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"langchain".msg = "No agent frameworks (ADR-057)."
"langchain_core".msg = "No agent frameworks (ADR-057)."
"langchain_community".msg = "No agent frameworks (ADR-057)."
"langchain_openai".msg = "No agent frameworks (ADR-057)."
"langchain_anthropic".msg = "No agent frameworks (ADR-057)."
"llama_index".msg = "No agent frameworks (ADR-057)."
"crewai".msg = "No agent frameworks (ADR-057)."
"autogen".msg = "No agent frameworks (ADR-057)."
"google.generativeai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"google.genai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"vertexai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"mistralai".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"cohere".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"litellm".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"groq".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"ollama".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"together".msg = "Model providers only through abacus.ai_gateway (ADR-019)."
"langgraph".msg = "No agent frameworks (ADR-057)."
"pydantic_ai".msg = "No agent frameworks (ADR-057)."
"dspy".msg = "No agent frameworks (ADR-057)."
"haystack".msg = "No agent frameworks (ADR-057)."
"semantic_kernel".msg = "No agent frameworks (ADR-057)."
"smolagents".msg = "No agent frameworks (ADR-057)."
"autogen_agentchat".msg = "No agent frameworks (ADR-057)."
"autogen_core".msg = "No agent frameworks (ADR-057)."
"ag2".msg = "No agent frameworks (ADR-057)."
"instructor".msg = "No agent frameworks (ADR-057)."
"agents".msg = "No agent frameworks (ADR-057)."

[tool.ruff.lint.per-file-ignores]
"src/abacus/ai_gateway/**" = ["TID251"]
"src/abacus_tools/**" = ["T20"]
"src/abacus_tools/quality/secrets_scan.py" = ["T20", "S603"]  # runs git ls-files
"src/abacus_tools/synthetic/**" = ["S311"]  # seeded, non-cryptographic by design (ADR-085)
"tests/**" = ["S101"]
"tests/unit/quality/test_hooks.py" = ["S101", "S603"]  # runs the repo's own hook scripts
"tests/unit/quality/test_secrets_scan.py" = ["S101", "S603"]  # git init in a tmp repo
"tests/unit/synthetic/**" = ["S314", "S603"]  # runs this interpreter; parses our own XLSX

[tool.ruff.format]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.coverage.run]
source = ["abacus", "abacus_tools"]
branch = true

[tool.coverage.report]
# Coverage floor (ADR-079). Protected: only ever raised, with founder review. Red-zone modules get
# their own higher floors when they gain code (SPEC-000).
fail_under = 95
show_missing = true
skip_covered = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.importlinter]
root_packages = ["abacus", "abacus_tools"]

[[tool.importlinter.contracts]]
name = "Top-level layers (ADR-101)"
type = "layers"
layers = [
    "abacus.api | abacus.worker",
    "abacus.modules",
    "abacus.ai_gateway",
    "abacus.kernel",
]

[[tool.importlinter.contracts]]
name = "Product never imports tooling (ADR-101)"
type = "forbidden"
source_modules = ["abacus"]
forbidden_modules = ["abacus_tools"]

[[tool.importlinter.contracts]]
name = "In-module layering: routes -> service -> repository (ADR-012)"
type = "layers"
layers = ["(routes)", "(service)", "(repository)"]
containers = [
    "abacus.modules.identity",
    "abacus.modules.organisations",
    "abacus.modules.engagements",
    "abacus.modules.requests",
    "abacus.modules.evidence",
    "abacus.modules.connections",
    "abacus.modules.ledger",
    "abacus.modules.sampling",
    "abacus.modules.agents",
    "abacus.modules.audit_trail",
    "abacus.modules.communications",
    "abacus.modules.platform",
]
