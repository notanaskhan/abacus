# Form 1095-A Health Insurance Marketplace Statement map (P-11-T35; P-11 F8; DEC-76, DEC-2809, DEC-3008). PROTECTED: golden tested and
# reviewed yearly against the IRS form for the year. Dark until the firm's `evidence.form_extraction`
# variant covers `tax_forms`. TINs (SSN, EIN) are never fields: P-03 masks them on the page.

form: "1095-A"
form_type: "f1095a"
tax_year: 2027
family: tax_forms
version: "f1095a-2027-v1"
anchors: ["1095-A"]
year_after: "1095-A"
fields: []
# Part III's monthly rows, read as printed (never summed; the annual totals line is the stop).
tables:
  - {key: f1095a.part3, label: "Coverage Household", header: "Month", stop: "Annual Totals", columns: [monthly_premium, slcsp_premium, advance_ptc]}
