# The matcher (ADR-047; SPEC-033). Source of truth: compiled into _specs.py by
# `python -m abacus_tools.codegen.agent_specs`; a test fails if they drift.
# v3 (N-01-T22; N-01 §6; DEC-1278): the spec describes mode `intake` (prompt v3, IntakeMatchInput,
# IntakeMatchOutput, $0.015 a file). Mode `engagement` keeps v2's prompt, output and $0.01 budget,
# pinned in `inbox_match.py`, so its measured behaviour and replay history are unchanged.
id: evidence.matcher
version: 3
purpose: Propose which open request an inbox file belongs to, or, in intake mode, what an intake attachment is and which of its client's destinations it goes to, from its masked contents.
shape: single_call
prompt: evidence.inbox_match@v3
tier: small
escalation_tier: medium
input_schema: IntakeMatchInput
output_schema: IntakeMatchOutput
task_scope: [evidence.read, inbox_match.run]
tools: []
limits:
  max_output_tokens: 800
  max_cost_usd: "0.015"
  max_steps: 1
  max_seconds: 45
autonomy: propose
# A proposal below this confidence is recorded but not shown (SPEC-033 §4.6).
confidence_routing:
  below: "0.5"
  route: hidden
untrusted_inputs: [document]
evaluation_suite: evals/matching
# SPEC-033: firm-side proposals, deferrable under pressure (ADR-069/105).
work_class: background
essential: false
cheaper_tiers: []
routes: [bedrock, direct]
# N-01-T22 (DEC-1278): mode engagement is v2 as measured (the audit section of evals/matching).
modes:
  engagement:
    prompt: evidence.inbox_match@v2
    input_schema: MatchInput
    output_schema: MatchOutput
    max_cost_usd: "0.01"
