# tax.instrument_reader v1 (T-07-T13; T-07 §6; SPEC-656 AC-1.4, AC-1.5, AC-2.1 to AC-2.4;
# TASK-8041; DEC-5027). A trust's governing instrument to the seven tax determinations:
# `modules/tax/instrument_reader.py` gives the model the clauses (masked, untrusted) and the
# trust's code facts, verifies every citation and number by code, and proposes the kept
# determinations through C17. Workflow shape (code's steps, one model call, one propose tool), as
# tax.agreement_reader's. Source of truth: compiled into ../_specs_v2.py by
# `python -m abacus_tools.codegen.agent_specs_v2`.
id: tax.instrument_reader
version: 1
purpose: Read a trust's governing instrument and propose its seven tax determinations with a clause citation for every governed one, for a person to adopt and a manager to approve.
shape: workflow
prompt: tax.instrument_reader@v1
tier: medium
escalation_tier: medium
input_schema: ReadInstrumentInput
output_schema: ReadInstrumentOutput
tools:
  read: [tax.read_instrument_clauses, tax.read_trust_facts]
  propose: [tax.propose_trust_determinations]
task_scope:
  - instrument.read
  - proposal.create
limits:
  max_output_tokens: 4000
  max_cost_usd: "0.60"
  max_steps: 4
  max_seconds: 120
  max_tool_calls: 3
plan: required_when_writes
autonomy: propose
data_classes: [tri]
untrusted_inputs: [instrument_text]
evaluation_suite: evals/tax_instrument_reader
work_class: background
essential: false
cheaper_tiers: []
routes: [bedrock, direct]
client_data: none
