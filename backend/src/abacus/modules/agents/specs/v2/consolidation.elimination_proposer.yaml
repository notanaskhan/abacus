# consolidation.elimination_proposer v1 (A-09-T34; A-09 §6; SPEC-658 F4; DEC-5522). Code computes
# every intercompany candidate and amount from the mapped TBs and the structure
# (`modules/assurance/elimination_proposer.py`); the model writes each entry's description and
# note and names the inventory cell for unrealized profit; code reads and cites that cell (C4,
# verified with code's value), checks every number in the words is code's, and proposes the kept
# entries through C17's propose-only `assurance.propose_eliminations`. A person approves and
# posts on AUD-33. Source of truth: compiled into ../_specs_v2.py by
# `python -m abacus_tools.codegen.agent_specs_v2`.
id: consolidation.elimination_proposer
version: 1
purpose: Describe each code-computed intercompany elimination and locate the evidence cell for unrealized profit, for a person to approve and post.
shape: workflow
prompt: consolidation.elimination_proposer@v1
tier: medium
escalation_tier: medium
input_schema: ProposerInput
output_schema: ProposerOutput
tools:
  propose: [assurance.propose_eliminations]
task_scope:
  - elimination.read
  - elimination.agent_propose
  - evidence.read
limits:
  max_output_tokens: 6000
  max_cost_usd: "0.20"
  max_steps: 3
  max_seconds: 120
  max_tool_calls: 1
plan: required_when_writes
autonomy: propose
data_classes: [confidential]
untrusted_inputs: [sheets, candidates]
evaluation_suite: evals/elimination_proposal
work_class: interactive
essential: false
cheaper_tiers: []
routes: [bedrock, direct]
client_data: none
