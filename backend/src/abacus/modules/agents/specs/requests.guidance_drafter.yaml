# The guidance drafter (ADR-047; SPEC-035). Source of truth: compiled into _specs.py by
# `python -m abacus_tools.codegen.agent_specs`; a test fails if they drift.
id: requests.guidance_drafter
version: 2
purpose: Draft why a request is asked and what a good answer looks like, for a person to approve.
shape: single_call
prompt: requests.guidance_draft@v1
tier: small
escalation_tier: medium
input_schema: GuidanceDraftInput
output_schema: GuidanceDraft
# methodology.read: drafting on a template version, firm-level (TASK-074 D1).
task_scope: [request_item.read, methodology.read, guidance_draft.run]
tools: []
limits:
  max_output_tokens: 400
  max_cost_usd: "0.005"
  max_steps: 1
  max_seconds: 30
autonomy: propose
# Every draft is reviewed by a person; nothing is hidden by confidence (SPEC-035 §4.5).
confidence_routing:
  below: "0"
  route: hidden
untrusted_inputs: [item, examples]
evaluation_suite: evals/guidance_drafting
# SPEC-035: firm-side drafts, deferrable under pressure (ADR-069/105).
work_class: batch
essential: false
cheaper_tiers: []
routes: [bedrock, direct]
