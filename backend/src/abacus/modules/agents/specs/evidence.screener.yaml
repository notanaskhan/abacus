# The evidence screener (ADR-047; SPEC-000 §10). Source of truth: compiled into _specs.py by
# `python -m abacus_tools.codegen.agent_specs`; a test fails if they drift.
id: evidence.screener
version: 1
purpose: Screen a retrieved trial balance and propose whether it is ready for review.
shape: single_call
prompt: evidence.screen@v0
tier: small
escalation_tier: medium
input_schema: ScreeningInput
output_schema: ScreeningOutput
task_scope: [evidence.read, screening.run]
tools: []
limits:
  max_output_tokens: 800
  max_cost_usd: "0.03"
  max_steps: 1
  max_seconds: 60
autonomy: propose
confidence_routing:
  below: "0.5"
  route: needs_revision
untrusted_inputs: [account_names]
evaluation_suite: evals/screening
# SPEC-003: its work class (Q1: time-sensitive), whether it is essential under pressure (ADR-069,
# named `essential` by ADR-105), and cheaper tiers it may step down to (none has passed its
# evaluation suite yet).
work_class: time_sensitive
essential: true
cheaper_tiers: []
# SPEC-010 (ADR-073): the same model through Bedrock first (inside our AWS trust boundary,
# Q1), then the provider's own API.
routes: [bedrock, direct]
