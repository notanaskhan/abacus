# The section drafter (A-04-T11; A-04 §3.1 AC1.1, §6 AC6.1; DEC-1868). Version 2 (A-05-T12;
# DEC-1956): A-05's six EBP modes on the same spec, workflow and gate. One capability, one spec:
# A-05 and A-08 add their modes as later versions of this file, never a second spec, workflow or
# flag (OQ-1). Source of truth: compiled into _specs.py by
# `python -m abacus_tools.codegen.agent_specs`; a test fails if they drift.
id: workpapers.section_drafter
version: 3
purpose: Draft a workpaper section's values, each cited to the firm's methodology or a source page, as suggestions for a person to adopt.
shape: single_call
# The default mode (`gap`) and every mode below share the base prompt until each mode's own prompt
# and mapping land (A-04-T22 gap, T23 risk_narrative, T24 risk, T29 ic, T35 soc1), each as a new
# version of this spec.
prompt: workpapers.section_draft@v1
tier: medium
escalation_tier: medium
input_schema: SectionDraftInput
output_schema: SectionDraft
# Reads the paper and its procedures, cites methodology steps and evidence, writes suggestions only.
task_scope: [workpaper.read, procedure.read, methodology.read, evidence.read, ebp.read, suggestion.create, section_draft.run]
tools: []
limits:
  max_output_tokens: 4000
  # Provisional per section until the S24 evaluation run sets it (A-04 §6; T14).
  max_cost_usd: "0.15"
  max_steps: 1
  max_seconds: 120
autonomy: propose
# Every drafted value is a pending suggestion; nothing is hidden by confidence. A value without a
# verified citation or with an unprovenanced number is dropped and flagged Unsupported by code.
confidence_routing:
  below: "0"
  route: hidden
untrusted_inputs: [cells, documents]
evaluation_suite: evals/workpapers_section_drafter
# A-04 §4.5: section drafts are background work, deferrable under pressure.
work_class: background
essential: false
cheaper_tiers: []
routes: [bedrock, direct]
# Synthetic firms only until SPEC-036 clears the drafter: a real firm gets 409
# drafting_not_enabled at the route.
client_data: none
modes:
  risk_narrative:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.15"
  risk:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.15"
  ic:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.15"
  soc1:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.15"
  # A-05-T12 (DEC-1956): the EBP modes, each on the base prompt until its own lands (T13
  # ebp_provisions; the others with their screens). A mode runs only on its plan's paper kinds.
  # A-05-T13 (DEC-1957): its own prompt; the provisions are cells B2-C21 of the EBP-02 paper.
  ebp_provisions:
    prompt: workpapers.section_draft_ebp_provisions@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
  ebp_attribute:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
  ebp_reconcile:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
  ebp_trust:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
  ebp_form5500:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
  related_parties:
    prompt: workpapers.section_draft@v1
    input_schema: SectionDraftInput
    output_schema: SectionDraft
    max_cost_usd: "0.25"
