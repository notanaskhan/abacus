<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The renderer's only fonts (ADR-320, P-11-T02): no system directory is listed, so a glyph no
     vendored font carries fails the render (missing_glyph) instead of falling back. WeasyPrint
     registers the vendored faces from @font-face rules served by the asset fetcher. -->
<fontconfig>
  <cachedir>/tmp/abacus-fontconfig</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
