<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The renderer's only fonts (ADR-320, P-11-T02): this directory and no system directory, so
     text renders in the vendored Arimo, Gelasio and Geist Mono faces or not at all. The faces are
     TrueType: WeasyPrint finds faces through fontconfig, which reads TTF (a WOFF-only setup left
     fontconfig empty and Pango crashed, P-11-T02 spike). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/abacus-fontconfig</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
