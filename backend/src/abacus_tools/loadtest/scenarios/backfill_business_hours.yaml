# Backfill in business hours (Q-03-T043; chapter 10 section 10.11.3; ADR-091): the Monday mix
# while a throttled Temporal backfill runs on the batch class. The backfill itself is started by
# the operator through its own allowlisted ops command, never by this profile (the harness starts
# workflows only in a local namespace, DEC-397); here Temporal visibility is read at a steady
# rate so the run records schedule-side latency beside the API's. Must show: the interactive
# targets unaffected. Read-only.
name: backfill_business_hours
description: The Monday mix with a throttled batch-class backfill running beside it.
duration_seconds: 1800
users: 30
think_ms: 2000
ramp_seconds: 60
max_error_rate: 0.001
personas:
  - {subject: scenario-hannah-leclerc, weight: 2}
  - {subject: scenario-marcus-delaney, weight: 3}
  - {subject: scenario-ana-cruz, weight: 4}
groups:
  - name: home_waiting_on_you
    weight: 3
    p95_ms: 500
    steps:
      - {path: /v1/home}
      - {path: /v1/notifications}
  - name: lists_with_counts
    weight: 3
    p95_ms: 500
    steps:
      - {path: "/v1/engagements?limit=25"}
      - {path: "/v1/work-items?limit=25"}
  - name: record_reads
    weight: 3
    p95_ms: 300
    steps:
      - {path: "/v1/engagements/{engagement_id}"}
temporal:
  - name: temporal_visibility
    kind: count_workflows
    rate_per_second: 1
