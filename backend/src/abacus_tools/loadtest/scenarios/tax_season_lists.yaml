# TY2027 season lists at the December peak (T-03-T18; ADR-075 December load test; T-03 §9):
# staff on TAX-13's extensions and estimates lists beside the tax returns board. Must show: the lists
# hold their p95 under the peak. What this profile cannot yet carry is written down, not faked: the
# exports (`/export.xlsx`) and the BND-03 questionnaire preview need ids the perf seed doesn't write,
# and join once it writes a TY2027 return with an extension and an organizer.
name: tax_season_lists
description: Staff on the TAX-13 extensions and estimates lists at the December peak.
duration_seconds: 1200
users: 30
think_ms: 800
ramp_seconds: 120
max_error_rate: 0.001
personas:
  - {subject: scenario-ana-cruz, weight: 3, groups: [extensions, estimates, staff_home]}
  - {subject: scenario-hannah-leclerc, weight: 2, groups: [extensions, estimates]}
groups:
  - name: extensions
    weight: 3
    p95_ms: 500
    steps:
      - {path: "/v1/tax/extensions?tax_year=2027"}
  - name: estimates
    weight: 3
    p95_ms: 500
    steps:
      - {path: "/v1/tax/estimates?tax_year=2027"}
  - name: staff_home
    weight: 1
    p95_ms: 500
    steps:
      - {path: /v1/me}
