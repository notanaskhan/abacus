# The integration catalogue, content v1 (W-01-T10; C20 v2; SPEC-659 AC-1 to AC-5, OQ-2, OQ-4;
# DF-34, DF-35, DF-36). Reviewed content, imported as data by the platform operator through
# `python -m abacus_tools.integration_catalog import` (as abacus_ops; dry run first); never a seed,
# a constant or a migration (AGENTS 16).
#
# - The 55 Connect rows are the canvas `CX.items` list (Wave 1 WB-10 a; wave 7 WB-10 h, i for Drata
#   and Vanta, published Oct 1, 2026): the canvas wins every kit divergence (DF-36). WB-10 counts
#   53 = 9 + 38 + 6 at E0 and 55 = 9 + 40 + 6 at E2 for the synthetic tenant (9 are its installs).
# - The 7 portal-only client feeds (OQ-2: bank, Amex, Square, Shopify, payroll, BambooHR, Jira)
#   are `surfaces: [portal]`: in the data, never on WB-10. QuickBooks Online is one row on both.
# - Auth lines name no person (who connected is read time, DF-34); a declared write appears only
#   when it names a write-capability registry entry (OQ-4: Drata's and Vanta's unregistered
#   "request sync" is dropped). No vendor logo, brand colour, kit sample text or payment copy
#   (AC-5, L10, DEC-89): the icon is the category glyph, the tone the category's.
# - Scope rows and personal consent copy are the first reviewed wording, for the DF-36 sign-off.
