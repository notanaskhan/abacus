# PROTECTED (Q-03-T027; QD-4, inferred name; ADR-079; DEC-365): mutation floors per red scope.
#
# A floor is the lowest mutation score (killed and timed-out mutants over every mutant that ran,
# in percent) the scope's weekly full run may report. Floors are only ever raised: a change that
# lowers one, or removes a scope, is refused by the edit hook (.claude/hooks/_protected.py) and by
# CI (`python -m abacus_tools.quality.mutation_floors`, in `make check-fast` against origin/main
# and in mutation-floors.yml against the pull request's base). Raising a floor or adding a scope
# is a normal change; AY approves (Q-03 §6.2).
#
# Q-03-T051 (DEC-584): each floor is the scope's baseline from the weekly run of 2026-10-28
# (mutation-weekly run 40625075584), rounded down. `compute` stays 0: no `*/compute/` package
# exists yet, so no mutant ran. M8 targets 85 for identity/authz and the compute packages, 75 for
# the others. Scope names are abacus_tools.quality.mutation's SCOPES.
#
# Format (the hook parses it without PyYAML): `floors:` then one `  <scope>: <integer 0-100>` per
# line; comments and blank lines anywhere.
#
# Q-03-T147 (DEC-4817, AY approved 2026-11-13): the floors ratcheted to mutation-weekly run
# 43330118713, each score rounded down as Q-03-T051 set them. identity/authz stays 62: that run
# left 348 of its mutants not run (shard 4's timeout), so its 69.6% is not the whole scope; it is
# raised after a run that decides every mutant.
schema: 1
floors:
  identity/authz: 62
  kernel/db: 22
  kernel/uow: 6
  kernel/crypto: 70
  evidence: 23
  ai_gateway: 27
  audit_trail: 26
  compute: 74
  # N-02-T47 (DEC-1673): a new scope; the floor is raised to its first weekly baseline, target 75.
  signatures: 8
  # P-04-T59 (DEC-2065): a new scope, target 75 (ADR-079). The floor is raised to the scope's first
  # weekly baseline (a floor above it would fail the run before any survivor is triaged).
  review: 4
  # A-07-T45 (ADR-079): a new scope, target 75 for release, the archive gate, the lock, the seal
  # and post-lock additions. The floor starts at 0 and is raised to the scope's first run (a floor
  # above it would fail the run before any survivor is triaged). p95 budgets under the x25
  # profile (abacus_tools.loadtest.a07_budgets, checked on staging): release <= 3 s, lock enqueue
  # <= 500 ms, the Northwind seal <= 2 min, archived_guard() overhead <= 2 ms per row.
  assurance/release_archive: 14
  # P-10-T52 (DEC-4402): two new scopes, target 75 (ADR-079): runtime v2 (agents/runtime: the plan
  # rules, AgentRunWorkflow and its activities, waits, commands, the approved write, undo, session
  # turns, the harness, C17's runtime) and the SSE stream (kernel/realtime). Each floor starts at 0
  # and is raised to the scope's first weekly baseline after survivor triage, as for `review`.
  # p95 budgets under the x25 profile (abacus_tools.loadtest.p10_budgets, checked on staging):
  # plan approve <= 400 ms, stream first byte <= 500 ms.
  agents/runtime: 19
  kernel/realtime: 62
  # T-04-T53 (DEC-4513): the individual return's compute engines (tax/compute/individual) and the
  # tax tools, target 75 (ADR-079). The floor starts at 0 and is raised to the scope's first weekly
  # baseline after survivor triage, as for `agents/runtime`. p95 budgets under the busy-season
  # profile (abacus_tools.loadtest.t04_budgets, checked on staging): review tree <= 300 ms for 41
  # documents, worksheet fields <= 250 ms, approve <= 500 ms.
  tax/individual: 52
