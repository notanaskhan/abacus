# PROTECTED (Q-03-T066; ADR-079; chapter 10 row 2): coverage floors per red module, beside the
# global `fail_under = 95` in pyproject.toml.
#
# A floor is the lowest line or branch coverage (percent, whole numbers) a red module may show in
# stage 2 (`make ci-coverage`: the unit and integration shards combined). Floors are only ever
# raised: a change that lowers one, or removes a module, is refused by CI
# (`python -m abacus_tools.quality.coverage_floors`, in `make check-fast` against origin/main).
# Raising a floor is a normal change; AY approves.
#
# Target from S13: 97% line and 90% branch on every red module (100% line and branch on
# `*/compute/`), reached by Fri Apr 30, 2027 (Q-03-T067). DEC-907: the floors start at the measured
# baseline, as DEC-584 did for mutation: main CI run 40849655921 (faf6d152, 2026-10-29), unit and
# integration shards combined, rounded down and less one point for the drift since; each later
# measurement raises them toward the target. `compute` has no package yet, so it is unmeasured.
# Module names are abacus_tools.quality.mutation's SCOPES.
#
# Format (parsed without PyYAML): `line:` and `branch:` blocks, one `  <module>: <0-100>` per line;
# comments and blank lines anywhere.
