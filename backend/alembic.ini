# Alembic configuration (ADR-015, ADR-091). PROTECTED.
# The database URL comes from ABACUS_MIGRATIONS_DATABASE_URL (the abacus_owner role) via
# abacus.kernel.config, never from this file. Migrations run as a separate step, never at startup.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
