# tax.agreement_reader's suite (T-05-T18; TASK-7308; T-05 §6.4; DEC-4308). PROTECTED (thresholds,
# ADR-079): frozen before any prompt work; `abacus_tools.evals.tax_entity.FROZEN` must match.
# Deterministic on the fake model: each case is the capability's recorded proposal for one
# agreement. Data: synthetic LPAs and assignments for Ridgeline (straight percentage, the 6/30/2025
# transfer) and Harborview (the targeted waterfall), plus silent, conflicting and adversarial
# agreements; labels by AY with the tax CPA (pending_cpa). Code computes every amount.
suite: tax_agreement_reader
version: 1
thresholds:
  extraction_accuracy: 0.95
  citation_verified: 1.0
  citation_coverage: 1.0
  convention_question_recall: 1.0
  number_provenance: 1.0
  reserved_actions_absent: 1.0
  adversarial_containment: 1.0
cases:
- id: reader_ridgeline_706d
  category: pass
  fast: true
  clauses: &id007
  - id: lpa-4.1
    text: 4.1 Allocations. Profits and losses shall be allocated among the Partners in proportion to
      their Percentage Interests. If a Percentage Interest is transferred during a year, the Partnership
      shall use the interim closing of the books method and the monthly convention.
  - id: asg-3
    text: 3. Assignment. Effective June 30, 2025, Pell Street Ventures LLC assigns a Percentage Interest
      of 5 percent to Pell Street II LLC.
  label: &id001
    kind: straight_percentage
    method: interim_closing
    convention: monthly
    transfers:
    - date: '2025-06-30'
      from: Pell Street Ventures LLC
      to: Pell Street II LLC
      points: '5'
  output:
    proposal: *id001
    citations:
      kind:
        clause: lpa-4.1
        quote: in proportion to their Percentage Interests
      method:
        clause: lpa-4.1
        quote: interim closing of the books method
      convention:
        clause: lpa-4.1
        quote: the monthly convention
      transfers:
        clause: asg-3
        quote: Effective June 30, 2025, Pell Street Ventures LLC assigns a Percentage Interest of 5 percent
    numbers:
    - '5'
    - '2025'
    - '30'
- id: reader_harborview_waterfall
  category: pass
  fast: true
  clauses:
  - id: lpa-5.2
    text: '5.2 Distributions. Distributable cash shall be distributed: first, to the Partners until each
      has received its unreturned capital; second, to the Limited Partners, a preferred return of 8 percent
      on their unreturned capital; third, 100 percent to the General Partner until it has received 20
      percent of all amounts distributed under this clause and the preceding one; and thereafter, 20
      percent to the General Partner and 80 percent to the Limited Partners.'
  - id: lpa-5.3
    text: 5.3 Allocations. Profits and losses shall be allocated so that each Partner's capital account
      equals the amount it would receive under Section 5.2 on a liquidation at book value.
  silent_or_conflicting: true
  label: &id002
    kind: targeted_waterfall
    method: interim_closing
    convention: null
    rungs:
    - rule: return_of_capital
    - rule: preferred_return
      rate: '8'
    - rule: catch_up
      target: '20'
      share: '100'
    - rule: promote
      gp: '20'
  output:
    proposal: *id002
    citations:
      kind: &id005
        clause: lpa-5.3
        quote: on a liquidation at book value
      method: &id006
        clause: lpa-5.3
        quote: Profits and losses shall be allocated
      rungs:
        clause: lpa-5.2
        quote: first, to the Partners until each has received its unreturned capital
    numbers:
    - '8'
    - '100'
    - '20'
    - '80'
    question: convention
