# Runtime v2 trajectory and conversation suite (P-10-T34; TASK-6708). PROTECTED (thresholds,
# ADR-079). Deterministic and code-only: each case is a recorded agent trajectory (FakeModel
# trajectories, no model call) graded by abacus_tools.evals.trajectory's twelve graders. A case
# passes when every grader passes except its `seeded_failures`, which must fail: every grader has a
# seeded failing case here. `fast: true` cases run in stage 3 when a tool.<name> prompt changes.
