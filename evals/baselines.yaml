# Protected evaluation cost baselines (Q-02-T06; ADR-069/070; SPEC-033 Q5). PROTECTED: a change
# is a reviewed policy change, never a regeneration.
#
# `<agent>: {<tier>: "<USD per file>"}`. The gate (`abacus_tools.evals.gate`) fails a real-model
# run whose median per-file cost is more than 10 % over its baseline (COST_TOLERANCE); a
# real-model run with no baseline fails as `cost_regression:no_baseline`.
#
# evidence.matcher v3 (N-01-T26; N-01 OQ-11; DEC-1380): intake mode's budget is $0.015 a file on
# the small tier (v2's engagement mode was $0.01), so the gate fails above $0.0165 a file.
evidence.matcher:
  small: "0.015"
# workpapers.section_drafter v1-v3 (A-04-T14, A-05-T14; A-05 §6; DEC-1958): $0.25 a section on the
# medium tier, the EBP modes' baseline (chapter 05 §5.5.5, inferred); the planning modes' $0.15
# budget sits under it. The gate fails a real run above $0.275 a section.
workpapers.section_drafter:
  medium: "0.25"
