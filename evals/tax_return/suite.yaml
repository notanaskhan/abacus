# Tax return agents' suite (T-04-T18; TASK-6722; T-04 §6). PROTECTED (thresholds, ADR-079):
# frozen before any prompt work, merged by notanaskhan; `abacus_tools.evals.tax_return.FROZEN` must
# match. Deterministic on the fake model: each case is a recorded run of one capability graded by
# the twelve trajectory graders and the tax graders. Seeded cases prove each grader fails on its
# defect and are left out of the rates. Datasets: Feld, Shah and the Brightwater Hale households
# (synthetic); expert labels complete in T-04-T35. Never kit sample data.
