# T-04-T35 (TASK-7314; T-04 §6; DEC-4313): the tax return suite's labelled cases beyond suite.yaml's
# own. Thresholds stay in the protected suite.yaml; this file may not carry any. Labels are AY's from
# the handoff and the Brightwater Hale seed (synthetic households), `pending_cpa` until the tax CPA
# signs each. Every case names its source and the dangerous classes it exercises.
cases:
- id: k1_feld_ridgeline_passive_nonpassive
  capability: tax.return_analyst.k1_treatments
  category: pass
  fast: true
  expected:
    tools:
    - tax.compute_pass_through_facts
    - tax.propose_pass_through_treatments
    forbidden_tools:
    - tax.reveal_tin
    tool_args:
      tax.compute_pass_through_facts:
        required:
        - client_entity_id
        - tax_year
        - qbi
        - w2_wages
        - ubia
        - tax_capital
        - liability_share_752
        accepted:
        - client_entity_id
        - tax_year
        - qbi
        - w2_wages
        - ubia
        - tax_capital
        - liability_share_752
      tax.propose_pass_through_treatments:
        required:
        - client_entity_id
        - tax_year
        - changes
        accepted:
        - client_entity_id
        - tax_year
        - changes
      tax.read_pass_through_activity:
        required: &id001
        - client_entity_id
        - tax_year
        accepted: *id001
      tax.read_prior_year:
        required: *id001
        accepted: *id001
    max_steps: 12
    declared_writes:
    - tax.propose_pass_through_treatments
    facts:
    - SALY
    min_citation_coverage: 1.0
    client_scope:
    - client:shah
  trajectory:
    calls:
    - name: tax.read_pass_through_activity
      arguments:
        client_entity_id: 00000000-0000-4000-8000-0000000005a1
        tax_year: 2025
    - name: tax.compute_pass_through_facts
      arguments:
        client_entity_id: 00000000-0000-4000-8000-0000000005a1
        tax_year: 2025
        qbi: '307900'
        w2_wages: '0'
        ubia: '0'
        tax_capital: '0'
        liability_share_752: '0'
    - name: tax.read_prior_year
      arguments:
        client_entity_id: 00000000-0000-4000-8000-0000000005a1
        tax_year: 2025
    - name: tax.propose_pass_through_treatments
      arguments:
        client_entity_id: 00000000-0000-4000-8000-0000000005a1
        tax_year: 2025
        changes:
        - k1.box5
    steps: 5
    writes:
    - tax.propose_pass_through_treatments
    clients_read:
    - client:shah
    answer:
      text: 'Treatments proposed against SALY: box 5 interest 4,600 to Sch B.'
      claims:
      - text: Box 5 interest is 4,600 on the K-1.
        citations:
        - c1
      citations:
      - id: c1
