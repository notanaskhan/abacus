# tax.account_mapper's suite (T-05-T18; TASK-7308; T-05 §6.4; DEC-4308). PROTECTED (thresholds,
# ADR-079): frozen before any prompt work; `abacus_tools.evals.tax_entity.FROZEN` must match.
# Deterministic on the fake model: each case is the capability's recorded output for one account
# (code and name only, never an amount). Data: Ridgeline's chart as TXP-02 draws it (Brightwater
# Hale, synthetic); labels by AY with the tax CPA, `label_status` pending_cpa until signed.
# Ambiguous and adversarial accounts are synthetic eval inputs. `calibration` is 1 - ECE.
