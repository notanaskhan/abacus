- id: ro_northwind_receivable_1
  group: read_only
  de:
  - DE-3
  fast: true
  repeat: 3
  note: 'WB-02 e: Why did contributions receivable go from $0 at 1/1/2025 to $48,600 at 12/31/2025?'
  expected:
    tools:
    - evidence.read_extraction
    - assurance.read_materiality
    max_steps: 24
    declared_writes: []
    facts:
    - $48,600.00
    - $16,812,400.00
    - $16,861,000.00
    - Margaret Okonkwo
    min_citation_coverage: 1.0
    client_scope:
    - client:northwind
    read_only: true
  turn:
    kind: answer
    calls:
    - name: evidence.read_extraction
      arguments:
        document_id: 00000000-0000-4000-8000-00000000d001
        cells:
        - C14
    - name: evidence.read_extraction
      arguments:
        document_id: 00000000-0000-4000-8000-00000000d002
        cells:
        - B9
    - name: assurance.read_materiality
      arguments:
        engagement_id: 00000000-0000-4000-8000-0000000004e1
        version: 2
    - name: workpapers.read_section
      arguments:
        workpaper_id: 00000000-0000-4000-8000-00000000a001
        section: internal_control
    steps: 4
    clients_read:
    - client:northwind
    answer:
      text: Contributions receivable is $48,600.00 at 12/31/2025 against $0.00 at 1/1/2025. It is the
        participant deferrals withheld from the Dec 26, 2025 payroll and the employer match on that payroll,
        deposited with Keystone on Jan 9, 2026 [1][2]. Planning materiality used unadjusted net assets
        of $16,812,400.00, which excludes this receivable; net assets including it are $16,861,000.00.
        The deposit timing is already open in Internal Control (Exceptions!D2); its severity is for Margaret
        Okonkwo to conclude.
      claims:
      - text: Contributions receivable is $48,600.00 at 12/31/2025.
        citations:
        - c1
      - text: It was deposited with Keystone on Jan 9, 2026.
        citations:
        - c2
      - text: Net assets including it are $16,861,000.00.
        citations:
        - f1
      citations:
      - id: c1
        verified: true
      - id: c2
        verified: true
      - id: f1
        verified: true
      numbers:
      - text: $48,600.00
        source: citation
      - text: $0.00
        source: code_fact
      - text: $16,812,400.00
        source: code_fact
      - text: $16,861,000.00
        source: code_fact
